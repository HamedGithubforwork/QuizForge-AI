name: Migrate Supabase credentials to Cognito

on:
  pull_request:
    paths:
      - ".github/workflows/lightsail-supabase-auth-migration.yml"
      - "scripts/production/lightsail/migrate_supabase_auth_to_cognito.py"
      - "scripts/production/lightsail/test_migrate_supabase_auth_to_cognito.py"
      - "scripts/production/cognito_identity_import.py"
      - "scripts/production/database.py"
      - "scripts/production/lightsail/cognito_hash_import_preflight.py"
  push:
    branches: [main]
    paths:
      - "ops/live-auth-migration-trigger.txt"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - name: Install locked migration dependencies
        run: python -m pip install --require-hashes -r scripts/rds_rehearsal/requirements.lock
      - name: Validate credential migration modules
        run: |
          python -m py_compile             scripts/production/lightsail/migrate_supabase_auth_to_cognito.py             scripts/production/cognito_identity_import.py
          python -m unittest scripts.production.lightsail.test_migrate_supabase_auth_to_cognito -v

  migrate:
    needs: validate
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'HamedGithubforwork/QuizForge-AI' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: quizfromnotes-live-auth-migration
      cancel-in-progress: false
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      LIGHTSAIL_ADMIN_IPV4_CIDR: ${{ secrets.LIGHTSAIL_ADMIN_IPV4_CIDR }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - name: Install locked migration dependencies
        run: python -m pip install --require-hashes -r scripts/rds_rehearsal/requirements.lock
      - name: Assume credential-migration-only AWS session
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: qf-supabase-auth-migration
          role-duration-seconds: 1500
          aws-region: ca-central-1
          mask-aws-account-id: true
          unset-current-credentials: true
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[
              {"Effect":"Allow","Action":["sts:GetCallerIdentity"],"Resource":"*"},
              {"Effect":"Allow","Action":[
                "cognito-idp:ListUserPools","cognito-idp:ListUserPoolClients","cognito-idp:DescribeUserPool",
                "cognito-idp:DescribeUserPoolClient","cognito-idp:GetUserPoolMfaConfig","cognito-idp:GetCSVHeader",
                "cognito-idp:ListUsers","cognito-idp:CreateUserImportJob","cognito-idp:StartUserImportJob",
                "cognito-idp:DescribeUserImportJob"
              ],"Resource":"*"},
              {"Effect":"Allow","Action":["iam:CreateRole","iam:GetRole","iam:PutRolePolicy","iam:DeleteRolePolicy","iam:DeleteRole","iam:PassRole"],
               "Resource":"arn:aws:iam::*:role/quizforge-production-cognito-import-preflight"},
              {"Effect":"Allow","Action":["ssm:GetParameter","ssm:PutParameter"],
               "Resource":"arn:aws:ssm:ca-central-1:*:parameter/quizforge/migration/cognito-auth-import-state"},
              {"Effect":"Allow","Action":[
                "lightsail:GetInstance","lightsail:GetStaticIp","lightsail:GetInstancePortStates",
                "lightsail:OpenInstancePublicPorts","lightsail:CloseInstancePublicPorts","lightsail:GetInstanceAccessDetails"
              ],"Resource":"*"}
            ]}
      - name: Import frozen Supabase passwords and attach Cognito identities
        run: python -m scripts.production.lightsail.migrate_supabase_auth_to_cognito
      - name: Publish only sanitized migration result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: permanent-supabase-auth-migration
          path: cognito-auth-migration-results/summary.json
          if-no-files-found: error
          retention-days: 30
