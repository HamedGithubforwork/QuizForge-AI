name: Permanent Lightsail runtime initialization and local acceptance

on:
  pull_request:
    paths:
      - ".github/workflows/lightsail-runtime-initialize.yml"
      - "scripts/production/lightsail/initialize_runtime.py"
      - "scripts/production/lightsail/test_initialize_runtime.py"
      - "scripts/production/lightsail/ssh-host-pins.json"
      - "scripts/production/lightsail/release-lock.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/lightsail-runtime-initialize.yml"
      - "scripts/production/lightsail/initialize_runtime.py"
      - "scripts/production/lightsail/test_initialize_runtime.py"
      - "scripts/production/lightsail/ssh-host-pins.json"
      - "scripts/production/lightsail/release-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - name: Compile and test local runtime initialization gate
        run: |
          python -m py_compile scripts/production/lightsail/initialize_runtime.py
          python -m unittest scripts.production.lightsail.test_initialize_runtime -v
      - name: Require immutable AI-disabled staged release
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          lock=json.loads(Path("scripts/production/lightsail/release-lock.json").read_text())
          assert lock["schema"]==1
          assert re.fullmatch(r"[0-9a-f]{40}",lock["release_sha"])
          assert lock["public_configuration_validated"] is True
          assert lock["ai_enabled"] is False
          PY

  initialize:
    needs: validate
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'HamedGithubforwork/QuizForge-AI'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: quizforge-permanent-lightsail-runtime-initialize
      cancel-in-progress: false
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      LIGHTSAIL_ADMIN_IPV4_CIDR: ${{ secrets.LIGHTSAIL_ADMIN_IPV4_CIDR }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"

      - name: Install existing hash-locked AWS SDK dependencies
        run: python -m pip install --require-hashes -r scripts/rds_rehearsal/requirements.lock

      - name: Read exact reviewed release SHA
        run: |
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          lock=json.loads(Path("scripts/production/lightsail/release-lock.json").read_text())
          sha=lock["release_sha"]
          assert re.fullmatch(r"[0-9a-f]{40}",sha)
          assert lock["ai_enabled"] is False
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as out:
              out.write("QF_RELEASE_SHA="+sha+"\n")
          PY

      - name: Assume deployment role with runtime-initialization-only boundary
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: qf-lightsail-runtime-initialize
          role-duration-seconds: 1800
          aws-region: ca-central-1
          mask-aws-account-id: true
          unset-current-credentials: true
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{
              "Effect":"Allow",
              "Action":[
                "lightsail:GetInstance",
                "lightsail:GetStaticIp",
                "lightsail:GetInstancePortStates",
                "lightsail:OpenInstancePublicPorts",
                "lightsail:CloseInstancePublicPorts",
                "lightsail:GetInstanceAccessDetails"
              ],
              "Resource":"*"
            }]}

      - name: Initialize private runtime and run local-only acceptance
        run: python -m scripts.production.lightsail.initialize_runtime

      - name: Publish only sanitized local acceptance result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: permanent-lightsail-runtime-initialization
          path: lightsail-runtime-init-results/summary.json
          if-no-files-found: error
          retention-days: 14
