name: Internal retained backup cloud operations

on:
  workflow_call:
    inputs:
      operation:
        type: string
        required: true
      reviewed_manifest_sha256:
        type: string
        required: false
        default: ''
      confirmation:
        type: string
        required: false
        default: ''
    secrets:
      QF_ROLE_ARN:
        required: true
      QF_STATE_BUCKET:
        required: true
      AWS_BUDGET_ALERT_EMAIL:
        required: true

permissions:
  contents: read

jobs:
  backup:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'HamedGithubforwork/QuizForge-AI'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: quizforge-lightsail-backups-isolated-state
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 62e39f33d715cc83928390cfd5ff1728008c4053
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.16'
      - name: Install existing hash-locked AWS SDK dependencies
        run: python -m pip install --require-hashes -r scripts/production/requirements.lock
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.14.7'
          terraform_wrapper: false
      - name: Inspect, activate, or verify only the retained backup stack
        env:
          QF_OPERATION: ${{ inputs.operation }}
          QF_REVIEWED_MANIFEST: ${{ inputs.reviewed_manifest_sha256 }}
          QF_CONFIRMATION: ${{ inputs.confirmation }}
          QF_ROLE_ARN: ${{ secrets.QF_ROLE_ARN }}
          QF_STATE_BUCKET: ${{ secrets.QF_STATE_BUCKET }}
          AWS_BUDGET_ALERT_EMAIL: ${{ secrets.AWS_BUDGET_ALERT_EMAIL }}
          TF_WORKSPACE: default
          AWS_EC2_METADATA_DISABLED: 'true'
        run: python -m scripts.backup_activation.runner
      - name: Publish only the allowlisted non-sensitive summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: retained-backup-activation-summary
          path: backup-activation-results/summary.json
          if-no-files-found: ignore
          retention-days: 30
