name: Permanent Lightsail bootstrap root-cause diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/lightsail-bootstrap-diagnostic.yml"
      - "scripts/production/lightsail/bootstrap_diagnose.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/lightsail-bootstrap-diagnostic.yml"
      - "scripts/production/lightsail/bootstrap_diagnose.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - name: Compile bootstrap diagnostic
        run: python -m py_compile scripts/production/lightsail/bootstrap_diagnose.py

  diagnose:
    needs: validate
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'HamedGithubforwork/QuizForge-AI'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: quizforge-lightsail-bootstrap-diagnostic
      cancel-in-progress: false
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      LIGHTSAIL_ADMIN_IPV4_CIDR: ${{ secrets.LIGHTSAIL_ADMIN_IPV4_CIDR }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"

      - name: Install existing hash-locked AWS SDK dependencies
        run: python -m pip install --require-hashes -r scripts/rds_rehearsal/requirements.lock

      - name: Assume deployment role with diagnostic-only SSH boundary
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: qf-lightsail-bootstrap-diagnostic
          role-duration-seconds: 900
          aws-region: ca-central-1
          mask-aws-account-id: true
          unset-current-credentials: true
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{
              "Effect":"Allow",
              "Action":[
                "lightsail:GetInstance",
                "lightsail:GetStaticIp",
                "lightsail:GetInstancePortStates",
                "lightsail:OpenInstancePublicPorts",
                "lightsail:CloseInstancePublicPorts",
                "lightsail:GetInstanceAccessDetails"
              ],
              "Resource":"*"
            }]}

      - name: Diagnose failed base-host bootstrap without modifying host files
        run: python -m scripts.production.lightsail.bootstrap_diagnose

      - name: Publish only sanitized bootstrap findings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: permanent-lightsail-bootstrap-diagnostic
          path: lightsail-bootstrap-diagnostic/summary.json
          if-no-files-found: error
          retention-days: 7
