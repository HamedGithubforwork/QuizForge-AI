name: Diagnose permanent Lightsail temporary SSH auth

on:
  pull_request:
    paths:
      - ".github/workflows/lightsail-temp-ssh-auth-diagnostic.yml"
      - "scripts/production/lightsail/diagnose_temp_ssh_auth.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/lightsail-temp-ssh-auth-diagnostic.yml"
      - "scripts/production/lightsail/diagnose_temp_ssh_auth.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - run: python -m py_compile scripts/production/lightsail/diagnose_temp_ssh_auth.py

  diagnose:
    needs: validate
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'HamedGithubforwork/QuizForge-AI'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      LIGHTSAIL_ADMIN_IPV4_CIDR: ${{ secrets.LIGHTSAIL_ADMIN_IPV4_CIDR }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - name: Install locked AWS SDK dependencies
        run: python -m pip install --require-hashes -r scripts/rds_rehearsal/requirements.lock
      - name: Assume read-only-plus-runner-SSH diagnostic boundary
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: qf-temp-ssh-diagnostic
          role-duration-seconds: 900
          aws-region: ca-central-1
          mask-aws-account-id: true
          unset-current-credentials: true
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{
              "Effect":"Allow","Action":[
                "lightsail:GetInstance","lightsail:GetStaticIp","lightsail:GetInstancePortStates",
                "lightsail:OpenInstancePublicPorts","lightsail:CloseInstancePublicPorts",
                "lightsail:GetInstanceAccessDetails"
              ],"Resource":"*"
            }]}
      - name: Diagnose temporary SSH authentication without host changes
        run: python -m scripts.production.lightsail.diagnose_temp_ssh_auth
      - name: Publish only sanitized SSH diagnostic
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: permanent-lightsail-temp-ssh-diagnostic
          path: lightsail-temp-ssh-results/summary.json
          if-no-files-found: error
          retention-days: 7
