name: AWS Terraform

on:
  pull_request:
    paths:
      - "infra/aws/**"
      - ".github/workflows/terraform-aws.yml"
  push:
    branches:
      - main
    paths:
      - "infra/aws/*.tf"
      - "infra/aws/.terraform.lock.hcl"
      - ".github/workflows/terraform-aws.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-aws-foundation
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  changes:
    name: Detect foundation resource changes
    runs-on: ubuntu-latest
    outputs:
      foundation: ${{ steps.scope.outputs.foundation }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          changed=false
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            changed=true
          elif [ "$EVENT_NAME" = push ]; then
            if git diff --name-only "$BEFORE_SHA" "$HEAD_SHA" -- ':(glob)infra/aws/*.tf' infra/aws/.terraform.lock.hcl | rg -q .; then
              changed=true
            fi
          fi
          echo "foundation=$changed" >> "$GITHUB_OUTPUT"
  validate:
    name: Terraform validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/aws

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize without remote backend
        run: terraform init -backend=false

      - name: Validate configuration
        run: terraform validate

  apply:
    name: Terraform apply
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' && needs.changes.outputs.foundation == 'true'
    needs:
      - validate
      - changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/aws

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Initialize remote state
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=quizforge/foundation/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Select the latest main-workflow image only
        shell: bash
        run: |
          set -euo pipefail
          tag="$(aws ecr describe-images --repository-name quizforge-api --output json |
            jq -r '[.imageDetails[] | . as $image | (.imageTags // [])[] | select(test("^[0-9a-f]{40}$")) | {tag: ., pushed: $image.imagePushedAt}] | sort_by(.pushed) | last | .tag // empty')"
          test -n "$tag"
          echo "TF_VAR_backend_image_tag=$tag" >> "$GITHUB_ENV"

      - name: Create Terraform plan
        run: terraform plan -out=tfplan -var="aws_region=${{ vars.AWS_REGION }}"

      - name: Apply Terraform plan
        run: terraform apply -auto-approve tfplan
