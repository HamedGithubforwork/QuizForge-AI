name: AWS staging environment

on:
  pull_request:
    paths:
      - "infra/aws/staging/**"
      - ".github/workflows/aws-staging.yml"
  workflow_dispatch:
    inputs:
      operation:
        description: "Start or stop the temporary AWS staging environment"
        required: true
        type: choice
        options:
          - start
          - stop
  schedule:
    # Safety shutdown so a forgotten staging environment does not run indefinitely.
    - cron: "0 8 * * *"

permissions:
  contents: read

concurrency:
  group: quizforge-aws-staging
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  validate:
    name: Validate staging Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/aws/staging

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize without remote backend
        run: terraform init -backend=false

      - name: Validate configuration
        run: terraform validate

  operate:
    name: Operate temporary staging
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs:
      - validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/aws/staging
    env:
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_foundation_state_bucket: ${{ vars.TF_STATE_BUCKET }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Require main for manual operations
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Run staging operations from the main branch only."
            exit 1
          fi

      - name: Resolve requested operation
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "OPERATION=stop" >> "$GITHUB_ENV"
            echo "Nightly staging safety shutdown selected."
          else
            echo "OPERATION=${{ inputs.operation }}" >> "$GITHUB_ENV"
          fi

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Initialize staging state
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=quizforge/staging/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Start staging
        if: env.OPERATION == 'start'
        run: terraform apply -auto-approve

      - name: Wait for staging API
        if: env.OPERATION == 'start'
        shell: bash
        run: |
          cluster="$(terraform output -raw ecs_cluster_name)"
          service="$(terraform output -raw ecs_service_name)"
          url="$(terraform output -raw api_http_url)"

          aws ecs wait services-stable \
            --cluster "$cluster" \
            --services "$service"

          for attempt in $(seq 1 36); do
            if curl --fail --silent --show-error \
              --max-time 5 "$url/api/health" >/dev/null; then
              echo "QuizForge staging is healthy: $url"
              echo "STAGING_URL=$url" >> "$GITHUB_ENV"
              exit 0
            fi

            echo "Waiting for $url (attempt $attempt/36)..."
            sleep 5
          done

          echo "The staging API did not become reachable in time."
          exit 1

      - name: Verify staging canary credentials
        if: env.OPERATION == 'start'
        shell: bash
        env:
          QUIZFORGE_CANARY_EMAIL: ${{ secrets.QUIZFORGE_CANARY_EMAIL }}
          QUIZFORGE_CANARY_PASSWORD: ${{ secrets.QUIZFORGE_CANARY_PASSWORD }}
        run: |
          if [ -z "$QUIZFORGE_CANARY_EMAIL" ] || [ -z "$QUIZFORGE_CANARY_PASSWORD" ]; then
            echo "::error::Configure QUIZFORGE_CANARY_EMAIL and QUIZFORGE_CANARY_PASSWORD before starting AWS staging."
            exit 1
          fi

      - name: Run authenticated staging canary
        if: env.OPERATION == 'start'
        shell: bash
        env:
          QUIZFORGE_CANARY_EMAIL: ${{ secrets.QUIZFORGE_CANARY_EMAIL }}
          QUIZFORGE_CANARY_PASSWORD: ${{ secrets.QUIZFORGE_CANARY_PASSWORD }}
        run: |
          set -euo pipefail

          supabase_url="$(aws ssm get-parameter \
            --name /quizforge/prod/SUPABASE_URL \
            --query 'Parameter.Value' \
            --output text)"
          supabase_key="$(aws ssm get-parameter \
            --name /quizforge/prod/SUPABASE_PUBLISHABLE_KEY \
            --with-decryption \
            --query 'Parameter.Value' \
            --output text)"

          auth_payload="$(jq -n \
            --arg email "$QUIZFORGE_CANARY_EMAIL" \
            --arg password "$QUIZFORGE_CANARY_PASSWORD" \
            '{email: $email, password: $password}')"

          auth_response="$(curl --fail --silent --show-error \
            --max-time 15 \
            --request POST \
            --header "apikey: $supabase_key" \
            --header "Content-Type: application/json" \
            --data "$auth_payload" \
            "$supabase_url/auth/v1/token?grant_type=password")"

          access_token="$(printf '%s' "$auth_response" | jq -r '.access_token // empty')"

          if [ -z "$access_token" ]; then
            echo "The dedicated Supabase canary account did not return an access token."
            exit 1
          fi

          missing_document_sha="$(printf '0%.0s' {1..64})"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          status="$(curl --silent --show-error \
            --max-time 15 \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $access_token" \
            "$STAGING_URL/api/documents/$missing_document_sha/pages/1")"

          if [ "$status" != "410" ]; then
            echo "Expected the protected staging endpoint to return 410 after authentication; received $status."
            exit 1
          fi

          if ! jq -e \
            '.detail | type == "string" and contains("Processed document expired or is unavailable.")' \
            "$response_file" >/dev/null; then
            echo "The protected staging endpoint returned an unexpected response body."
            exit 1
          fi

          echo "Authenticated staging canary passed through ALB -> ECS -> FastAPI -> Supabase Auth."

      - name: Run managed Valkey smoke test
        if: env.OPERATION == 'start'
        shell: bash
        run: |
          set -euo pipefail

          cluster="$(terraform output -raw ecs_cluster_name)"
          task_definition="$(terraform output -raw ecs_task_definition_arn)"
          security_group="$(terraform output -raw app_security_group_id)"
          subnets="$(terraform output -json public_subnet_ids | jq -r 'join(",")')"

          python_code="$(cat <<'PY'
          import os
          import uuid
          from redis import Redis

          client = Redis.from_url(
              os.environ["REDIS_URL"],
              encoding="utf-8",
              decode_responses=True,
              socket_connect_timeout=5,
              socket_timeout=5,
          )

          assert client.ping() is True

          prefix = f"quizforge:staging:valkey-smoke:{uuid.uuid4().hex}"
          value_key = f"{prefix}:value"
          counter_key = f"{prefix}:counter"

          client.set(value_key, "ok", ex=60)
          assert client.get(value_key) == "ok"

          script = """
          local current = redis.call('INCR', KEYS[1])
          if current == 1 then
              redis.call('EXPIRE', KEYS[1], ARGV[1])
          end
          return current
          """
          assert int(client.eval(script, 1, counter_key, 60)) == 1

          client.delete(value_key, counter_key)
          client.close()
          print("Valkey runtime smoke passed.")
          PY
          )"

          overrides="$(jq -cn --arg code "$python_code" \
            '{containerOverrides:[{name:"api",command:["python","-c",$code]}]}')"

          response="$(aws ecs run-task \
            --cluster "$cluster" \
            --launch-type FARGATE \
            --task-definition "$task_definition" \
            --count 1 \
            --network-configuration "awsvpcConfiguration={subnets=[$subnets],securityGroups=[$security_group],assignPublicIp=ENABLED}" \
            --overrides "$overrides")"

          task_arn="$(printf '%s' "$response" | jq -r '.tasks[0].taskArn // empty')"

          if [ -z "$task_arn" ]; then
            printf '%s\n' "$response"
            echo "ECS did not return a task ARN for the Valkey smoke test."
            exit 1
          fi

          aws ecs wait tasks-stopped \
            --cluster "$cluster" \
            --tasks "$task_arn"

          description="$(aws ecs describe-tasks \
            --cluster "$cluster" \
            --tasks "$task_arn")"
          exit_code="$(printf '%s' "$description" | jq -r '.tasks[0].containers[0].exitCode // 1')"

          if [ "$exit_code" != "0" ]; then
            printf '%s\n' "$description"
            aws logs tail /quizforge/api --since 10m --format short || true
            echo "Managed Valkey smoke test failed."
            exit 1
          fi

          echo "Managed staging Valkey smoke passed."

      - name: Show recent API logs on failed start
        if: failure() && env.OPERATION == 'start'
        run: aws logs tail /quizforge/api --since 15m --format short || true

      - name: Clean up failed start
        if: failure() && env.OPERATION == 'start'
        run: terraform destroy -auto-approve || true

      - name: Stop staging
        if: env.OPERATION == 'stop'
        run: terraform destroy -auto-approve

      - name: Confirm result
        if: success()
        shell: bash
        run: |
          if [ "$OPERATION" = "start" ]; then
            echo "Staging is running at ${STAGING_URL}."
            echo "Health, authenticated, and managed Valkey canaries all passed."
            echo "Run this workflow with operation=stop when you finish."
          else
            echo "Staging is stopped. ALB, ECS service, and ephemeral Valkey resources are no longer running."
          fi
