name: Local AI internal preview package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - desktop/src/local-runtime-manifest.json
      - desktop/src/local-ai-distribution-policy.json
      - desktop/src/local-quiz-service.cjs
      - desktop/third_party/local-ai/**
      - desktop/scripts/stage-local-runtime.cjs
      - desktop/scripts/verify-packaged-runtime.cjs
      - desktop/build/local-ai-preview.cjs
      - desktop/build/local-ai-preview-installer.nsh
      - desktop/src/main.cjs
      - desktop/src/native-bridge.cjs
      - desktop/src/preload.cjs
      - desktop/src/policy.cjs
      - desktop/src/local-renderer.cjs
      - desktop/test/local-renderer.test.cjs
      - desktop/test/local-ai-distribution.test.cjs
      - desktop/test/policy.test.cjs
      - desktop/README.md
      - docs/local-ai-distribution-review.md
      - ARCHITECTURE.md
      - desktop/package.json
      - desktop/package-lock.json
      - desktop/test/local-ai-preview-installer.ps1
      - desktop/scripts/verify-local-ui.cjs
      - frontend/index.html
      - frontend/package.json
      - frontend/package-lock.json
      - frontend/src/**
      - frontend/vite.config.ts
      - .github/workflows/local-ai-preview-package.yml

permissions:
  contents: read

concurrency:
  group: local-ai-preview-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-package:
    name: Windows Local AI internal preview
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install and audit desktop dependencies
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm audit --audit-level=moderate
          exit $LASTEXITCODE

      - name: Run desktop unit and contract tests
        run: npm test

      - name: Build the branch frontend for the desktop preview
        shell: pwsh
        run: |
          npm ci --prefix ../frontend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build --prefix ../frontend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-local-ui.cjs ../frontend/dist
          exit $LASTEXITCODE
        env:
          QFN_DESKTOP_BUNDLE: 'true'

      - name: Download and stage pinned server-only runtime
        shell: pwsh
        working-directory: .
        run: |
          $ErrorActionPreference = 'Stop'
          curl.exe -fL --max-time 180 -o "$env:RUNNER_TEMP/runtime.zip" 'https://github.com/ggml-org/llama.cpp/releases/download/b11317/llama-b11317-bin-win-vulkan-x64.zip'
          if ($LASTEXITCODE -ne 0) { throw 'Runtime download failed' }
          if ((Get-FileHash "$env:RUNNER_TEMP/runtime.zip" -Algorithm SHA256).Hash.ToLower() -ne 'b0cb46635aa4a028c272b74dc1966178b57157b4be199985e4d5e62cc6664338') { throw 'Runtime checksum mismatch' }
          Expand-Archive "$env:RUNNER_TEMP/runtime.zip" "$env:RUNNER_TEMP/runtime-full"
          New-Item -ItemType Directory "$env:RUNNER_TEMP/local-ai-runtime"
          node desktop/scripts/stage-local-runtime.cjs "$env:RUNNER_TEMP/runtime-full" "$env:RUNNER_TEMP/local-ai-runtime"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node desktop/scripts/verify-packaged-runtime.cjs "$env:RUNNER_TEMP/local-ai-runtime"
          exit $LASTEXITCODE

      - name: Download and verify optional pinned Local AI model
        shell: pwsh
        working-directory: .
        run: |
          $ErrorActionPreference = 'Stop'
          node desktop/scripts/download-verified-model.cjs "$env:RUNNER_TEMP/local-ai-model"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $model = Join-Path "$env:RUNNER_TEMP/local-ai-model" '7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5.gguf'
          if ((Get-FileHash $model -Algorithm SHA256).Hash.ToLowerInvariant() -ne '7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5') { throw 'Model checksum mismatch before packaging.' }
          exit $LASTEXITCODE

      - name: Build unpacked Local AI preview
        run: npm run pack:local-ai-preview-dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          QFN_LOCAL_AI_RUNTIME_DIR: ${{ runner.temp }}\local-ai-runtime

      - name: Build previous-version installer for replacement acceptance
        run: npx --no-install electron-builder --win nsis --x64 --publish never '-c.extraMetadata.version=0.0.1' '-c.directories.output=dist-previous'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Reverify runtime inside packaged resources
        run: node scripts/verify-packaged-runtime.cjs "dist/local-ai-preview/win-unpacked/resources/local-ai-runtime"

      - name: Verify the bundled branch interface inside the app
        run: node scripts/verify-local-ui.cjs "dist/local-ai-preview/win-unpacked/resources/app-ui"

      - name: Launch and close unpacked preview
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'dist/local-ai-preview/win-unpacked/Quiz From Notes Preview.exe'
          if (-not (Test-Path $exe)) { throw 'Local AI preview executable is missing.' }
          $process = Start-Process -FilePath $exe -PassThru
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(45)
            do {
              Start-Sleep -Milliseconds 500
              $process.Refresh()
              if ($process.HasExited) { throw 'Local AI preview exited before displaying a window.' }
            } while ($process.MainWindowHandle -eq 0 -and [DateTime]::UtcNow -lt $deadline)
            if ($process.MainWindowHandle -eq 0) { throw 'Local AI preview did not display a window.' }
            if ($process.MainWindowTitle -notlike 'Quiz From Notes*Local AI*') { throw 'The packaged Local AI renderer did not open.' }
            if (-not $process.CloseMainWindow() -or -not $process.WaitForExit(15000)) { throw 'Local AI preview did not close cleanly.' }
          } finally {
            if (-not $process.HasExited) { $process.Kill($true); $process.WaitForExit(10000) | Out-Null }
          }

      - name: Build internal NSIS Local AI preview
        run: npm run pack:local-ai-preview
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          QFN_LOCAL_AI_RUNTIME_DIR: ${{ runner.temp }}\local-ai-runtime

      - name: Build internal NSIS Local AI preview with model included
        run: npm run pack:local-ai-preview-model
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          QFN_LOCAL_AI_RUNTIME_DIR: ${{ runner.temp }}\local-ai-runtime
          QFN_LOCAL_AI_MODEL_DIR: ${{ runner.temp }}\local-ai-model

      - name: Assemble the model-included download package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packageDir = 'dist/local-ai-preview-model-included'
          $modelFile = '7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5.gguf'
          Copy-Item (Join-Path "$env:RUNNER_TEMP/local-ai-model" $modelFile) (Join-Path $packageDir $modelFile)
          $license = Join-Path $packageDir 'LICENSE-Qwen3-4B-GGUF.txt'
          Invoke-WebRequest 'https://huggingface.co/Qwen/Qwen3-4B-GGUF/resolve/bc640142c66e1fdd12af0bd68f40445458f3869b/LICENSE' -OutFile $license
          $licenseText = Get-Content $license -Raw
          if (-not $licenseText.Contains('Apache License') -or -not $licenseText.Contains('Version 2.0')) { throw 'Pinned model license could not be verified.' }
          @'
          Model-included Local AI preview

          Extract every file in this package to the same folder, then run the file
          whose name contains Model-Included. Keep the model file beside setup
          until installation completes. Setup moves it into the app's per-user
          Local AI model folder and removes the extracted model copy to save space.
          You can delete the original downloaded package after setup finishes.

          This package includes Qwen3 4B Q4_K_M (2,497,280,256 bytes), distributed
          under Apache-2.0. See LICENSE-Qwen3-4B-GGUF.txt. The model is also
          checksum-verified by the app before it can be used.
          '@ | Set-Content (Join-Path $packageDir 'README.txt') -Encoding utf8

      - name: Stage model beside setup for install acceptance
        shell: pwsh
        run: |
          Copy-Item (Join-Path "$env:RUNNER_TEMP/local-ai-model" '7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5.gguf') 'dist/local-ai-preview-model-included/'

      - name: Test Local AI preview installation and protocol conflict handling
        shell: pwsh
        run: ./test/local-ai-preview-installer.ps1

      - name: Record exact installer SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item (Join-Path "$env:RUNNER_TEMP/local-ai-model" '7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5.gguf') 'dist/local-ai-preview-model-included/' -Force
          $compact = @(Get-ChildItem 'dist/local-ai-preview' -Filter '*.exe' -File)
          $included = @(Get-ChildItem 'dist/local-ai-preview-model-included' -Filter '*.exe' -File)
          if ($compact.Count -ne 1 -or $included.Count -ne 1) { throw 'Expected separate compact and model-included Local AI installers.' }
          $compactHash = (Get-FileHash $compact[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $includedHash = (Get-FileHash $included[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$compactHash  $($compact[0].Name)" | Set-Content 'dist/local-ai-preview/SHA256SUMS.txt' -Encoding ascii
          "$includedHash  $($included[0].Name)" | Set-Content 'dist/local-ai-preview-model-included/SHA256SUMS.txt' -Encoding ascii
          $modelHash = (Get-FileHash 'dist/local-ai-preview-model-included/7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5.gguf' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($modelHash -ne '7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5') { throw 'Model-included download package checksum mismatch.' }
          "$modelHash  7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5.gguf" | Add-Content 'dist/local-ai-preview-model-included/SHA256SUMS.txt' -Encoding ascii

      - name: Retain compact Local AI preview installer
        uses: actions/upload-artifact@v7
        with:
          name: quiz-from-notes-local-ai-download-model-later
          path: |
            desktop/dist/local-ai-preview/*.exe
            desktop/dist/local-ai-preview/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Retain model-included Local AI preview package
        uses: actions/upload-artifact@v7
        with:
          name: quiz-from-notes-local-ai-model-included
          path: |
            desktop/dist/local-ai-preview-model-included/*.exe
            desktop/dist/local-ai-preview-model-included/*.gguf
            desktop/dist/local-ai-preview-model-included/LICENSE-Qwen3-4B-GGUF.txt
            desktop/dist/local-ai-preview-model-included/README.txt
            desktop/dist/local-ai-preview-model-included/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
