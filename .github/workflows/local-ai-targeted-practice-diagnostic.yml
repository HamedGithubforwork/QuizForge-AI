name: Local AI targeted-practice diagnostic

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Application branch to diagnose; choose a known Local AI development head'
        type: choice
        options:
          - diagnostic/targeted-practice-stage-timing-20261103
          - perf/local-practice-minimal-replacement-batch-20261103
          - codex/qwen-targeted-practice-backup-batch-20261120
        default: perf/local-practice-minimal-replacement-batch-20261103
        required: true
      expected_tool_sha:
        description: 'Exact commit SHA for the diagnostic-tools checkout'
        type: string
        required: true
      expected_workflow_sha:
        description: 'Exact commit SHA for the workflow revision selected for this dispatch'
        type: string
        required: true
      expected_source_sha:
        description: 'Exact expected commit SHA for the selected application source branch'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: local-ai-targeted-practice-diagnostic-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  targeted-practice:
    name: One synthetic targeted-practice diagnostic (Windows x64 CPU)
    runs-on: windows-2025
    # 35 minutes for the verified model download, plus bounded runtime setup,
    # warmup, targeted inference, and artifact upload time.
    timeout-minutes: 55
    steps:
      - name: Check out diagnostic tools
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_tool_sha }}
          path: diagnostic-tools
          persist-credentials: false
      - name: Check out selected application source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_branch }}
          path: app
          persist-credentials: false
      - name: Verify exact checked-out revisions before downloads
        shell: pwsh
        env:
          EXPECTED_TOOL_SHA: ${{ inputs.expected_tool_sha }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.expected_workflow_sha }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EXPECTED_TOOL_SHA -cnotmatch '^[a-f0-9]{40}$') { throw 'expected_tool_sha must be a lowercase 40-character commit SHA' }
          if ($env:EXPECTED_WORKFLOW_SHA -cnotmatch '^[a-f0-9]{40}$') { throw 'expected_workflow_sha must be a lowercase 40-character commit SHA' }
          if ($env:EXPECTED_SOURCE_SHA -cnotmatch '^[a-f0-9]{40}$') { throw 'expected_source_sha must be a lowercase 40-character commit SHA' }
          $supportedSourceBranches = @('diagnostic/targeted-practice-stage-timing-20261103', 'perf/local-practice-minimal-replacement-batch-20261103', 'codex/qwen-targeted-practice-backup-batch-20261120')
          if ($env:SOURCE_BRANCH -cnotin $supportedSourceBranches) { throw 'source_branch must be one of the configured diagnostic sources' }
          $workflowSha = $env:GITHUB_SHA
          if ($workflowSha -cne $env:EXPECTED_WORKFLOW_SHA) { throw 'Workflow revision does not match expected_workflow_sha' }
          $toolSha = git -C diagnostic-tools rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $toolSha -cne $env:EXPECTED_TOOL_SHA) { throw 'Diagnostic-tools checkout does not match expected_tool_sha' }
          $sourceSha = git -C app rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $sourceSha -cne $env:EXPECTED_SOURCE_SHA) { throw 'Application checkout does not match expected_source_sha' }
          "QFN_DIAGNOSTIC_WORKFLOW_SHA=$workflowSha" >> $env:GITHUB_ENV
          "QFN_DIAGNOSTIC_TOOL_SHA=$toolSha" >> $env:GITHUB_ENV
          "QFN_DIAGNOSTIC_SOURCE_SHA=$sourceSha" >> $env:GITHUB_ENV
          "QFN_DIAGNOSTIC_SOURCE_REF=$($env:SOURCE_BRANCH)" >> $env:GITHUB_ENV
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Initialize sanitized model-preparation status
        shell: pwsh
        run: |
          node diagnostic-tools/desktop/scripts/prepare-targeted-practice-model.cjs initialize `
            "$env:RUNNER_TEMP/qfn-model-preparation.json" `
            "$env:QFN_DIAGNOSTIC_TOOL_SHA" "$env:QFN_DIAGNOSTIC_SOURCE_SHA"
          exit $LASTEXITCODE
      - name: Verify synthetic diagnostic callback and inspector integration
        shell: pwsh
        run: |
          node --test diagnostic-tools/desktop/test/prepare-targeted-practice-model.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test app/desktop/test/local-model-store.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node diagnostic-tools/desktop/test/diagnose-targeted-practice.integration.cjs app
          exit $LASTEXITCODE
      - name: Prepare exact model cache file
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $modelDir = Join-Path $env:RUNNER_TEMP 'models'
          $modelFile = Join-Path $modelDir '7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5.gguf'
          New-Item -ItemType Directory $modelDir -Force | Out-Null
          if (Test-Path -LiteralPath $modelFile) { throw 'Unexpected preexisting model cache file' }
          New-Item -ItemType File -Path $modelFile | Out-Null
      - name: Restore verified pinned Qwen model cache
        id: qwen-model-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/models/7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5.gguf
          key: qfn-windows-qwen3-4b-q4km-7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5
          fail-on-cache-miss: false
      - name: Verify or download pinned model and record bounded preparation status
        id: model-preparation
        shell: pwsh
        env:
          MODEL_CACHE_HIT: ${{ steps.qwen-model-cache.outputs.cache-hit == 'true' && 'true' || 'false' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $modelFile = Join-Path $env:RUNNER_TEMP 'models/7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5.gguf'
          if ($env:MODEL_CACHE_HIT -cne 'true') { Remove-Item -LiteralPath $modelFile -Force }
          node diagnostic-tools/desktop/scripts/prepare-targeted-practice-model.cjs prepare `
            app "$env:RUNNER_TEMP/models" "$env:RUNNER_TEMP/qfn-model-preparation.json" "$env:MODEL_CACHE_HIT"
          exit $LASTEXITCODE
      - name: Download, verify, and stage pinned llama.cpp runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node diagnostic-tools/desktop/scripts/prepare-targeted-practice-model.cjs mark `
            "$env:RUNNER_TEMP/qfn-model-preparation.json" runtime_setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          curl.exe -fL --max-time 180 -o "$env:RUNNER_TEMP/runtime.zip" 'https://github.com/ggml-org/llama.cpp/releases/download/b11317/llama-b11317-bin-win-vulkan-x64.zip'
          if ($LASTEXITCODE -ne 0) { throw 'Runtime download failed' }
          if ((Get-FileHash "$env:RUNNER_TEMP/runtime.zip" -Algorithm SHA256).Hash.ToLower() -ne 'b0cb46635aa4a028c272b74dc1966178b57157b4be199985e4d5e62cc6664338') { throw 'Runtime checksum mismatch' }
          Expand-Archive "$env:RUNNER_TEMP/runtime.zip" "$env:RUNNER_TEMP/runtime-full"
          New-Item -ItemType Directory "$env:RUNNER_TEMP/llama" -Force | Out-Null
          node app/desktop/scripts/stage-local-runtime.cjs "$env:RUNNER_TEMP/runtime-full" "$env:RUNNER_TEMP/llama"
          exit $LASTEXITCODE
      - name: Record exact diagnostic source commit
        shell: pwsh
        run: |
          $toolSha = git -C diagnostic-tools rev-parse HEAD
          $sourceSha = git -C app rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $toolSha -cne $env:QFN_DIAGNOSTIC_TOOL_SHA -or $sourceSha -cne $env:QFN_DIAGNOSTIC_SOURCE_SHA) { throw 'Diagnostic source revision changed after preflight' }
      - name: Run one selected-pages targeted-practice diagnostic
        shell: pwsh
        run: |
          node diagnostic-tools/desktop/scripts/prepare-targeted-practice-model.cjs mark `
            "$env:RUNNER_TEMP/qfn-model-preparation.json" inference
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node diagnostic-tools/desktop/scripts/diagnose-targeted-practice.cjs "$env:RUNNER_TEMP/llama" "$env:RUNNER_TEMP/models" "$env:RUNNER_TEMP/local-ai-targeted-practice-diagnostic.json" app
          exit $LASTEXITCODE
      - name: Upload numeric synthetic diagnostic report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: local-ai-targeted-practice-diagnostic
          path: ${{ runner.temp }}/local-ai-targeted-practice-diagnostic.json
          if-no-files-found: warn
          retention-days: 3
          compression-level: 6
      - name: Upload sanitized model-preparation status
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: local-ai-targeted-practice-preparation
          path: ${{ runner.temp }}/qfn-model-preparation.json
          if-no-files-found: warn
          retention-days: 3
          compression-level: 6
      - name: Save only verified Qwen model cache file
        if: always() && steps.model-preparation.outcome == 'success' && steps.qwen-model-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/models/7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5.gguf
          key: qfn-windows-qwen3-4b-q4km-7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5
