name: AWS OIDC identity check

on:
  workflow_dispatch:

permissions:
  id-token: write

concurrency:
  group: aws-oidc-identity-check
  cancel-in-progress: false

jobs:
  identity:
    name: Confirm read-only AWS OIDC identity
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.actor_id == '148009407' &&
      github.repository_id == '1307099196' &&
      ((github.repository == 'HamedGithubforwork/QuizForge-AI' && github.repository_owner_id == '148009407') ||
       (github.repository == 'QuizFromNotes/QuizForge-AI' && github.repository_owner_id == '356387243'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    permissions:
      id-token: write
    steps:
      - name: Assume the existing role with an STS-only session
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ca-central-1
          role-duration-seconds: 900
          role-session-name: qf-oidc-identity-check
          mask-aws-account-id: true
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"sts:GetCallerIdentity","Resource":"*"}]}
      - name: Verify the expected AWS account and role without logging identity data
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity --output json | python -c '
          import json, sys
          identity = json.load(sys.stdin)
          expected_account = "399311815467"
          expected_role_prefix = "arn:aws:sts::399311815467:assumed-role/QuizForgeGitHubTerraform/"
          if identity.get("Account") != expected_account or not identity.get("Arn", "").startswith(expected_role_prefix):
              raise SystemExit("AWS OIDC returned an unexpected account or role")
          print("Verified the expected QuizForge AWS account and role")
          '
