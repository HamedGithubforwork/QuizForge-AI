name: CI

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "e2e/**"
      - ".python-version"
      - "render.yaml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deployment-smoke.yml"
      - ".github/workflows/authenticated-canary.yml"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      playwright: ${{ steps.changes.outputs.playwright }}

    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" > changed-files.txt
          elif [[ -n "${BEFORE_SHA}" && "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
            git diff --name-only "${BEFORE_SHA}" "${CURRENT_SHA}" > changed-files.txt
          else
            git show --pretty="" --name-only "${CURRENT_SHA}" > changed-files.txt
          fi

          echo "Changed files:"
          cat changed-files.txt

          backend=false
          frontend=false
          playwright=false

          while IFS= read -r file; do
            case "${file}" in
              backend/*|.python-version|render.yaml)
                backend=true
                ;;
              frontend/*)
                frontend=true
                playwright=true
                ;;
              e2e/tests/*|e2e/integration-tests/*|e2e/canary-tests/*|e2e/support/*|e2e/playwright.config.ts|e2e/playwright.integration.config.ts|e2e/playwright.canary.config.ts|e2e/package.json|e2e/package-lock.json|.github/workflows/authenticated-canary.yml|.github/workflows/deployment-smoke.yml|.github/workflows/local-stack-integration.yml)
                playwright=true
                ;;
              .github/workflows/ci.yml)
                backend=true
                frontend=true
                playwright=true
                ;;
            esac
          done < changed-files.txt

          echo "backend=${backend}" >> "${GITHUB_OUTPUT}"
          echo "frontend=${frontend}" >> "${GITHUB_OUTPUT}"
          echo "playwright=${playwright}" >> "${GITHUB_OUTPUT}"

  backend-tests:
    name: Backend tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379/0

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
          cache: pip
          cache-dependency-path: |
            backend/requirements.in
            backend/requirements.txt
            backend/requirements.lock
            backend/requirements-dev.in
            backend/requirements-dev.txt
            backend/requirements-dev.lock

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Run backend tests
        run: python -m pytest -q

      - name: Run deterministic backend benchmark
        run: python scripts/benchmark_backend.py --check

      - name: Verify generated API contract
        run: python scripts/generate_api_contract.py --check

      - name: Build backend Docker image
        run: docker build -t quizforge-backend-ci .

      - name: Verify OCR runtime in backend Docker image
        run: docker run --rm quizforge-backend-ci python scripts/verify_ocr_runtime.py

  frontend-checks:
    name: Frontend checks
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests with coverage
        run: npm run test:coverage

      - name: Run frontend lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  playwright-e2e:
    name: Playwright E2E
    needs: changes
    if: needs.changes.outputs.playwright == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install E2E dependencies
        run: npm ci --prefix e2e

      - name: Install Chromium
        run: npx --prefix e2e playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npm --prefix e2e test

      - name: Validate deployed canary test discovery
        run: >-
          npx --prefix e2e playwright test
          --config=e2e/playwright.canary.config.ts
          --list

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  required-pr-gate:
    name: Required PR gate
    needs:
      - changes
      - backend-tests
      - frontend-checks
      - playwright-e2e
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Verify relevant CI jobs
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BACKEND_RESULT: ${{ needs.backend-tests.result }}
          FRONTEND_RESULT: ${{ needs.frontend-checks.result }}
          PLAYWRIGHT_RESULT: ${{ needs.playwright-e2e.result }}
        run: |
          set -euo pipefail

          echo "Change detection: ${CHANGES_RESULT}"
          echo "Backend tests:   ${BACKEND_RESULT}"
          echo "Frontend checks: ${FRONTEND_RESULT}"
          echo "Playwright E2E:  ${PLAYWRIGHT_RESULT}"

          if [[ "${CHANGES_RESULT}" != "success" ]]; then
            echo "Change detection did not succeed."
            exit 1
          fi

          for result in "${BACKEND_RESULT}" "${FRONTEND_RESULT}" "${PLAYWRIGHT_RESULT}"; do
            case "${result}" in
              success|skipped)
                ;;
              *)
                echo "A relevant CI job did not succeed."
                exit 1
                ;;
            esac
          done

          echo "All relevant CI jobs passed or were intentionally skipped."
