name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379/0

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run backend tests
        run: python -m pytest -q

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend grader, identity, mastery, fallback, and request-policy tests
        run: |
          node --experimental-strip-types src/lib/shortAnswerGrader.test.ts
          node --experimental-strip-types src/lib/numericUnitGrading.test.ts
          node --experimental-strip-types src/lib/historyQuestionGrader.test.ts
          node --experimental-strip-types src/lib/answerFallback.test.ts
          node --experimental-strip-types src/lib/documentIdentity.test.ts
          node --experimental-strip-types src/lib/weakAreaAnalytics.test.ts
          node --experimental-strip-types src/lib/masteryAnalytics.test.ts
          node --experimental-strip-types src/lib/quizGenerationPolicy.test.ts

      - name: Run frontend lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  playwright-e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install E2E dependencies
        run: npm install --prefix e2e --package-lock=false

      - name: Install Chromium
        run: npx --prefix e2e playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npm --prefix e2e test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
