name: Diagnose Cognito SMS MFA readiness

on:
  pull_request:
    paths:
      - ".github/workflows/cognito-sms-readiness.yml"
      - "scripts/production/cognito_sms_readiness.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/cognito-sms-readiness.yml"
      - "scripts/production/cognito_sms_readiness.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - name: Validate SMS readiness diagnostic
        run: python -m py_compile scripts/production/cognito_sms_readiness.py

  inspect:
    needs: validate
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'HamedGithubforwork/QuizForge-AI' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - name: Install locked AWS SDK dependencies
        run: python -m pip install --require-hashes -r scripts/rds_rehearsal/requirements.lock
      - name: Assume read-only SMS diagnostic session
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: qf-cognito-sms-readiness
          role-duration-seconds: 900
          aws-region: ca-central-1
          mask-aws-account-id: true
          unset-current-credentials: true
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":[
              "cognito-idp:ListUserPools","cognito-idp:GetUserPoolMfaConfig",
              "sms-voice:DescribeAccountAttributes","sms-voice:DescribePhoneNumbers","sms-voice:DescribePools"
            ],"Resource":"*"}]}
      - name: Inspect sanitized SMS readiness
        run: python scripts/production/cognito_sms_readiness.py
      - name: Publish sanitized result
        uses: actions/upload-artifact@v7
        with:
          name: cognito-sms-readiness
          path: cognito-sms-readiness-results/summary.json
          if-no-files-found: error
          retention-days: 7
