name: Make Cognito MFA optional

on:
  pull_request:
    paths:
      - ".github/workflows/lightsail-mfa-optional.yml"
      - "scripts/production/lightsail/update_mfa_policy.py"
      - "scripts/production/lightsail/test_update_mfa_policy.py"
      - "infra/aws/lightsail-production/auth.tf"
      - "infra/aws/lightsail-production/tests/boundaries.tftest.hcl"
      - "scripts/production/lightsail/enable_public_signup.py"
      - "scripts/production/lightsail/test_enable_public_signup.py"
      - "scripts/production/lightsail/update_password_policy.py"
      - "scripts/production/lightsail/test_update_password_policy.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/lightsail-mfa-optional.yml"
      - "scripts/production/lightsail/update_mfa_policy.py"
      - "scripts/production/lightsail/test_update_mfa_policy.py"
      - "infra/aws/lightsail-production/auth.tf"
      - "infra/aws/lightsail-production/tests/boundaries.tftest.hcl"
      - "scripts/production/lightsail/enable_public_signup.py"
      - "scripts/production/lightsail/test_enable_public_signup.py"
      - "scripts/production/lightsail/update_password_policy.py"
      - "scripts/production/lightsail/test_update_password_policy.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - name: Install locked AWS SDK dependencies
        run: python -m pip install --require-hashes -r scripts/rds_rehearsal/requirements.lock
      - name: Test exact optional-MFA boundary
        run: |
          python -m py_compile scripts/production/lightsail/update_mfa_policy.py
          python -m unittest scripts.production.lightsail.test_update_mfa_policy -v
          python -m unittest scripts.production.lightsail.test_enable_public_signup -v
          python -m unittest scripts.production.lightsail.test_update_password_policy -v
      - name: Build deterministic Cognito recovery package
        run: python scripts/production/lightsail/package_recovery.py
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.7"
          terraform_wrapper: false
      - name: Validate production Terraform
        working-directory: infra/aws/lightsail-production
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate
          terraform test

  apply:
    needs: validate
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'HamedGithubforwork/QuizForge-AI' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: quizforge-production-cognito-mfa-policy
      cancel-in-progress: false
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - name: Install locked AWS SDK dependencies
        run: python -m pip install --require-hashes -r scripts/rds_rehearsal/requirements.lock
      - name: Build deterministic Cognito recovery package
        run: python scripts/production/lightsail/package_recovery.py
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.7"
          terraform_wrapper: false

      - name: Prepare private production variables
        env:
          AWS_BUDGET_ALERT_EMAIL: ${{ secrets.AWS_BUDGET_ALERT_EMAIL }}
          LIGHTSAIL_SSH_PUBLIC_KEY: ${{ secrets.LIGHTSAIL_SSH_PUBLIC_KEY }}
          LIGHTSAIL_ADMIN_IPV4_CIDR: ${{ secrets.LIGHTSAIL_ADMIN_IPV4_CIDR }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"mfa-policy.tfvars.json"
          p.write_text(json.dumps({
            "alert_email": os.environ["AWS_BUDGET_ALERT_EMAIL"],
            "ssh_public_key": os.environ["LIGHTSAIL_SSH_PUBLIC_KEY"],
            "admin_ipv4_cidr": os.environ["LIGHTSAIL_ADMIN_IPV4_CIDR"],
            "public_signup": True,
          })+"\n")
          p.chmod(0o600)
          PY

      - name: Assume MFA-policy-only production session
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: qf-mfa-optional
          role-duration-seconds: 900
          aws-region: ca-central-1
          mask-aws-account-id: true
          unset-current-credentials: true
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[
              {"Effect":"Allow","Action":["sts:GetCallerIdentity","cognito-idp:Get*","cognito-idp:List*","cognito-idp:Describe*","lambda:Get*","lambda:List*","iam:Get*","iam:List*"],"Resource":"*"},
              {"Effect":"Allow","Action":["cognito-idp:UpdateUserPool"],"Resource":"*"},
              {"Effect":"Allow","Action":["s3:GetBucketLocation","s3:ListBucket"],"Resource":"arn:aws:s3:::${{ secrets.TF_STATE_BUCKET }}"},
              {"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject"],"Resource":["arn:aws:s3:::${{ secrets.TF_STATE_BUCKET }}/quizforge/lightsail-production/terraform.tfstate","arn:aws:s3:::${{ secrets.TF_STATE_BUCKET }}/quizforge/lightsail-production/terraform.tfstate.tflock"]}
            ]}

      - name: Initialize production state
        env:
          QF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_DATA_DIR: ${{ runner.temp }}/mfa-policy-tfdata
        run: |
          terraform -chdir=infra/aws/lightsail-production init             -reconfigure -input=false -lockfile=readonly             -backend-config="bucket=$QF_STATE_BUCKET"             -backend-config="key=quizforge/lightsail-production/terraform.tfstate"             -backend-config="region=ca-central-1"             -backend-config="encrypt=true"             -backend-config="use_lockfile=true"

      - name: Create MFA-policy-only saved plan
        env:
          TF_DATA_DIR: ${{ runner.temp }}/mfa-policy-tfdata
        run: |
          set +e
          terraform -chdir=infra/aws/lightsail-production plan             -target=aws_cognito_user_pool.browser             -input=false -lock=true -lock-timeout=60s -detailed-exitcode             -var-file="$RUNNER_TEMP/mfa-policy.tfvars.json"             -out="$RUNNER_TEMP/mfa-policy.tfplan"             >"$RUNNER_TEMP/mfa-policy-plan.log" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            exit 1
          fi
          terraform -chdir=infra/aws/lightsail-production show -json             "$RUNNER_TEMP/mfa-policy.tfplan" >"$RUNNER_TEMP/mfa-policy-plan.json"

      - name: Require exact ON-to-OPTIONAL MFA change
        id: review
        run: >-
          python -m scripts.production.lightsail.update_mfa_policy
          review-plan "$RUNNER_TEMP/mfa-policy-plan.json"

      - name: Apply exact reviewed saved plan
        if: steps.review.outputs.apply_required == 'true'
        env:
          TF_DATA_DIR: ${{ runner.temp }}/mfa-policy-tfdata
        run: |
          chmod 0400 "$RUNNER_TEMP/mfa-policy.tfplan"
          terraform -chdir=infra/aws/lightsail-production apply             -input=false -lock=true -lock-timeout=60s             "$RUNNER_TEMP/mfa-policy.tfplan"             >"$RUNNER_TEMP/mfa-policy-apply.log" 2>&1

      - name: Verify live optional MFA and retained security controls
        run: python -m scripts.production.lightsail.update_mfa_policy verify-live

      - name: Confirm targeted Terraform state has zero remaining drift
        env:
          TF_DATA_DIR: ${{ runner.temp }}/mfa-policy-tfdata
        run: |
          set +e
          terraform -chdir=infra/aws/lightsail-production plan             -target=aws_cognito_user_pool.browser             -input=false -refresh=true -lock=false -detailed-exitcode             -var-file="$RUNNER_TEMP/mfa-policy.tfvars.json"             >"$RUNNER_TEMP/mfa-policy-readback.log" 2>&1
          status=$?
          set -e
          test "$status" -eq 0

      - name: Remove private Terraform material
        if: always()
        run: |
          rm -f             "$RUNNER_TEMP/mfa-policy.tfvars.json"             "$RUNNER_TEMP/mfa-policy.tfplan"             "$RUNNER_TEMP/mfa-policy-plan.json"             "$RUNNER_TEMP/mfa-policy-plan.log"             "$RUNNER_TEMP/mfa-policy-apply.log"             "$RUNNER_TEMP/mfa-policy-readback.log"             infra/aws/lightsail-production/recovery.zip

      - name: Publish sanitized result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: permanent-cognito-mfa-optional
          path: cognito-mfa-policy-results/summary.json
          if-no-files-found: error
          retention-days: 30
