name: Bootstrap Stryker dependencies

on:
  push:
    branches:
      - chore/add-stryker-mutation-testing
    paths:
      - .github/workflows/stryker-bootstrap.yml

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: chore/add-stryker-mutation-testing

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Generate pinned Stryker dependency lockfile
        working-directory: frontend
        run: npm install --save-dev --save-exact --package-lock-only @stryker-mutator/core@10.0.0 @stryker-mutator/tap-runner@10.0.0

      - name: Commit generated dependency metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Add pinned StrykerJS dependencies"
          git push origin HEAD:chore/add-stryker-mutation-testing
