name: AWS integrated browser staging

on:
  pull_request:
    paths:
      - "infra/aws/integrated-staging/**"
      - "scripts/integrated_staging/**"
      - ".github/workflows/aws-integrated-staging.yml"
  workflow_dispatch:
    inputs:
      operation:
        description: "Run integrated CloudFront/Cognito/API/RDS validation and destroy, or stop"
        type: choice
        required: true
        options: [run, stop]
      application_pr:
        description: "Reviewed application PR with passing exact-commit checks"
        type: string
        default: "97"
  schedule:
    - cron: "47 * * * *"

permissions:
  contents: read
concurrency:
  group: quizforge-integrated-staging
  cancel-in-progress: false
env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_foundation_state_bucket: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_hostname: ${{ vars.AWS_STAGING_API_HOSTNAME }}
  TF_VAR_certificate_arn: ${{ vars.AWS_STAGING_CERTIFICATE_ARN }}
  TF_VAR_zone_id: ${{ vars.AWS_STAGING_ZONE_ID }}
  # Existing strict HTTPS prerequisite validator reads these names.
  TF_VAR_staging_hostname: ${{ vars.AWS_STAGING_API_HOSTNAME }}
  TF_VAR_staging_certificate_arn: ${{ vars.AWS_STAGING_CERTIFICATE_ARN }}
  TF_VAR_staging_zone_id: ${{ vars.AWS_STAGING_ZONE_ID }}

jobs:
  validate:
    name: Integrated staging boundaries and Terraform
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'run')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      valkey:
        image: valkey/valkey:8.1.3
        ports: ["6379:6379"]
        options: --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - name: Install locked trusted controller dependencies
        run: python -m pip install --require-hashes -r scripts/rds_rehearsal/requirements.lock -r scripts/integrated_staging/redis.lock
      - name: Validate artifacts, cleanup scope and browser syntax
        env:
          INTEGRATED_TEST_REDIS_URL: redis://127.0.0.1:6379/15
        run: |
          python -m unittest discover -s scripts/integrated_staging -p 'test_*.py' -v
          python -m compileall -q scripts/integrated_staging
          node --check scripts/integrated_staging/browser.mjs
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.7"
          terraform_wrapper: false
      - name: Validate isolated infrastructure without AWS credentials
        run: |
          terraform -chdir=infra/aws/integrated-staging fmt -check -recursive
          terraform -chdir=infra/aws/integrated-staging init -backend=false -lockfile=readonly
          terraform -chdir=infra/aws/integrated-staging validate
          terraform -chdir=infra/aws/integrated-staging test

  images:
    name: Build reviewed API and trusted integration probe
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read
      pull-requests: read
    outputs:
      sha: ${{ steps.preview.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require existing checks on the exact application commit
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_PR: ${{ inputs.application_pr || '97' }}
          REQUIRE_POSTGRES_HISTORY: "1"
        run: python scripts/aws_staging_preview.py
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.preview.outputs.sha }}
          path: preview-source
          persist-credentials: false
      - name: Build without AWS credentials or production secrets
        run: |
          docker build --tag quizforge-integrated-api:tested preview-source/backend
          docker build --tag quizforge-integrated-probe:tested -f scripts/integrated_staging/probe.Dockerfile .
          docker build --tag quizforge-integrated-browser:tested -f scripts/integrated_staging/browser.Dockerfile .
          docker save --output /tmp/integration-images.tar quizforge-integrated-api:tested quizforge-integrated-probe:tested
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        with:
          name: integration-images
          path: /tmp/integration-images.tar
          compression-level: 0
          retention-days: 1

  provision:
    name: Provision isolated integration with application tasks stopped
    needs: [validate, images]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation == 'run'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: integration-images
          path: /tmp/integration-images
      - name: Load previously built images
        run: docker load --input /tmp/integration-images/integration-images.tar
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - run: python -m pip install --require-hashes -r scripts/rds_rehearsal/requirements.lock
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.7"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ca-central-1
      - name: Initialize only integrated staging state
        run: |
          terraform -chdir=infra/aws/integrated-staging init -reconfigure -lockfile=readonly \
            -backend-config="bucket=$TF_VAR_foundation_state_bucket" -backend-config="key=quizforge/integrated-staging/terraform.tfstate" \
            -backend-config="region=ca-central-1" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - name: Push reviewed images under isolated immutable tags
        run: python scripts/integrated_staging/control.py push
      - name: Require empty state, existing issued certificate and unused DNS
        run: python scripts/integrated_staging/control.py configure
      - name: Create temporary infrastructure with zero application tasks
        run: terraform -chdir=infra/aws/integrated-staging apply -auto-approve
      - name: Export public build settings only
        run: python scripts/integrated_staging/control.py export
      - uses: actions/upload-artifact@v7
        with:
          name: integration-public-config
          path: integration-config.json
          retention-days: 1

  frontend:
    name: Build reviewed frontend with real public staging settings
    needs: [images, provision]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.images.outputs.sha }}
          path: preview-source
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: integration-public-config
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - run: python -m pip install --require-hashes -r scripts/rds_rehearsal/requirements.lock
      - name: Build on a separate runner without AWS identity
        run: python scripts/integrated_staging/build.py preview-source/frontend
      - uses: actions/upload-artifact@v7
        with:
          name: integrated-frontend
          path: |
            hosting-dist/
            hosting-manifest.json
            integration-config.json
          retention-days: 1

  live:
    name: Live CloudFront Cognito HTTPS API and private RDS browser test
    needs: [provision, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: integrated-frontend
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - name: Install trusted dependencies before OIDC
        run: |
          python -m pip install --require-hashes -r scripts/rds_rehearsal/requirements.lock
          docker build --tag quizforge-integrated-browser:tested -f scripts/integrated_staging/browser.Dockerfile .
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.7"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ca-central-1
      - name: Initialize only integrated staging state
        run: |
          terraform -chdir=infra/aws/integrated-staging init -reconfigure -lockfile=readonly \
            -backend-config="bucket=$TF_VAR_foundation_state_bucket" -backend-config="key=quizforge/integrated-staging/terraform.tfstate" \
            -backend-config="region=ca-central-1" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - name: Verify live boundaries and seed disposable identities and private history
        run: python scripts/integrated_staging/control.py prepare
      - name: Start application and enrollment tasks after database preparation
        run: terraform -chdir=infra/aws/integrated-staging apply -auto-approve
      - name: Verify hosting boundary and publish checked frontend
        run: python scripts/integrated_staging/control.py publish
      - name: Test real hosted browser without AWS credentials or database passwords
        run: python scripts/integrated_staging/control.py browser
      - name: Independently verify database ownership and fixture preservation
        run: python scripts/integrated_staging/control.py verify

  cleanup:
    name: Destroy integrated staging and independently verify absence
    needs: [validate, images, provision, frontend, live]
    if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - run: python -m pip install --require-hashes -r scripts/rds_rehearsal/requirements.lock
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.7"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ca-central-1
      - name: Initialize only integrated staging state
        run: |
          terraform -chdir=infra/aws/integrated-staging init -reconfigure -lockfile=readonly \
            -backend-config="bucket=$TF_VAR_foundation_state_bucket" -backend-config="key=quizforge/integrated-staging/terraform.tfstate" \
            -backend-config="region=ca-central-1" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - name: Reject unrelated state and stop exact integration task families
        run: python scripts/integrated_staging/control.py stop-tasks
      - name: Destroy all disposable resources
        run: terraform -chdir=infra/aws/integrated-staging destroy -auto-approve
      - name: Independently confirm AWS resource absence
        run: python scripts/integrated_staging/control.py absent
