name: Permanent Lightsail repair inspection

on:
  pull_request:
    paths:
      - ".github/workflows/lightsail-production-repair-inspect.yml"
      - "infra/aws/lightsail-production/**"
      - "scripts/lightsail_activation/repair_review.py"
      - "scripts/lightsail_activation/review.py"
      - "scripts/lightsail_activation/tests/test_repair_review.py"
      - "scripts/production/lightsail/**"
      - "scripts/cognito_browser/identity_triggers.py"
      - "scripts/cognito_browser/pre_signup.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - name: Credential-free repair reviewer tests
        run: python -m unittest discover -s scripts/lightsail_activation/tests -p 'test_repair_review.py' -v
      - name: Check exact permanent-host source blobs
        run: python -m scripts.lightsail_activation.review check-source
      - name: Build deterministic Cognito recovery package
        run: python scripts/production/lightsail/package_recovery.py
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.7"
          terraform_wrapper: false
      - name: Validate repaired Terraform without AWS credentials
        env:
          TF_DATA_DIR: ${{ runner.temp }}/lightsail-repair-validation
        run: |
          terraform -chdir=infra/aws/lightsail-production init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/aws/lightsail-production validate
          terraform -chdir=infra/aws/lightsail-production test

  inspect:
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'HamedGithubforwork/QuizForge-AI'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: quizforge-permanent-lightsail-repair-inspection
      cancel-in-progress: false
    env:
      TF_WORKSPACE: default
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"

      - name: Install existing hash-locked AWS SDK dependencies
        run: python -m pip install --require-hashes -r scripts/rds_rehearsal/requirements.lock

      - name: Check exact permanent-host source blobs
        run: python -m scripts.lightsail_activation.review check-source

      - name: Build deterministic Cognito recovery package
        run: python scripts/production/lightsail/package_recovery.py

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.7"
          terraform_wrapper: false

      - name: Assume deployment role with AWS ReadOnlyAccess session boundary
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: qf-lightsail-repair-inspect
          role-duration-seconds: 1200
          aws-region: ca-central-1
          mask-aws-account-id: true
          unset-current-credentials: true
          managed-session-policies: arn:aws:iam::aws:policy/ReadOnlyAccess

      - name: Prepare private Terraform variables
        env:
          AWS_BUDGET_ALERT_EMAIL: ${{ secrets.AWS_BUDGET_ALERT_EMAIL }}
          LIGHTSAIL_SSH_PUBLIC_KEY: ${{ secrets.LIGHTSAIL_SSH_PUBLIC_KEY }}
          LIGHTSAIL_ADMIN_IPV4_CIDR: ${{ secrets.LIGHTSAIL_ADMIN_IPV4_CIDR }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "lightsail-repair.tfvars.json"
          path.write_text(json.dumps({
              "alert_email": os.environ["AWS_BUDGET_ALERT_EMAIL"],
              "ssh_public_key": os.environ["LIGHTSAIL_SSH_PUBLIC_KEY"],
              "admin_ipv4_cidr": os.environ["LIGHTSAIL_ADMIN_IPV4_CIDR"],
              "public_signup": False,
          }) + "\n")
          path.chmod(0o600)
          PY

      - name: Verify current Lightsail catalog and separately managed USD20 budget
        env:
          QF_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          QF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          AWS_BUDGET_ALERT_EMAIL: ${{ secrets.AWS_BUDGET_ALERT_EMAIL }}
          LIGHTSAIL_SSH_PUBLIC_KEY: ${{ secrets.LIGHTSAIL_SSH_PUBLIC_KEY }}
          LIGHTSAIL_ADMIN_IPV4_CIDR: ${{ secrets.LIGHTSAIL_ADMIN_IPV4_CIDR }}
        run: python -m scripts.lightsail_activation.repair_review catalog

      - name: Initialize only the permanent Lightsail state
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_DATA_DIR: ${{ runner.temp }}/lightsail-repair-live
        run: |
          terraform -chdir=infra/aws/lightsail-production init \
            -reconfigure -input=false -lockfile=readonly \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=quizforge/lightsail-production/terraform.tfstate" \
            -backend-config="region=ca-central-1" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Save a fresh read-only repair plan
        env:
          TF_DATA_DIR: ${{ runner.temp }}/lightsail-repair-live
        run: |
          set +e
          terraform -chdir=infra/aws/lightsail-production plan \
            -input=false -refresh=true -lock=false -detailed-exitcode \
            -var-file="$RUNNER_TEMP/lightsail-repair.tfvars.json" \
            -out="$RUNNER_TEMP/lightsail-repair.tfplan" \
            >"$RUNNER_TEMP/lightsail-repair-plan.log" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          path = Path("lightsail-repair-results/summary.json")
          value = json.loads(path.read_text())
          value["result"] = "blocked_no_apply_attempted"
          value["error_code"] = "TERRAFORM_REPAIR_PLAN_NOT_EXPECTED"
          path.write_text(json.dumps(value, indent=2, sort_keys=True) + "\n")
          PY
            echo "Permanent Lightsail repair plan was not the expected change plan; raw diagnostics remain private." >&2
            exit 1
          fi
          terraform -chdir=infra/aws/lightsail-production show -json \
            "$RUNNER_TEMP/lightsail-repair.tfplan" \
            >"$RUNNER_TEMP/lightsail-repair-plan.json"

      - name: Review exact four-create repair plan
        env:
          QF_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          QF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          AWS_BUDGET_ALERT_EMAIL: ${{ secrets.AWS_BUDGET_ALERT_EMAIL }}
          LIGHTSAIL_SSH_PUBLIC_KEY: ${{ secrets.LIGHTSAIL_SSH_PUBLIC_KEY }}
          LIGHTSAIL_ADMIN_IPV4_CIDR: ${{ secrets.LIGHTSAIL_ADMIN_IPV4_CIDR }}
        run: |
          python -m scripts.lightsail_activation.repair_review review \
            "$RUNNER_TEMP/lightsail-repair-plan.json" \
            "lightsail-repair-results/catalog.json"

      - name: Remove private plan material
        if: always()
        run: |
          rm -f \
            "$RUNNER_TEMP/lightsail-repair.tfvars.json" \
            "$RUNNER_TEMP/lightsail-repair.tfplan" \
            "$RUNNER_TEMP/lightsail-repair-plan.json" \
            "$RUNNER_TEMP/lightsail-repair-plan.log" \
            lightsail-repair-results/catalog.json \
            infra/aws/lightsail-production/recovery.zip

      - name: Publish only the sanitized repair inspection summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: permanent-lightsail-repair-inspection-summary
          path: lightsail-repair-results/summary.json
          if-no-files-found: error
          retention-days: 30
