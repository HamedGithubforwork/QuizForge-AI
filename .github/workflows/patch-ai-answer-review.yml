name: Patch AI answer review integration

on:
  push:
    branches:
      - ai-borderline-answer-review

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-borderline-answer-review

      - name: Patch backend and frontend integration
        run: python scripts/patch_answer_review_integration.py

      - name: Commit integration patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/main.py frontend/src/App.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Integrate semantic fallback into quiz grading"
          git push origin HEAD:ai-borderline-answer-review
