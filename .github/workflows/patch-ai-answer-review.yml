name: Patch AI answer review integration

on:
  push:
    branches:
      - ai-borderline-answer-review

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-borderline-answer-review

      - name: Patch backend and frontend integration
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(f'{label} anchor not found')
              return text.replace(old, new, 1)

          # backend/main.py
          path = Path('backend/main.py')
          text = path.read_text()
          old = "from quiz_validation import get_quiz_validation_errors\n"
          new = old + """from answer_review import (
              AnswerReviewRequest,
              AnswerReviewResponse,
              review_borderline_answers_with_ai,
          )
          """.replace('          ', '')
          text = replace_once(text, old, new, 'backend import')

          health = '''@app.get("/api/health")
          def health_check():
              return {
                  "message": "Frontend connected to FastAPI!"
              }


          '''.replace('          ', '')
          route = '''@app.post(
              "/api/answers/review",
              response_model=AnswerReviewResponse,
          )
          async def review_borderline_answers(
              payload: AnswerReviewRequest,
              current_user: AuthenticatedUser = Depends(
                  get_current_user
              ),
          ):
              return await review_borderline_answers_with_ai(
                  payload,
                  current_user.id,
              )


          '''.replace('          ', '')
          if route not in text:
              if health not in text:
                  raise SystemExit('health anchor not found')
              text = text.replace(health, health + route, 1)
          path.write_text(text)

          # frontend/src/App.tsx
          path = Path('frontend/src/App.tsx')
          text = path.read_text()

          old = """import {
            gradeShortAnswer,
            type ShortAnswerGradingSpec,
          } from './lib/shortAnswerGrader'
          """.replace('          ', '')
          addition = """import {
            buildAiAnswerReviewCase,
            buildAiAnswerReviewKey,
            shouldRequestAiAnswerReview,
            type AiAnswerReviewDecision,
          } from './lib/answerFallback'
          """.replace('          ', '')
          if addition not in text:
              text = replace_once(text, old, old + addition, 'frontend import')

          old = "  grading?: ShortAnswerGradingSpec\n  explanation: string\n"
          new = "  grading?: ShortAnswerGradingSpec\n  ai_accepted_answers?: string[]\n  explanation: string\n"
          text = replace_once(text, old, new, 'quiz question type')

          old = """  const [saveMessage, setSaveMessage] =
            useState('')

          """.replace('          ', '')
          new = old + """  const [
            aiGradeReviews,
            setAiGradeReviews,
          ] = useState<
            Record<string, AiAnswerReviewDecision>
          >({})

            const [
              isReviewingAnswers,
              setIsReviewingAnswers,
            ] = useState(false)

          """.replace('          ', '')
          text = replace_once(text, old, new, 'review state')

          old = """      return isShortAnswerCorrect(
            question,
            answer,
          )
          """.replace('          ', '')
          new = """      const deterministicCorrect =
            isShortAnswerCorrect(
              question,
              answer,
            )

              if (deterministicCorrect) {
                return true
              }

              const review =
                aiGradeReviews[
                  buildAiAnswerReviewKey(
                    question,
                    answer,
                  )
                ]

              return review?.verdict === 'correct'
          """.replace('          ', '')
          text = replace_once(text, old, new, 'question correctness')

          start_marker = '  function handleCheckAnswers() {'
          end_marker = '  function handleTryAgain() {'
          if start_marker in text:
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              new_check = '''  async function handleCheckAnswers() {
            if (!quiz || isReviewingAnswers) {
              return
            }

            const indexesToCheck =
              retryQuestionIndexes ??
              quiz.questions.map(
                (_, index) => index,
              )

            const firstUnansweredIndex =
              indexesToCheck.find(
                (questionIndex) =>
                  !isQuestionAnswered(
                    quiz.questions[questionIndex],
                    selectedAnswers[questionIndex],
                  ),
              )

            if (firstUnansweredIndex !== undefined) {
              setAttentionQuestionIndex(firstUnansweredIndex)
              setError(
                `Question ${firstUnansweredIndex + 1} still needs an answer.`,
              )
              scrollToQuestion(firstUnansweredIndex, true)
              return
            }

            setAttentionQuestionIndex(null)
            setOpenSourceQuestionIndex(null)
            setError('')
            setSaveMessage('')

            const reviewCases = indexesToCheck.flatMap(
              (questionIndex) => {
                const question = quiz.questions[questionIndex]
                const answer = selectedAnswers[questionIndex]

                if (
                  question.question_type !== 'short_answer' ||
                  typeof answer !== 'string'
                ) {
                  return []
                }

                const deterministicGrade =
                  gradeShortAnswer(question, answer)

                if (
                  !shouldRequestAiAnswerReview(
                    question,
                    answer,
                    deterministicGrade,
                  )
                ) {
                  return []
                }

                const reviewCase =
                  buildAiAnswerReviewCase(
                    questionIndex,
                    question,
                    answer,
                  )

                return reviewCase ? [reviewCase] : []
              },
            )

            if (reviewCases.length > 0) {
              setIsReviewingAnswers(true)

              try {
                const response = await apiFetch(
                  '/api/answers/review',
                  {
                    method: 'POST',
                    headers: {
                      'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                      cases: reviewCases,
                    }),
                  },
                )

                const data = await response.json() as {
                  detail?: string
                  decisions?: AiAnswerReviewDecision[]
                }

                if (!response.ok) {
                  throw new Error(
                    data.detail ||
                      'Semantic answer review failed.',
                  )
                }

                const decisions = data.decisions ?? []
                const casesByIndex = new Map(
                  reviewCases.map((item) => [
                    item.question_index,
                    item,
                  ]),
                )

                setAiGradeReviews((previous) => {
                  const next = { ...previous }

                  decisions.forEach((decision) => {
                    const reviewCase = casesByIndex.get(
                      decision.question_index,
                    )
                    const question = quiz.questions[
                      decision.question_index
                    ]

                    if (!reviewCase || !question) {
                      return
                    }

                    next[
                      buildAiAnswerReviewKey(
                        question,
                        reviewCase.student_answer,
                      )
                    ] = decision
                  })

                  return next
                })

                setSaveMessage(
                  `${decisions.length} borderline short ${
                    decisions.length === 1
                      ? 'answer received'
                      : 'answers received'
                  } a semantic second review.`,
                )
              } catch {
                setSaveMessage(
                  'Semantic second review was unavailable; deterministic grading was used.',
                )
              } finally {
                setIsReviewingAnswers(false)
              }
            }

            setShowResults(true)
            setResultSaved(false)

            setTimeout(() => {
              document
                .getElementById('quiz-results')
                ?.scrollIntoView({
                  behavior: 'smooth',
                  block: 'center',
                })
            }, 100)
          }

          '''.replace('          ', '')
              text = text[:start] + new_check + text[end:]

          old = """    setIsSavingHistory(true)
            setSaveMessage('')

            try {
          """.replace('          ', '')
          new = """    setIsSavingHistory(true)
            setSaveMessage('')

            const quizDataForHistory = {
              ...quiz,
              questions: quiz.questions.map(
                (question, questionIndex) => {
                  const answer = selectedAnswers[questionIndex]

                  if (
                    question.question_type !== 'short_answer' ||
                    typeof answer !== 'string'
                  ) {
                    return question
                  }

                  const review =
                    aiGradeReviews[
                      buildAiAnswerReviewKey(
                        question,
                        answer,
                      )
                    ]

                  if (review?.verdict !== 'correct') {
                    return question
                  }

                  return {
                    ...question,
                    ai_accepted_answers: Array.from(
                      new Set([
                        ...(question.ai_accepted_answers ?? []),
                        answer,
                      ]),
                    ),
                  }
                },
              ),
            }

            try {
          """.replace('          ', '')
          text = replace_once(text, old, new, 'save history')

          old = "        quizData:\n          quiz,\n"
          new = "        quizData:\n          quizDataForHistory,\n"
          text = replace_once(text, old, new, 'history quiz data')

          grade_anchor = """                      const shortAnswerGrade =
            question.question_type ===
              'short_answer' &&
            typeof selectedAnswer ===
              'string'
              ? gradeShortAnswer(
                  question,
                  selectedAnswer,
                )
              : null

          """.replace('          ', '')
          grade_addition = """                      const aiAnswerReview =
            question.question_type ===
              'short_answer' &&
            typeof selectedAnswer ===
              'string'
              ? aiGradeReviews[
                  buildAiAnswerReviewKey(
                    question,
                    selectedAnswer,
                  )
                ] ?? null
              : null

          """.replace('          ', '')
          if grade_addition not in text:
              text = replace_once(text, grade_anchor, grade_anchor + grade_addition, 'render review')

          text = text.replace(
              '!shortAnswerGrade.correct &&',
              '!isCorrect &&',
              1,
          )
          text = text.replace(
              "shortAnswerGrade\n                                  ?.borderline && (",
              "shortAnswerGrade\n                                  ?.borderline &&\n                                !isCorrect && (",
              1,
          )

          semantic_anchor = "                              {!isCorrect && (\n"
          semantic_block = '''                              {question.question_type ===
            'short_answer' &&
            aiAnswerReview && (
            <p>
              <strong>
                Semantic second review:
              </strong>{' '}
              {aiAnswerReview.reason}
            </p>
          )}

          '''.replace('          ', '')
          if semantic_block not in text:
              idx = text.index(semantic_anchor, text.index('const aiAnswerReview'))
              text = text[:idx] + semantic_block + text[idx:]

          old = '''                  <button
            className="button primary-button check-button"
            type="button"
            onClick={
              handleCheckAnswers
            }
          >
            Check Answers
          </button>
          '''.replace('          ', '')
          new = '''                  <button
            className="button primary-button check-button"
            type="button"
            onClick={
              handleCheckAnswers
            }
            disabled={
              isReviewingAnswers
            }
          >
            {isReviewingAnswers
              ? 'Reviewing Answers...'
              : 'Check Answers'}
          </button>
          '''.replace('          ', '')
          text = replace_once(text, old, new, 'check button')

          text = text.replace(
              'disabled={\n                                          showResults\n                                        }',
              'disabled={\n                                          showResults ||\n                                          isReviewingAnswers\n                                        }',
              1,
          )
          text = text.replace(
              'disabled={\n                                  showResults\n                                }',
              'disabled={\n                                  showResults ||\n                                  isReviewingAnswers\n                                }',
              1,
          )

          path.write_text(text)
          PY

      - name: Commit integration patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/main.py frontend/src/App.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Integrate semantic fallback into quiz grading"
          git push origin HEAD:ai-borderline-answer-review
