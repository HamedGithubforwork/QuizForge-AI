name: Permanent Lightsail activation and verification

on:
  pull_request:
    paths:
      - ".github/workflows/lightsail-production-activation.yml"
      - "scripts/lightsail_activation/**"
      - "infra/aws/lightsail-production/**"
      - "scripts/production/lightsail/**"
      - "scripts/cognito_browser/identity_triggers.py"
      - "scripts/cognito_browser/pre_signup.py"
  workflow_dispatch:
    inputs:
      operation:
        description: Activate the reviewed permanent Lightsail infrastructure or verify existing settings
        type: choice
        options: [verify, activate]
        default: verify
      reviewed_manifest_sha256:
        description: For activate only; paste 494e975cedf232737c76572d28a68263bb1d82beb1461ffc29d895109c761572
        type: string
        required: false
        default: ''
      confirmation:
        description: For activate only; type ACTIVATE PERMANENT LIGHTSAIL ONLY
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - name: Credential-free activation and reviewer tests
        run: python -m unittest discover -s scripts/lightsail_activation/tests -p 'test_*.py' -v
      - name: Check exact permanent-host source blobs
        run: python -m scripts.lightsail_activation.review check-source
      - name: Build deterministic Cognito recovery package
        run: python scripts/production/lightsail/package_recovery.py
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.7"
          terraform_wrapper: false
      - name: Validate permanent-host Terraform without AWS credentials
        env:
          TF_DATA_DIR: ${{ runner.temp }}/lightsail-production-activation-validation
        run: |
          terraform -chdir=infra/aws/lightsail-production init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/aws/lightsail-production validate
          terraform -chdir=infra/aws/lightsail-production test

  cloud:
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'HamedGithubforwork/QuizForge-AI'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: quizforge-permanent-lightsail-isolated-state
      cancel-in-progress: false
    env:
      QF_OPERATION: ${{ github.event.inputs.operation }}
      TF_WORKSPACE: default
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.7"
          terraform_wrapper: false

      - name: Validate manual authorization before any cloud request
        env:
          QF_REVIEWED_MANIFEST: ${{ github.event.inputs.reviewed_manifest_sha256 }}
          QF_CONFIRMATION: ${{ github.event.inputs.confirmation }}
          QF_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          QF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          AWS_BUDGET_ALERT_EMAIL: ${{ secrets.AWS_BUDGET_ALERT_EMAIL }}
          LIGHTSAIL_SSH_PUBLIC_KEY: ${{ secrets.LIGHTSAIL_SSH_PUBLIC_KEY }}
          LIGHTSAIL_ADMIN_IPV4_CIDR: ${{ secrets.LIGHTSAIL_ADMIN_IPV4_CIDR }}
        run: python -m scripts.lightsail_activation.gate preflight "$QF_OPERATION"

      - name: Build deterministic Cognito recovery package
        run: python scripts/production/lightsail/package_recovery.py

      - name: Prepare private Terraform variables
        env:
          AWS_BUDGET_ALERT_EMAIL: ${{ secrets.AWS_BUDGET_ALERT_EMAIL }}
          LIGHTSAIL_SSH_PUBLIC_KEY: ${{ secrets.LIGHTSAIL_SSH_PUBLIC_KEY }}
          LIGHTSAIL_ADMIN_IPV4_CIDR: ${{ secrets.LIGHTSAIL_ADMIN_IPV4_CIDR }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "lightsail-production.tfvars.json"
          p.write_text(json.dumps({
              "alert_email": os.environ["AWS_BUDGET_ALERT_EMAIL"],
              "ssh_public_key": os.environ["LIGHTSAIL_SSH_PUBLIC_KEY"],
              "admin_ipv4_cidr": os.environ["LIGHTSAIL_ADMIN_IPV4_CIDR"],
              "public_signup": True,
          }) + "\n")
          p.chmod(0o600)
          PY

      - name: Assume existing deployment role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: qf-permanent-lightsail-activation
          role-duration-seconds: 1800
          aws-region: ca-central-1
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Initialize only the permanent Lightsail state
        env:
          QF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_DATA_DIR: ${{ runner.temp }}/lightsail-production-activation-tfdata
        run: |
          terraform -chdir=infra/aws/lightsail-production init \
            -reconfigure -input=false -lockfile=readonly \
            -backend-config="bucket=$QF_STATE_BUCKET" \
            -backend-config="key=quizforge/lightsail-production/terraform.tfstate" \
            -backend-config="region=ca-central-1" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Create, revalidate, and apply exactly one fresh saved plan
        if: github.event.inputs.operation == 'activate'
        env:
          TF_DATA_DIR: ${{ runner.temp }}/lightsail-production-activation-tfdata
          QF_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          QF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          AWS_BUDGET_ALERT_EMAIL: ${{ secrets.AWS_BUDGET_ALERT_EMAIL }}
          LIGHTSAIL_SSH_PUBLIC_KEY: ${{ secrets.LIGHTSAIL_SSH_PUBLIC_KEY }}
          LIGHTSAIL_ADMIN_IPV4_CIDR: ${{ secrets.LIGHTSAIL_ADMIN_IPV4_CIDR }}
        run: |
          set +e
          terraform -chdir=infra/aws/lightsail-production plan \
            -input=false -lock=true -lock-timeout=60s -detailed-exitcode \
            -var-file="$RUNNER_TEMP/lightsail-production.tfvars.json" \
            -out="$RUNNER_TEMP/lightsail-production.tfplan" \
            >"$RUNNER_TEMP/lightsail-activation-plan.log" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then
            python -m scripts.lightsail_activation.gate failure ACTIVATION_PLAN_NOT_EXACTLY_INITIAL_CREATES
            exit 1
          fi

          terraform -chdir=infra/aws/lightsail-production show -json \
            "$RUNNER_TEMP/lightsail-production.tfplan" \
            >"$RUNNER_TEMP/lightsail-production-plan.json"

          python -m scripts.lightsail_activation.gate review-plan \
            "$RUNNER_TEMP/lightsail-production-plan.json" \
            "$RUNNER_TEMP/lightsail-production.tfplan"

          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          plan = Path(os.environ["RUNNER_TEMP"]) / "lightsail-production.tfplan"
          digest = hashlib.sha256(plan.read_bytes()).hexdigest()
          p = Path(os.environ["RUNNER_TEMP"]) / "lightsail-production.plan.sha256"
          p.write_text(digest + "\n")
          p.chmod(0o600)
          PY

          python -m scripts.lightsail_activation.review check-source

          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          plan = root / "lightsail-production.tfplan"
          expected = (root / "lightsail-production.plan.sha256").read_text().strip()
          if hashlib.sha256(plan.read_bytes()).hexdigest() != expected:
              raise SystemExit("Saved plan changed")
          PY

          chmod 0400 "$RUNNER_TEMP/lightsail-production.tfplan"
          python -m scripts.lightsail_activation.gate mark apply-started

          terraform -chdir=infra/aws/lightsail-production apply \
            -input=false -lock=true -lock-timeout=60s \
            "$RUNNER_TEMP/lightsail-production.tfplan" \
            >"$RUNNER_TEMP/lightsail-activation-apply.log" 2>&1

          python -m scripts.lightsail_activation.gate mark apply-complete

      - name: Read back exact state and require zero live drift
        env:
          TF_DATA_DIR: ${{ runner.temp }}/lightsail-production-activation-tfdata
          QF_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          QF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          AWS_BUDGET_ALERT_EMAIL: ${{ secrets.AWS_BUDGET_ALERT_EMAIL }}
          LIGHTSAIL_SSH_PUBLIC_KEY: ${{ secrets.LIGHTSAIL_SSH_PUBLIC_KEY }}
          LIGHTSAIL_ADMIN_IPV4_CIDR: ${{ secrets.LIGHTSAIL_ADMIN_IPV4_CIDR }}
        run: |
          terraform -chdir=infra/aws/lightsail-production state list \
            >"$RUNNER_TEMP/lightsail-production-state-list.txt"
          python -m scripts.lightsail_activation.gate verify-state \
            "$RUNNER_TEMP/lightsail-production-state-list.txt"

          set +e
          terraform -chdir=infra/aws/lightsail-production plan \
            -input=false -refresh=true -lock=false -detailed-exitcode \
            -var-file="$RUNNER_TEMP/lightsail-production.tfvars.json" \
            >"$RUNNER_TEMP/lightsail-production-verify.log" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            python -m scripts.lightsail_activation.gate failure LIVE_READBACK_NOT_ZERO_DRIFT
            exit 1
          fi
          python -m scripts.lightsail_activation.gate mark verified

      - name: Record safe failure state
        if: failure()
        env:
          QF_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          QF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          AWS_BUDGET_ALERT_EMAIL: ${{ secrets.AWS_BUDGET_ALERT_EMAIL }}
          LIGHTSAIL_SSH_PUBLIC_KEY: ${{ secrets.LIGHTSAIL_SSH_PUBLIC_KEY }}
          LIGHTSAIL_ADMIN_IPV4_CIDR: ${{ secrets.LIGHTSAIL_ADMIN_IPV4_CIDR }}
        run: python -m scripts.lightsail_activation.gate failure WORKFLOW_STAGE_FAILED || true

      - name: Remove private plans, variables, state diagnostics, and provider logs
        if: always()
        run: |
          rm -f \
            "$RUNNER_TEMP/lightsail-production.tfvars.json" \
            "$RUNNER_TEMP/lightsail-production.tfplan" \
            "$RUNNER_TEMP/lightsail-production-plan.json" \
            "$RUNNER_TEMP/lightsail-production.plan.sha256" \
            "$RUNNER_TEMP/lightsail-production-state-list.txt" \
            "$RUNNER_TEMP/lightsail-activation-plan.log" \
            "$RUNNER_TEMP/lightsail-activation-apply.log" \
            "$RUNNER_TEMP/lightsail-production-verify.log" \
            infra/aws/lightsail-production/recovery.zip

      - name: Publish only the sanitized activation summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: permanent-lightsail-activation-summary
          path: lightsail-activation-results/summary.json
          if-no-files-found: error
          retention-days: 30
