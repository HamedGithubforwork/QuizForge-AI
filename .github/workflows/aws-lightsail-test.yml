name: Temporary Lightsail capacity test

on:
  pull_request:
    paths:
      - scripts/lightsail_test/**
      - infra/aws/lightsail-test-cleanup/**
      - .github/workflows/aws-lightsail-test.yml
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect reads only; run creates one temporary USD12/month server
        type: choice
        options: [inspect, run, cleanup]
        default: inspect
        required: true
      test_id:
        description: Only for cleanup; exact GitHub run ID-attempt from run.json
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: lightsail-capacity-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'manual' }}
  cancel-in-progress: false

jobs:
  validate:
    name: Lightsail controller boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.16'
      - run: python -m pip install --require-hashes -r scripts/rds_rehearsal/requirements.lock
      - run: python -m unittest discover -s scripts/lightsail_test -p 'test_*.py' -v
      - run: bash -n scripts/lightsail_test/bootstrap.sh scripts/lightsail_test/remote.sh
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.14.7'
      - run: terraform -chdir=infra/aws/lightsail-test-cleanup fmt -check -recursive
      - run: terraform -chdir=infra/aws/lightsail-test-cleanup init -backend=false
      - run: terraform -chdir=infra/aws/lightsail-test-cleanup validate
      - run: terraform -chdir=infra/aws/lightsail-test-cleanup test

  build:
    name: Build pinned synthetic laboratory without AWS identity
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation == 'run'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require the reviewed application's exact passing commit
        id: app
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_PR: '127'
          REQUIRE_POSTGRES_HISTORY: '1'
        run: python scripts/aws_staging_preview.py
      - name: Refuse an unreviewed replacement application
        env:
          RESOLVED_APP: ${{ steps.app.outputs.sha }}
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, 'scripts/lightsail_test')
          from policy import APP_SHA
          assert os.environ['RESOLVED_APP'] == APP_SHA, 'Review and repin before testing a newer app'
          PY
      - uses: actions/checkout@v7
        with:
          ref: 52f44f16794369601f21e429b15389efcf7d62e4
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: f3c63fec355fc8552e4a68142860f88e874281f6
          path: harness/preview-source
          persist-credentials: false
      - run: docker build -f harness/scripts/capacity/Dockerfile -t quizforge-capacity:checked harness
      - name: Package immutable test image and source manifest
        run: |
          mkdir capacity-build
          docker save quizforge-capacity:checked | gzip -1 > capacity-build/capacity-image.tar.gz
          python - <<'PY'
          import hashlib, json, pathlib, sys
          sys.path.insert(0, 'scripts/lightsail_test')
          from policy import APP_SHA, HARNESS_SHA
          root = pathlib.Path('capacity-build')
          with (root / 'capacity-image.tar.gz').open('rb') as image:
              digest = hashlib.file_digest(image, 'sha256').hexdigest()
          (root / 'manifest.json').write_text(json.dumps({
              'application_sha': APP_SHA, 'harness_sha': HARNESS_SHA, 'image_sha256': digest}))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: capacity-build
          path: capacity-build/
          retention-days: 1
          compression-level: 0

  control:
    name: ${{ inputs.operation }} Canadian Lightsail test
    needs: [validate, build]
    if: >-
      always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      needs.validate.result == 'success' &&
      (needs.build.result == 'success' || (inputs.operation != 'run' && needs.build.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: read
      id-token: write
    env:
      OPERATION: ${{ inputs.operation }}
      TEST_ID: ${{ inputs.test_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.16'
      - run: python -m pip install --require-hashes -r scripts/rds_rehearsal/requirements.lock
      - uses: actions/download-artifact@v8
        if: inputs.operation == 'run'
        with:
          name: capacity-build
          path: capacity-build
      - name: Derive the account from the existing deployment role
        env:
          DEPLOY_ROLE: ${{ vars.AWS_ROLE_ARN }}
        run: |
          python - <<'PY'
          import os, re
          match = re.fullmatch(r'arn:aws:iam::([0-9]{12}):role/[A-Za-z0-9+=,.@_/-]+', os.environ['DEPLOY_ROLE'])
          assert match, 'Existing AWS_ROLE_ARN is required'
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('TEST_ACCOUNT_ID=' + match[1] + '\n')
          PY
      - name: Generate operation-specific session boundary
        id: policy
        run: python scripts/lightsail_test/policy.py
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ca-central-1
          role-duration-seconds: 3600
          inline-session-policy: ${{ steps.policy.outputs.json }}
      - name: Read prerequisites or execute the bounded laboratory
        run: python scripts/lightsail_test/control.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lightsail-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: lightsail-results/
          if-no-files-found: warn
          retention-days: 7
