name: ECS Fargate smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecs-fargate-smoke
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  smoke:
    name: Run one-off Fargate task
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/aws

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Initialize remote state
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=quizforge/foundation/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Resolve ECS task settings
        run: |
          echo "ECS_CLUSTER=$(terraform output -raw ecs_cluster_name)" >> "$GITHUB_ENV"
          echo "ECS_TASK_DEFINITION=$(terraform output -raw ecs_task_definition_arn)" >> "$GITHUB_ENV"
          echo "ECS_SECURITY_GROUP=$(terraform output -raw app_security_group_id)" >> "$GITHUB_ENV"
          echo "ECS_SUBNETS=$(terraform output -json public_subnet_ids | jq -r 'join(",")')" >> "$GITHUB_ENV"

      - name: Start one-off Fargate task
        run: |
          response="$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --launch-type FARGATE \
            --task-definition "$ECS_TASK_DEFINITION" \
            --count 1 \
            --network-configuration "awsvpcConfiguration={subnets=[$ECS_SUBNETS],securityGroups=[$ECS_SECURITY_GROUP],assignPublicIp=ENABLED}")"

          task_arn="$(printf '%s' "$response" | jq -r '.tasks[0].taskArn // empty')"

          if [ -z "$task_arn" ]; then
            echo "$response"
            echo "ECS did not return a task ARN."
            exit 1
          fi

          echo "ECS_TASK_ARN=$task_arn" >> "$GITHUB_ENV"
          echo "Started $task_arn"

      - name: Wait for container health
        run: |
          for attempt in $(seq 1 60); do
            response="$(aws ecs describe-tasks \
              --cluster "$ECS_CLUSTER" \
              --tasks "$ECS_TASK_ARN")"

            last_status="$(printf '%s' "$response" | jq -r '.tasks[0].lastStatus // "UNKNOWN"')"
            health_status="$(printf '%s' "$response" | jq -r '.tasks[0].healthStatus // "UNKNOWN"')"

            echo "Attempt $attempt: task=$last_status health=$health_status"

            if [ "$health_status" = "HEALTHY" ]; then
              echo "QuizForge FastAPI is healthy on Fargate."
              exit 0
            fi

            if [ "$last_status" = "STOPPED" ]; then
              printf '%s\n' "$response"
              echo "The Fargate task stopped before becoming healthy."
              exit 1
            fi

            sleep 5
          done

          echo "The Fargate task did not become healthy within five minutes."
          exit 1

      - name: Show recent API logs on failure
        if: failure()
        run: aws logs tail /quizforge/api --since 10m --format short || true

      - name: Stop smoke-test task
        if: always()
        run: |
          if [ -n "${ECS_TASK_ARN:-}" ]; then
            aws ecs stop-task \
              --cluster "$ECS_CLUSTER" \
              --task "$ECS_TASK_ARN" \
              --reason "QuizForge one-off ECS smoke test finished" \
              >/dev/null || true
          fi
