name: Desktop preview

on:
  pull_request:
    branches: [application/production]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-preview:
    name: Windows desktop preview
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm test
      - name: Exercise the real sandboxed renderer
        run: npx --no-install electron test/runtime.cjs
      - name: Verify signed-out hosted sign-in
        run: npx --no-install electron test/hosted-login.cjs
      - name: Build internal preview installer
        run: npm run pack:windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify real Windows update signatures and failed-download recovery
        run: ./test/update-signatures.ps1
        timeout-minutes: 5
      - name: Build synthetic previous-version installer for in-place upgrade acceptance
        run: npx --no-install electron-builder --win nsis --x64 --publish never '-c.extraMetadata.version=0.0.1' '-c.directories.output=dist-previous'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify unsigned output cannot pass the signing gate
        run: ./test/signing-gate.ps1
      - name: Install, launch and uninstall packaged preview
        run: ./test/installer.ps1
      - name: Build and inspect unsigned Store packaging fixture
        run: |
          npm run pack:store
          if ($LASTEXITCODE -ne 0) { throw 'Store fixture build failed.' }
          ./test/store-package.ps1
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          QFN_STORE_IDENTITY_NAME: QuizFromNotes.CITest
          QFN_STORE_PUBLISHER: CN=QuizFromNotes CI Test
          QFN_STORE_PUBLISHER_DISPLAY_NAME: CI Test Only
          QFN_STORE_DISPLAY_NAME: Quiz From Notes CI Test
      - name: Retain preview for manual Windows acceptance
        uses: actions/upload-artifact@v7
        with:
          name: quiz-from-notes-windows-preview
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 7
