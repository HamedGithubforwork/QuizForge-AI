name: Lightsail cleanup prerequisite

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Plan reads only; apply creates the reviewed cleanup role and schedule group
        type: choice
        options: [plan, apply]
        default: plan
        required: true

permissions:
  contents: read

concurrency:
  group: lightsail-cleanup-prerequisite
  cancel-in-progress: false

jobs:
  setup:
    name: ${{ inputs.operation }} cleanup prerequisite only
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      OPERATION: ${{ inputs.operation }}
      STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.16'
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.14.7'
          terraform_wrapper: false
      - name: Derive the existing account
        env:
          DEPLOY_ROLE: ${{ vars.AWS_ROLE_ARN }}
        run: |
          python - <<'PY'
          import os, re
          match = re.fullmatch(r'arn:aws:iam::([0-9]{12}):role/[A-Za-z0-9+=,.@_/-]+', os.environ['DEPLOY_ROLE'])
          assert match, 'Existing AWS_ROLE_ARN is required'
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('TEST_ACCOUNT_ID=' + match[1] + '\n')
          PY
      - id: policy
        run: python scripts/lightsail_test/setup.py policy
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ca-central-1
          inline-session-policy: ${{ steps.policy.outputs.json }}
      - name: Initialize a separate encrypted state key
        run: |
          terraform -chdir=infra/aws/lightsail-test-cleanup init -reconfigure -lockfile=readonly \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=quizforge/lightsail-test-cleanup/terraform.tfstate" \
            -backend-config="region=ca-central-1" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - name: Validate and inspect exactly the three cleanup resources
        run: |
          terraform -chdir=infra/aws/lightsail-test-cleanup validate
          lock=true
          if [ "$OPERATION" = plan ]; then lock=false; fi
          terraform -chdir=infra/aws/lightsail-test-cleanup plan -lock="$lock" -out="$RUNNER_TEMP/cleanup.tfplan"
          terraform -chdir=infra/aws/lightsail-test-cleanup show -json "$RUNNER_TEMP/cleanup.tfplan" > "$RUNNER_TEMP/cleanup-plan.json"
          python scripts/lightsail_test/setup.py check "$RUNNER_TEMP/cleanup-plan.json"
      - name: Apply only the checked saved plan after explicit setup authorization
        if: inputs.operation == 'apply'
        run: terraform -chdir=infra/aws/lightsail-test-cleanup apply -auto-approve "$RUNNER_TEMP/cleanup.tfplan"
