name: Security checks

on:
  workflow_dispatch:
  schedule:
    - cron: "23 13 * * 1"
  push:
    branches:
      - main
    paths:
      - "backend/requirements*.txt"
      - "frontend/package*.json"
      - "e2e/package*.json"
      - ".github/workflows/security.yml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/requirements*.txt"
      - "frontend/package*.json"
      - "e2e/package*.json"
      - ".github/workflows/security.yml"

permissions:
  contents: read

jobs:
  backend-dependency-audit:
    name: Backend dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit

      - name: Audit backend runtime dependencies
        run: python -m pip_audit -r backend/requirements.txt

  frontend-dependency-audit:
    name: Frontend dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Audit production frontend dependencies
        run: npm --prefix frontend audit --omit=dev --audit-level=low

  e2e-dependency-audit:
    name: E2E dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        run: npm ci --prefix e2e

      - name: Audit E2E dependencies
        run: npm --prefix e2e audit --audit-level=high
