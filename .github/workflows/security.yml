name: Security checks

on:
  workflow_dispatch:
  schedule:
    - cron: "23 13 * * 1"
  push:
    branches:
      - main
    paths:
      - "backend/requirements*"
      - "frontend/package*.json"
      - "e2e/package*.json"
      - ".github/workflows/security.yml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/requirements*"
      - "frontend/package*.json"
      - "e2e/package*.json"
      - ".github/workflows/security.yml"

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect dependency changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      e2e: ${{ steps.changes.outputs.e2e }}

    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify dependency changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" != "push" && "${EVENT_NAME}" != "pull_request" ]]; then
            echo "backend=true" >> "${GITHUB_OUTPUT}"
            echo "frontend=true" >> "${GITHUB_OUTPUT}"
            echo "e2e=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" > changed-files.txt
          elif [[ -n "${BEFORE_SHA}" && "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
            git diff --name-only "${BEFORE_SHA}" "${CURRENT_SHA}" > changed-files.txt
          else
            git show --pretty="" --name-only "${CURRENT_SHA}" > changed-files.txt
          fi

          backend=false
          frontend=false
          e2e=false

          while IFS= read -r file; do
            case "${file}" in
              backend/requirements*)
                backend=true
                ;;
              frontend/package*.json)
                frontend=true
                ;;
              e2e/package*.json)
                e2e=true
                ;;
              .github/workflows/security.yml)
                backend=true
                frontend=true
                e2e=true
                ;;
            esac
          done < changed-files.txt

          echo "backend=${backend}" >> "${GITHUB_OUTPUT}"
          echo "frontend=${frontend}" >> "${GITHUB_OUTPUT}"
          echo "e2e=${e2e}" >> "${GITHUB_OUTPUT}"

  backend-dependency-audit:
    name: Backend dependency audit
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit

      - name: Audit backend runtime dependency lock
        run: python -m pip_audit -r backend/requirements.lock

  frontend-dependency-audit:
    name: Frontend dependency audit
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Audit production frontend dependencies
        run: npm --prefix frontend audit --omit=dev --audit-level=low

  e2e-dependency-audit:
    name: E2E dependency audit
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        run: npm ci --prefix e2e

      - name: Audit E2E dependencies
        run: npm --prefix e2e audit --audit-level=high
