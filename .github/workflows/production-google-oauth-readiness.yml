name: Production Google OAuth protected readiness

on:
  pull_request:
    paths:
      - ".github/workflows/production-google-oauth-readiness.yml"
      - "scripts/production/lightsail/google_provider_readiness.py"
      - "scripts/production/lightsail/test_google_provider_readiness.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Test credential-safe read-only production checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - name: Run no-cloud tests without OAuth secrets or AWS permissions
        run: |
          python -m py_compile scripts/production/lightsail/google_provider_readiness.py
          python -m unittest scripts.production.lightsail.test_google_provider_readiness -v

  production-readonly:
    name: Check existing production Cognito provider without changes
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'HamedGithubforwork/QuizForge-AI' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment:
      name: production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: quizforge-protected-production-google-oauth-readonly
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - name: Install existing hash-locked AWS SDK
        run: python -m pip install --require-hashes -r scripts/production/requirements.lock
      - name: Assume read-only Cognito AWS permissions
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: \${{ secrets.AWS_ROLE_ARN }}
          role-session-name: qf-protected-production-google-readiness
          role-duration-seconds: 600
          aws-region: ca-central-1
          mask-aws-account-id: true
          unset-current-credentials: true
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{
              "Effect":"Allow",
              "Action":[
                "sts:GetCallerIdentity",
                "cognito-idp:ListUserPools",
                "cognito-idp:ListUserPoolClients",
                "cognito-idp:DescribeUserPoolClient",
                "cognito-idp:DescribeIdentityProvider"
              ],
              "Resource":"*"
            }]}
      - name: Check production Google OAuth credentials and Cognito wiring safely
        env:
          PROD_GOOGLE_OAUTH_CLIENT_ID: \${{ secrets.PROD_GOOGLE_OAUTH_CLIENT_ID }}
          PROD_GOOGLE_OAUTH_CLIENT_SECRET: \${{ secrets.PROD_GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          set +x
          python -m scripts.production.lightsail.google_provider_readiness
