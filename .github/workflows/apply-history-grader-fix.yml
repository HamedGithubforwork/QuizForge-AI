name: Apply history grader fix

on:
  push:
    branches:
      - fix-history-short-answer-grading

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix-history-short-answer-grading

      - name: Update quiz history grading
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/QuizHistory.tsx')
          text = path.read_text(encoding='utf-8')

          old_import = """import {\n  deleteQuizHistory,\n  getQuizHistory,\n  type QuizHistoryRow,\n} from './lib/quizHistory'\n\nimport './QuizHistory.css'\n"""
          new_import = """import {\n  deleteQuizHistory,\n  getQuizHistory,\n  type QuizHistoryRow,\n} from './lib/quizHistory'\nimport {\n  isHistoryQuestionCorrect,\n} from './lib/historyQuestionGrader'\nimport type {\n  ShortAnswerGradingSpec,\n} from './lib/shortAnswerGrader'\n\nimport './QuizHistory.css'\n"""
          if old_import not in text:
              raise SystemExit('Expected QuizHistory import block not found')
          text = text.replace(old_import, new_import, 1)

          old_type = """  accepted_answers: string[]\n  explanation: string\n"""
          new_type = """  accepted_answers: string[]\n  grading?: ShortAnswerGradingSpec\n  explanation: string\n"""
          if old_type not in text:
              raise SystemExit('Expected StoredQuestion fields not found')
          text = text.replace(old_type, new_type, 1)

          start = text.index('function normalizeAnswer(')
          end = text.index('function isStoredQuestion(')
          text = text[:start] + text[end:]
          text = text.replace('isQuestionCorrect(', 'isHistoryQuestionCorrect(')

          path.write_text(text, encoding='utf-8')

          test_path = Path('frontend/src/lib/historyQuestionGrader.test.ts')
          test_path.write_text("""// @ts-nocheck\nimport assert from 'node:assert/strict'\n\nimport {\n  isHistoryQuestionCorrect,\n} from './historyQuestionGrader.ts'\n\nconst conceptQuestion = {\n  question_type: 'short_answer',\n  correct_index: -1,\n  correct_answer:\n    'Cognitive-behavioural therapy, interpersonal therapy, and behavioural activation',\n  accepted_answers: [],\n  grading: {\n    grading_version: 2,\n    grading_mode: 'concepts',\n    answer_groups: [\n      ['cognitive behavioural therapy', 'CBT'],\n      ['interpersonal therapy', 'IPT'],\n      ['behavioural activation', 'behavioral activation', 'BA'],\n    ],\n    required_group_count: 3,\n    numeric_value: 0,\n    numeric_tolerance: 0,\n    numeric_unit: '',\n  },\n}\n\nassert.equal(\n  isHistoryQuestionCorrect(\n    conceptQuestion,\n    'CBT IPT behavioural activation',\n  ),\n  true,\n  'history grading should accept the same concept answer as the live quiz grader',\n)\n\nassert.equal(\n  isHistoryQuestionCorrect(\n    conceptQuestion,\n    'CBT IPT',\n  ),\n  false,\n  'history grading should reject incomplete concept answers',\n)\n\nconst multipleChoiceQuestion = {\n  question_type: 'multiple_choice',\n  correct_index: 2,\n  correct_answer: 'ARP',\n  accepted_answers: ['ARP'],\n}\n\nassert.equal(\n  isHistoryQuestionCorrect(\n    multipleChoiceQuestion,\n    2,\n  ),\n  true,\n)\n\nassert.equal(\n  isHistoryQuestionCorrect(\n    multipleChoiceQuestion,\n    1,\n  ),\n  false,\n)\n\nconsole.log('History question grader tests passed.')\n""", encoding='utf-8')

          ci_path = Path('.github/workflows/ci.yml')
          ci = ci_path.read_text(encoding='utf-8')
          old_ci = """      - name: Run short-answer grader tests\n        run: node --experimental-strip-types src/lib/shortAnswerGrader.test.ts\n"""
          new_ci = """      - name: Run frontend grader tests\n        run: |\n          node --experimental-strip-types src/lib/shortAnswerGrader.test.ts\n          node --experimental-strip-types src/lib/historyQuestionGrader.test.ts\n"""
          if old_ci not in ci:
              raise SystemExit('Expected CI grader step not found')
          ci_path.write_text(ci.replace(old_ci, new_ci, 1), encoding='utf-8')

          Path('.github/workflows/apply-history-grader-fix.yml').unlink()
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/QuizHistory.tsx frontend/src/lib/historyQuestionGrader.test.ts .github/workflows/ci.yml .github/workflows/apply-history-grader-fix.yml
          git commit -m "Use shared short-answer grader in quiz history"
          git push origin HEAD:fix-history-short-answer-grading
