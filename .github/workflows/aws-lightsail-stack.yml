name: Current Lightsail stack acceptance
on:
  pull_request:
    paths:
      - scripts/lightsail_stack_test/**
      - .github/workflows/aws-lightsail-stack.yml
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect reads only; run tests one temporary current-stack server
        type: choice
        options: [inspect, run, cleanup]
        default: inspect
        required: true
      test_id:
        description: Only for cleanup; exact run ID-attempt
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: lightsail-capacity-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'manual' }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.16'
      - run: python -m pip install --require-hashes -r scripts/rds_rehearsal/requirements.lock
      - run: |
          python -m compileall -q scripts/lightsail_stack_test
          bash -n scripts/lightsail_stack_test/remote.sh
          python - <<'PYTEST'
          import sys,unittest
          sys.path.insert(0,'scripts/lightsail_test')
          sys.path.insert(0,'scripts/lightsail_stack_test')
          import host_control,test_control
          test_control.control=host_control
          result=unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.loadTestsFromModule(test_control))
          assert result.wasSuccessful()
          PYTEST
  build:
    name: Build and measure the current stack without AWS identity
    needs: validate
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation == 'run')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require the reviewed application's exact passing commit
        id: app
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_PR: '127'
          REQUIRE_POSTGRES_HISTORY: '1'
        run: python scripts/aws_staging_preview.py
      - name: Require the fixed current application
        env:
          RESOLVED_APP: ${{ steps.app.outputs.sha }}
        run: |
          python - <<'PYCHECK'
          import os
          assert os.environ['RESOLVED_APP']=='807a4084237f6db544620cdb8322108ebf52251c'
          PYCHECK
      - uses: actions/checkout@v7
        with:
          ref: 62e39f33d715cc83928390cfd5ff1728008c4053
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 807a4084237f6db544620cdb8322108ebf52251c
          path: application-candidate
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.16'
      - name: Build the reviewed runtime images
        run: |
          python -m venv /tmp/quizforge-stack-venv
          /tmp/quizforge-stack-venv/bin/pip install --require-hashes -r candidate/scripts/rds_rehearsal/requirements.lock
          docker build -t quizforge-ci-api application-candidate/backend
          docker build -t quizforge-ci-operations -f candidate/scripts/production/operations.Dockerfile candidate
          docker build -t quizforge-ci-caddy --build-arg CADDY_BASE_IMAGE=caddy:2 -f candidate/scripts/production/lightsail/caddy.Dockerfile candidate
          docker pull postgres:17
          docker pull redis:7
      - name: Test six-service startup and concurrent OCR/backup under aggregate limits
        if: github.event_name == 'pull_request'
        env:
          STACK_RESULTS: ${{ runner.temp }}/stack-results
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_TEMP,STACK_RESULTS /tmp/quizforge-stack-venv/bin/python scripts/lightsail_stack_test/fixture.py
      - uses: actions/upload-artifact@v7
        if: always() && github.event_name == 'pull_request'
        with:
          name: current-stack-ci-results
          path: ${{ runner.temp }}/stack-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Package the fixed stack for the credential-free temporary host
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p stack-package/scripts stack-package/candidate capacity-build
          cp -a scripts/lightsail_stack_test stack-package/scripts/
          cp -a candidate/scripts stack-package/candidate/
          python - <<'PYCOMPOSE'
          import json,shutil,subprocess
          plugins=json.loads(subprocess.check_output(['docker','info','--format','{{json .ClientInfo.Plugins}}']))
          compose=next(p['Path'] for p in plugins if p['Name']=='compose')
          shutil.copyfile(compose,'stack-package/docker-compose')
          PYCOMPOSE
          docker save -o stack-package/images.tar quizforge-ci-api quizforge-ci-operations quizforge-ci-caddy postgres:17 redis:7
          tar -czf capacity-build/capacity-image.tar.gz -C stack-package .
          python - <<'PYMANIFEST'
          import hashlib,json,pathlib
          root=pathlib.Path('capacity-build')
          with (root/'capacity-image.tar.gz').open('rb') as f: digest=hashlib.file_digest(f,'sha256').hexdigest()
          (root/'manifest.json').write_text(json.dumps({'application_sha':'807a4084237f6db544620cdb8322108ebf52251c',
              'harness_sha':'62e39f33d715cc83928390cfd5ff1728008c4053','image_sha256':digest}))
          PYMANIFEST
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          name: capacity-build
          path: capacity-build/
          retention-days: 1
          compression-level: 0
  control:
    name: ${{ inputs.operation }} Canadian Lightsail test
    needs: [validate, build]
    if: >-
      always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      needs.validate.result == 'success' &&
      (needs.build.result == 'success' || (inputs.operation != 'run' && needs.build.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      OPERATION: ${{ inputs.operation }}
      TEST_ID: ${{ inputs.test_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.16'
      - run: python -m pip install --require-hashes -r scripts/rds_rehearsal/requirements.lock
      - uses: actions/download-artifact@v8
        if: inputs.operation == 'run'
        with:
          name: capacity-build
          path: capacity-build
      - name: Derive the account from the existing deployment role
        env:
          DEPLOY_ROLE: ${{ vars.AWS_ROLE_ARN }}
        run: |
          python - <<'PY'
          import os, re
          match = re.fullmatch(r'arn:aws:iam::([0-9]{12}):role/[A-Za-z0-9+=,.@_/-]+', os.environ['DEPLOY_ROLE'])
          assert match, 'Existing AWS_ROLE_ARN is required'
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('TEST_ACCOUNT_ID=' + match[1] + '\n')
          PY
      - name: Generate operation-specific session boundary
        id: policy
        run: python scripts/lightsail_test/policy.py
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ca-central-1
          role-duration-seconds: 3600
          inline-session-policy: ${{ steps.policy.outputs.json }}
      - name: Read prerequisites or execute the bounded laboratory
        run: python scripts/lightsail_stack_test/control.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lightsail-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: lightsail-results/
          if-no-files-found: warn
          retention-days: 7
