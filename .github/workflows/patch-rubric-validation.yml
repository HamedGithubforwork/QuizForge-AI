name: Fix rubric validation patch

on:
  push:
    branches:
      - validate-generated-rubrics

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validate-generated-rubrics

      - name: Fix backend syntax
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/main.py')
          text = path.read_text()
          old = 'issue_list = \\"\\n\\".join('
          new = 'issue_list = "\\n".join('
          if old not in text:
              raise SystemExit('syntax target not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/main.py
          git diff --cached --quiet && exit 0
          git commit -m "Fix rubric validation retry syntax"
          git push origin HEAD:validate-generated-rubrics
