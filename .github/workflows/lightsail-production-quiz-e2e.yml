name: Permanent Lightsail production quiz E2E

on:
  pull_request:
    paths:
      - ".github/workflows/lightsail-production-quiz-e2e.yml"
      - "e2e/production-canary-tests/**"
      - "e2e/playwright.production-canary.config.ts"
      - "scripts/production/lightsail/production_canary_identity.py"
      - "scripts/production/lightsail/test_production_canary_identity.py"
      - "scripts/production/private_files.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - name: Install locked controller dependencies
        run: python -m pip install --require-hashes -r scripts/production/requirements.lock
      - name: Validate production Cognito canary controller
        run: |
          python -m py_compile scripts/production/lightsail/production_canary_identity.py
          python -m unittest scripts.production.lightsail.test_production_canary_identity -v
      - name: Install browser-test dependencies
        run: npm ci --prefix e2e
      - name: Parse the production canary without executing it
        env:
          CANARY_FIXTURE_PATH: /tmp/nonexistent-production-canary-fixture.json
        run: >-
          npx --prefix e2e playwright test
          --config=e2e/playwright.production-canary.config.ts
          --list

  production-e2e:
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'HamedGithubforwork/QuizForge-AI' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: quizforge-permanent-production-paid-e2e
      cancel-in-progress: false
    env:
      CANARY_FRONTEND_URL: https://quizfromnotes.com
      CANARY_FIXTURE_PATH: /tmp/production-canary-identity.json
      AWS_EC2_METADATA_DISABLED: "true"
      LIGHTSAIL_ADMIN_IPV4_CIDR: ${{ secrets.LIGHTSAIL_ADMIN_IPV4_CIDR }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - name: Install locked controller dependencies
        run: python -m pip install --require-hashes -r scripts/production/requirements.lock
      - name: Install browser-test dependencies
        run: npm ci --prefix e2e
      - name: Install Chromium
        run: npx --prefix e2e playwright install --with-deps chromium
      - name: Assume production-canary identity boundary
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: qf-production-browser-canary
          role-duration-seconds: 900
          aws-region: ca-central-1
          mask-aws-account-id: true
          unset-current-credentials: true
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":[
              "cognito-idp:ListUserPools","cognito-idp:ListUserPoolClients","cognito-idp:DescribeUserPoolClient",
              "cognito-idp:CreateUserPoolClient","cognito-idp:DeleteUserPoolClient",
              "cognito-idp:AdminCreateUser","cognito-idp:AdminGetUser","cognito-idp:AdminSetUserPassword",
              "cognito-idp:AdminInitiateAuth","cognito-idp:AssociateSoftwareToken","cognito-idp:VerifySoftwareToken",
              "cognito-idp:AdminRespondToAuthChallenge","cognito-idp:AdminSetUserMFAPreference",
              "cognito-idp:GetUser","cognito-idp:AdminDeleteUser",
              "lightsail:GetInstance","lightsail:GetStaticIp","lightsail:GetInstancePortStates",
              "lightsail:OpenInstancePublicPorts","lightsail:CloseInstancePublicPorts","lightsail:GetInstanceAccessDetails"
            ],"Resource":"*"}]}
      - name: Prepare one synthetic production Cognito user with mandatory TOTP
        run: >-
          python -m scripts.production.lightsail.production_canary_identity
          prepare "$CANARY_FIXTURE_PATH"
      - name: Run one real production Cognito PDF-to-quiz browser canary
        run: >-
          npx --prefix e2e playwright test
          --config=e2e/playwright.production-canary.config.ts
      - name: Remove exact synthetic Cognito user and empty local identity
        if: always()
        run: >-
          python -m scripts.production.lightsail.production_canary_identity
          cleanup "$CANARY_FIXTURE_PATH"
