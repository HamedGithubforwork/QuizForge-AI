name: Permanent Lightsail inspection

on:
  pull_request:
    paths:
      - ".github/workflows/lightsail-production-inspect.yml"
      - "infra/aws/lightsail-production/**"
      - "scripts/lightsail_activation/**"
      - "scripts/production/lightsail/**"
      - "scripts/cognito_browser/identity_triggers.py"
      - "scripts/cognito_browser/pre_signup.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - name: Guarded reviewer tests
        run: python -m unittest discover -s scripts/lightsail_activation/tests -p 'test_*.py' -v
      - name: Check exact permanent-host source blobs
        run: python -m scripts.lightsail_activation.review check-source
      - name: Build deterministic Cognito recovery package
        run: python scripts/production/lightsail/package_recovery.py
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.7"
          terraform_wrapper: false
      - name: Validate permanent-host Terraform without AWS credentials
        env:
          TF_DATA_DIR: ${{ runner.temp }}/lightsail-production-validation
        run: |
          terraform -chdir=infra/aws/lightsail-production init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/aws/lightsail-production validate
          terraform -chdir=infra/aws/lightsail-production test

  inspect:
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'HamedGithubforwork/QuizForge-AI'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: quizforge-permanent-lightsail-inspection
      cancel-in-progress: false
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_WORKSPACE: default
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - name: Check exact permanent-host source blobs
        run: python -m scripts.lightsail_activation.review check-source
      - name: Build deterministic Cognito recovery package
        run: python scripts/production/lightsail/package_recovery.py
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.7"
          terraform_wrapper: false
      - name: Assume the existing deployment role for inspection only
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: qf-lightsail-inspect
          aws-region: ca-central-1
          mask-aws-account-id: true
          unset-current-credentials: true
      - name: Prepare private inputs and safe placeholder
        env:
          AWS_BUDGET_ALERT_EMAIL: ${{ secrets.AWS_BUDGET_ALERT_EMAIL }}
          LIGHTSAIL_SSH_PUBLIC_KEY: ${{ secrets.LIGHTSAIL_SSH_PUBLIC_KEY }}
          LIGHTSAIL_ADMIN_IPV4_CIDR: ${{ secrets.LIGHTSAIL_ADMIN_IPV4_CIDR }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          private = Path(os.environ["RUNNER_TEMP"]) / "lightsail.tfvars.json"
          private.write_text(json.dumps({
              "monthly_budget_usd": 20,
              "alert_email": os.environ["AWS_BUDGET_ALERT_EMAIL"],
              "ssh_public_key": os.environ["LIGHTSAIL_SSH_PUBLIC_KEY"],
              "admin_ipv4_cidr": os.environ["LIGHTSAIL_ADMIN_IPV4_CIDR"],
              "public_signup": False,
          }) + "\n")
          private.chmod(0o600)
          out = Path("lightsail-inspection-results")
          out.mkdir(exist_ok=True)
          (out / "summary.json").write_text(json.dumps({
              "schema": 1,
              "operation": "inspect",
              "result": "blocked_no_apply_attempted",
              "apply_attempted": False,
              "terraform_apply_completed": False,
              "error_code": "INSPECTION_DID_NOT_COMPLETE",
          }, indent=2, sort_keys=True) + "\n")
          PY
      - name: Initialize isolated permanent-host state
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_DATA_DIR: ${{ runner.temp }}/lightsail-production-live
        run: |
          terraform -chdir=infra/aws/lightsail-production init -reconfigure -input=false -lockfile=readonly             -backend-config="bucket=$TF_STATE_BUCKET"             -backend-config="key=quizforge/lightsail-production/terraform.tfstate"             -backend-config="region=ca-central-1"             -backend-config="encrypt=true"             -backend-config="use_lockfile=true"
      - name: Save a fresh plan without applying it
        env:
          TF_DATA_DIR: ${{ runner.temp }}/lightsail-production-live
        run: |
          set +e
          terraform -chdir=infra/aws/lightsail-production plan             -input=false -lock-timeout=60s             -var-file="$RUNNER_TEMP/lightsail.tfvars.json"             -out="$RUNNER_TEMP/lightsail-production.tfplan"             >"$RUNNER_TEMP/lightsail-plan.log" 2>&1
          status=$?
          set -e
          if [[ $status -ne 0 ]]; then
            python - <<'PY'
          import json
          from pathlib import Path
          p = Path("lightsail-inspection-results/summary.json")
          value = json.loads(p.read_text())
          value["error_code"] = "TERRAFORM_PLAN_FAILED"
          p.write_text(json.dumps(value, indent=2, sort_keys=True) + "\n")
          PY
            echo "Permanent Lightsail plan failed; raw provider diagnostics remain private." >&2
            exit "$status"
          fi
          terraform -chdir=infra/aws/lightsail-production show -json             "$RUNNER_TEMP/lightsail-production.tfplan" > "$RUNNER_TEMP/lightsail-production-plan.json"
      - name: Review the fresh initial plan
        env:
          QF_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          QF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          AWS_BUDGET_ALERT_EMAIL: ${{ secrets.AWS_BUDGET_ALERT_EMAIL }}
          LIGHTSAIL_SSH_PUBLIC_KEY: ${{ secrets.LIGHTSAIL_SSH_PUBLIC_KEY }}
          LIGHTSAIL_ADMIN_IPV4_CIDR: ${{ secrets.LIGHTSAIL_ADMIN_IPV4_CIDR }}
        run: python -m scripts.lightsail_activation.review "$RUNNER_TEMP/lightsail-production-plan.json"
      - name: Remove private plan material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/lightsail.tfvars.json"                 "$RUNNER_TEMP/lightsail-production.tfplan"                 "$RUNNER_TEMP/lightsail-production-plan.json"                 "$RUNNER_TEMP/lightsail-plan.log"                 infra/aws/lightsail-production/recovery.zip
      - name: Publish only the sanitized inspection summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: permanent-lightsail-inspection-summary
          path: lightsail-inspection-results/summary.json
          if-no-files-found: error
          retention-days: 30
