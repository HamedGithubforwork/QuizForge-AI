name: Diagnose GitHub OIDC claim shape

on:
  pull_request:
    paths:
      - ".github/workflows/oidc-claim-shape-diagnostic.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/oidc-claim-shape-diagnostic.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate diagnostic source
        run: python -m py_compile scripts/production/oidc_claim_shape_diagnostic.py

  diagnose:
    needs: validate
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'HamedGithubforwork/QuizForge-AI' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Inspect only allowlisted OIDC claim matches
        env:
          OIDC_AUDIENCE: quizfromnotes-cognito-password-export
        run: python scripts/production/oidc_claim_shape_diagnostic.py
      - name: Publish sanitized diagnostic
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: github-oidc-claim-shape
          path: oidc-claim-shape-results/summary.json
          if-no-files-found: error
          retention-days: 7
