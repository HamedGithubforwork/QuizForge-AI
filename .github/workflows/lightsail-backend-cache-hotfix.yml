name: Deploy cached-page reuse API hotfix

on:
  pull_request:
    paths:
      - ".github/workflows/lightsail-backend-cache-hotfix.yml"
      - "scripts/production/lightsail/backend_hotfix.py"
      - "scripts/production/lightsail/test_backend_hotfix.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/lightsail-backend-cache-hotfix.yml"
      - "scripts/production/lightsail/backend_hotfix.py"
      - "scripts/production/lightsail/test_backend_hotfix.py"

permissions:
  contents: read

env:
  AWS_REGION: ca-central-1
  ECR_REPOSITORY: quizforge-api
  APPLICATION_CANDIDATE_SHA: 32de72da4369a22c041199f4a9e4608f5321d7fe

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - name: Validate bounded hotfix controller
        run: |
          python -m py_compile scripts/production/lightsail/backend_hotfix.py
          python -m unittest scripts.production.lightsail.test_backend_hotfix -v
      - name: Verify exact tested application candidate exists
        uses: actions/checkout@v7
        with:
          ref: ${{ env.APPLICATION_CANDIDATE_SHA }}
          path: application-candidate
          persist-credentials: false
      - name: Require the tested cached-reuse correction
        run: |
          python - <<'PY'
          from pathlib import Path

          store = Path("application-candidate/backend/pdf_job_store.py").read_text()
          start = store.index("    def reuse_selection(")
          end = store.index("    def submit(", start)
          reuse = store[start:end]
          assert "consume the user's hourly document-processing allowance" in reuse
          assert "INSERT INTO admissions" not in reuse

          tests = Path("application-candidate/backend/tests/test_pdf_page_reuse.py").read_text()
          assert "test_cached_reselection_does_not_consume_hourly_document_allowance" in tests
          PY

  deploy:
    needs: validate
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'HamedGithubforwork/QuizForge-AI' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: quizforge-production-cached-page-api-hotfix
      cancel-in-progress: false
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      LIGHTSAIL_ADMIN_IPV4_CIDR: ${{ secrets.LIGHTSAIL_ADMIN_IPV4_CIDR }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.APPLICATION_CANDIDATE_SHA }}
          path: application-candidate
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"

      - name: Install locked AWS SDK dependencies
        run: python -m pip install --require-hashes -r scripts/rds_rehearsal/requirements.lock

      - name: Assume backend-hotfix-only cloud boundary
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: qf-cached-page-api-hotfix
          role-duration-seconds: 1800
          aws-region: ca-central-1
          mask-aws-account-id: true
          unset-current-credentials: true
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":[
              "sts:GetCallerIdentity",
              "ecr:GetAuthorizationToken","ecr:DescribeRepositories","ecr:DescribeImages",
              "ecr:BatchCheckLayerAvailability","ecr:GetDownloadUrlForLayer","ecr:BatchGetImage",
              "ecr:InitiateLayerUpload","ecr:UploadLayerPart","ecr:CompleteLayerUpload","ecr:PutImage",
              "lightsail:GetInstance","lightsail:GetStaticIp","lightsail:GetInstancePortStates",
              "lightsail:OpenInstancePublicPorts","lightsail:CloseInstancePublicPorts",
              "lightsail:GetInstanceAccessDetails"
            ],"Resource":"*"}]}

      - name: Require existing ECR repository
        run: aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: true

      - name: Build or reuse immutable hotfix API image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          tag="lightsail-api-cache-reuse-${APPLICATION_CANDIDATE_SHA}"
          digest="$(aws ecr describe-images             --repository-name "$ECR_REPOSITORY"             --image-ids "imageTag=$tag"             --query 'imageDetails[0].imageDigest'             --output text 2>/dev/null || true)"
          if [ -z "$digest" ] || [ "$digest" = "None" ]; then
            image="$ECR_REGISTRY/$ECR_REPOSITORY:$tag"
            docker build --tag "$image" application-candidate/backend
            docker push "$image" >/dev/null
            digest="$(aws ecr describe-images               --repository-name "$ECR_REPOSITORY"               --image-ids "imageTag=$tag"               --query 'imageDetails[0].imageDigest'               --output text)"
          fi
          echo "$digest" | grep -Eq '^sha256:[a-f0-9]{64}$'
          old_digest="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path("scripts/production/lightsail/release-lock.json").read_text())["image_digests"]["api"])
          PY
          )"
          echo "$old_digest" | grep -Eq '^sha256:[a-f0-9]{64}$'
          test "$old_digest" != "$digest"
          {
            echo "QF_OLD_IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY@$old_digest"
            echo "QF_NEW_IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY@$digest"
          } >> "$GITHUB_ENV"

      - name: Atomically replace only the live API image and verify cached reuse
        run: >-
          python -m scripts.production.lightsail.backend_hotfix
          "$QF_OLD_IMAGE"
          "$QF_NEW_IMAGE"
          scripts/production/lightsail/ssh-host-pins.json

      - name: Publish only sanitized hotfix result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: permanent-cached-page-api-hotfix
          path: lightsail-backend-hotfix-results/summary.json
          if-no-files-found: error
          retention-days: 30
