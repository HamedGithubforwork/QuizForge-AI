name: Permanent Lightsail public DNS cutover and launch

on:
  pull_request:
    paths:
      - ".github/workflows/lightsail-public-launch.yml"
      - "scripts/production/lightsail/public_launch.py"
      - "scripts/production/lightsail/test_public_launch.py"
      - "scripts/production/lightsail/release-lock.json"
      - "scripts/production/lightsail/ssh-host-pins.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/lightsail-public-launch.yml"
      - "scripts/production/lightsail/public_launch.py"
      - "scripts/production/lightsail/test_public_launch.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - name: Compile and test guarded public launch
        run: |
          python -m py_compile scripts/production/lightsail/public_launch.py
          python -m unittest scripts.production.lightsail.test_public_launch -v
      - name: Require exact reviewed AI-disabled release
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          lock=json.loads(Path("scripts/production/lightsail/release-lock.json").read_text())
          assert lock["schema"]==1
          assert lock["public_configuration_validated"] is True
          assert lock["ai_enabled"] is False
          assert re.fullmatch(r"[0-9a-f]{40}",lock["release_sha"])
          PY

  launch:
    needs: validate
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'HamedGithubforwork/QuizForge-AI'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: quizforge-permanent-lightsail-public-launch
      cancel-in-progress: false
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      LIGHTSAIL_ADMIN_IPV4_CIDR: ${{ secrets.LIGHTSAIL_ADMIN_IPV4_CIDR }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - name: Install existing hash-locked AWS SDK dependencies
        run: python -m pip install --require-hashes -r scripts/rds_rehearsal/requirements.lock
      - name: Assume deployment role with cutover-and-launch-only boundary
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: qf-lightsail-public-launch
          role-duration-seconds: 1800
          aws-region: ca-central-1
          mask-aws-account-id: true
          unset-current-credentials: true
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[
              {"Effect":"Allow","Action":[
                "lightsail:GetInstance",
                "lightsail:GetStaticIp",
                "lightsail:GetInstancePortStates",
                "lightsail:OpenInstancePublicPorts",
                "lightsail:CloseInstancePublicPorts",
                "lightsail:GetInstanceAccessDetails",
                "route53:ListHostedZonesByName",
                "route53:GetHostedZone",
                "route53:ListResourceRecordSets",
                "route53:ChangeResourceRecordSets",
                "route53:GetChange"
              ],"Resource":"*"}
            ]}
      - name: Cut over DNS, wait recursive propagation, preflight services, verify HTTPS, and persist launch
        run: python -m scripts.production.lightsail.public_launch
      - name: Publish only sanitized launch result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: permanent-lightsail-public-launch
          path: lightsail-public-launch-results/summary.json
          if-no-files-found: error
          retention-days: 30
