name: Permanent Lightsail three-resource repair activation

on:
  pull_request:
    paths:
      - ".github/workflows/lightsail-production-repair-activation.yml"
      - "scripts/lightsail_activation/repair_gate.py"
      - "scripts/lightsail_activation/repair_review.py"
      - "scripts/lightsail_activation/tests/test_repair_gate.py"
      - "scripts/lightsail_activation/tests/test_repair_review.py"
      - "infra/aws/lightsail-production/**"
      - "scripts/production/lightsail/**"
      - "scripts/cognito_browser/identity_triggers.py"
      - "scripts/cognito_browser/pre_signup.py"
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type ACTIVATE EXACT THREE-RESOURCE LIGHTSAIL REPAIR
        type: string
        required: true
        default: ''

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - name: Credential-free repair activation tests
        run: |
          python -m unittest discover -s scripts/lightsail_activation/tests -p 'test_repair_gate.py' -v
          python -m unittest discover -s scripts/lightsail_activation/tests -p 'test_repair_review.py' -v
      - name: Check exact permanent-host source blobs
        run: python -m scripts.lightsail_activation.review check-source
      - name: Build deterministic Cognito recovery package
        run: python scripts/production/lightsail/package_recovery.py
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.7"
          terraform_wrapper: false
      - name: Validate permanent-host Terraform without AWS credentials
        env:
          TF_DATA_DIR: ${{ runner.temp }}/lightsail-repair-activation-validation
        run: |
          terraform -chdir=infra/aws/lightsail-production init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/aws/lightsail-production validate
          terraform -chdir=infra/aws/lightsail-production test

  activate:
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'HamedGithubforwork/QuizForge-AI'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: quizforge-permanent-lightsail-isolated-state
      cancel-in-progress: false
    env:
      TF_WORKSPACE: default
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.7"
          terraform_wrapper: false

      - name: Validate exact manual repair authorization before any cloud request
        env:
          QF_REPAIR_CONFIRMATION: ${{ github.event.inputs.confirmation }}
          QF_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          QF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          AWS_BUDGET_ALERT_EMAIL: ${{ secrets.AWS_BUDGET_ALERT_EMAIL }}
          LIGHTSAIL_SSH_PUBLIC_KEY: ${{ secrets.LIGHTSAIL_SSH_PUBLIC_KEY }}
          LIGHTSAIL_ADMIN_IPV4_CIDR: ${{ secrets.LIGHTSAIL_ADMIN_IPV4_CIDR }}
        run: python -m scripts.lightsail_activation.repair_gate preflight

      - name: Install existing hash-locked AWS SDK dependencies
        run: python -m pip install --require-hashes -r scripts/rds_rehearsal/requirements.lock

      - name: Build deterministic Cognito recovery package
        run: python scripts/production/lightsail/package_recovery.py

      - name: Prepare private Terraform variables
        env:
          AWS_BUDGET_ALERT_EMAIL: ${{ secrets.AWS_BUDGET_ALERT_EMAIL }}
          LIGHTSAIL_SSH_PUBLIC_KEY: ${{ secrets.LIGHTSAIL_SSH_PUBLIC_KEY }}
          LIGHTSAIL_ADMIN_IPV4_CIDR: ${{ secrets.LIGHTSAIL_ADMIN_IPV4_CIDR }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "lightsail-repair-activation.tfvars.json"
          path.write_text(json.dumps({
              "alert_email": os.environ["AWS_BUDGET_ALERT_EMAIL"],
              "ssh_public_key": os.environ["LIGHTSAIL_SSH_PUBLIC_KEY"],
              "admin_ipv4_cidr": os.environ["LIGHTSAIL_ADMIN_IPV4_CIDR"],
              "public_signup": False,
          }) + "\n")
          path.chmod(0o600)
          PY

      - name: Assume existing deployment role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: qf-lightsail-three-resource-repair
          role-duration-seconds: 2100
          aws-region: ca-central-1
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Verify current catalog and separately managed USD20 budget
        env:
          QF_REPAIR_CONFIRMATION: ${{ github.event.inputs.confirmation }}
          QF_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          QF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          AWS_BUDGET_ALERT_EMAIL: ${{ secrets.AWS_BUDGET_ALERT_EMAIL }}
          LIGHTSAIL_SSH_PUBLIC_KEY: ${{ secrets.LIGHTSAIL_SSH_PUBLIC_KEY }}
          LIGHTSAIL_ADMIN_IPV4_CIDR: ${{ secrets.LIGHTSAIL_ADMIN_IPV4_CIDR }}
        run: python -m scripts.lightsail_activation.repair_gate catalog

      - name: Initialize only the permanent Lightsail state
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_DATA_DIR: ${{ runner.temp }}/lightsail-repair-activation-live
        run: |
          terraform -chdir=infra/aws/lightsail-production init \
            -reconfigure -input=false -lockfile=readonly \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=quizforge/lightsail-production/terraform.tfstate" \
            -backend-config="region=ca-central-1" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Create and revalidate one exact three-resource repair plan
        env:
          TF_DATA_DIR: ${{ runner.temp }}/lightsail-repair-activation-live
          QF_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          QF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          AWS_BUDGET_ALERT_EMAIL: ${{ secrets.AWS_BUDGET_ALERT_EMAIL }}
          LIGHTSAIL_SSH_PUBLIC_KEY: ${{ secrets.LIGHTSAIL_SSH_PUBLIC_KEY }}
          LIGHTSAIL_ADMIN_IPV4_CIDR: ${{ secrets.LIGHTSAIL_ADMIN_IPV4_CIDR }}
        run: |
          set +e
          terraform -chdir=infra/aws/lightsail-production plan \
            -input=false -refresh=true -lock=true -lock-timeout=60s -detailed-exitcode \
            -var-file="$RUNNER_TEMP/lightsail-repair-activation.tfvars.json" \
            -out="$RUNNER_TEMP/lightsail-repair-activation.tfplan" \
            >"$RUNNER_TEMP/lightsail-repair-activation-plan.log" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then
            python -m scripts.lightsail_activation.repair_gate failure REPAIR_PLAN_NOT_EXACTLY_THREE_CREATES
            exit 1
          fi

          terraform -chdir=infra/aws/lightsail-production show -json \
            "$RUNNER_TEMP/lightsail-repair-activation.tfplan" \
            >"$RUNNER_TEMP/lightsail-repair-activation-plan.json"

          python -m scripts.lightsail_activation.repair_gate review-plan \
            "$RUNNER_TEMP/lightsail-repair-activation-plan.json" \
            "lightsail-repair-activation-results/catalog.json" \
            "$RUNNER_TEMP/lightsail-repair-activation.tfplan"

          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          plan = root / "lightsail-repair-activation.tfplan"
          digest = hashlib.sha256(plan.read_bytes()).hexdigest()
          path = root / "lightsail-repair-activation.plan.sha256"
          path.write_text(digest + "\n")
          path.chmod(0o600)
          PY

          python -m scripts.lightsail_activation.review check-source

          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          plan = root / "lightsail-repair-activation.tfplan"
          expected = (root / "lightsail-repair-activation.plan.sha256").read_text().strip()
          if hashlib.sha256(plan.read_bytes()).hexdigest() != expected:
              raise SystemExit("Saved repair plan changed")
          PY

      - name: Apply that exact saved repair plan once
        env:
          TF_DATA_DIR: ${{ runner.temp }}/lightsail-repair-activation-live
          QF_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          QF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          AWS_BUDGET_ALERT_EMAIL: ${{ secrets.AWS_BUDGET_ALERT_EMAIL }}
          LIGHTSAIL_SSH_PUBLIC_KEY: ${{ secrets.LIGHTSAIL_SSH_PUBLIC_KEY }}
          LIGHTSAIL_ADMIN_IPV4_CIDR: ${{ secrets.LIGHTSAIL_ADMIN_IPV4_CIDR }}
        run: |
          chmod 0400 "$RUNNER_TEMP/lightsail-repair-activation.tfplan"
          python -m scripts.lightsail_activation.repair_gate mark apply-started

          terraform -chdir=infra/aws/lightsail-production apply \
            -input=false -lock=true -lock-timeout=60s \
            "$RUNNER_TEMP/lightsail-repair-activation.tfplan" \
            >"$RUNNER_TEMP/lightsail-repair-activation-apply.log" 2>&1

          python -m scripts.lightsail_activation.repair_gate mark apply-complete

      - name: Require exact final state and a no-change live plan
        env:
          TF_DATA_DIR: ${{ runner.temp }}/lightsail-repair-activation-live
          QF_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          QF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          AWS_BUDGET_ALERT_EMAIL: ${{ secrets.AWS_BUDGET_ALERT_EMAIL }}
          LIGHTSAIL_SSH_PUBLIC_KEY: ${{ secrets.LIGHTSAIL_SSH_PUBLIC_KEY }}
          LIGHTSAIL_ADMIN_IPV4_CIDR: ${{ secrets.LIGHTSAIL_ADMIN_IPV4_CIDR }}
        run: |
          terraform -chdir=infra/aws/lightsail-production state list \
            >"$RUNNER_TEMP/lightsail-repair-final-state-list.txt"
          python -m scripts.lightsail_activation.repair_gate verify-state \
            "$RUNNER_TEMP/lightsail-repair-final-state-list.txt"

          set +e
          terraform -chdir=infra/aws/lightsail-production plan \
            -input=false -refresh=true -lock=false -detailed-exitcode \
            -var-file="$RUNNER_TEMP/lightsail-repair-activation.tfvars.json" \
            -out="$RUNNER_TEMP/lightsail-repair-final.tfplan" \
            >"$RUNNER_TEMP/lightsail-repair-final-plan.log" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            python -m scripts.lightsail_activation.repair_gate failure FINAL_PLAN_HAS_CONFIGURATION_CHANGES
            exit 1
          fi

          terraform -chdir=infra/aws/lightsail-production show -json \
            "$RUNNER_TEMP/lightsail-repair-final.tfplan" \
            >"$RUNNER_TEMP/lightsail-repair-final-plan.json"

          python -m scripts.lightsail_activation.repair_gate verify-final-plan \
            "$RUNNER_TEMP/lightsail-repair-final-plan.json" \
            "lightsail-repair-activation-results/catalog.json"

      - name: Record safe failure state
        if: failure()
        env:
          QF_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          QF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          AWS_BUDGET_ALERT_EMAIL: ${{ secrets.AWS_BUDGET_ALERT_EMAIL }}
          LIGHTSAIL_SSH_PUBLIC_KEY: ${{ secrets.LIGHTSAIL_SSH_PUBLIC_KEY }}
          LIGHTSAIL_ADMIN_IPV4_CIDR: ${{ secrets.LIGHTSAIL_ADMIN_IPV4_CIDR }}
        run: python -m scripts.lightsail_activation.repair_gate failure WORKFLOW_STAGE_FAILED || true

      - name: Remove private plans, variables, state diagnostics, and provider logs
        if: always()
        run: |
          rm -f \
            "$RUNNER_TEMP/lightsail-repair-activation.tfvars.json" \
            "$RUNNER_TEMP/lightsail-repair-activation.tfplan" \
            "$RUNNER_TEMP/lightsail-repair-activation-plan.json" \
            "$RUNNER_TEMP/lightsail-repair-activation.plan.sha256" \
            "$RUNNER_TEMP/lightsail-repair-activation-plan.log" \
            "$RUNNER_TEMP/lightsail-repair-activation-apply.log" \
            "$RUNNER_TEMP/lightsail-repair-final-state-list.txt" \
            "$RUNNER_TEMP/lightsail-repair-final.tfplan" \
            "$RUNNER_TEMP/lightsail-repair-final-plan.json" \
            "$RUNNER_TEMP/lightsail-repair-final-plan.log" \
            lightsail-repair-activation-results/catalog.json \
            infra/aws/lightsail-production/recovery.zip

      - name: Publish only the sanitized repair activation summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: permanent-lightsail-three-resource-repair-activation-summary
          path: lightsail-repair-activation-results/summary.json
          if-no-files-found: error
          retention-days: 30
