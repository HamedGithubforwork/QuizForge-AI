name: Local runtime session validation
on:
  pull_request:
    paths: ['desktop/src/local-runtime*', 'desktop/src/windows-process-guard.cjs', 'desktop/test/local-runtime*', 'desktop/test/windows-process-guard.test.cjs', 'desktop/scripts/verify-local-runtime.cjs', 'desktop/scripts/parent-death-worker.cjs', 'desktop/scripts/verify-parent-death.cjs', '.github/workflows/local-runtime-validation.yml']
permissions:
  contents: read
jobs:
  windows-runtime:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Download and verify pinned evaluation inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          curl.exe -fL --max-time 180 -o "$env:RUNNER_TEMP/runtime.zip" 'https://github.com/ggml-org/llama.cpp/releases/download/b11317/llama-b11317-bin-win-cpu-x64.zip'
          if ($LASTEXITCODE -ne 0) { throw 'Runtime download failed' }
          if ((Get-FileHash "$env:RUNNER_TEMP/runtime.zip" -Algorithm SHA256).Hash.ToLower() -ne 'f3b2175f0fc3a7fb1bf53b1eddfeb6fd7a6c34761fec41cb293f6d70ba16288c') { throw 'Runtime checksum mismatch' }
          Expand-Archive "$env:RUNNER_TEMP/runtime.zip" "$env:RUNNER_TEMP/llama"
          curl.exe -fL --max-time 300 -o "$env:RUNNER_TEMP/model.gguf" 'https://huggingface.co/Qwen/Qwen3-4B-GGUF/resolve/bc640142c66e1fdd12af0bd68f40445458f3869b/Qwen3-4B-Q4_K_M.gguf'
          if ($LASTEXITCODE -ne 0) { throw 'Model download failed' }
          if ((Get-FileHash "$env:RUNNER_TEMP/model.gguf" -Algorithm SHA256).Hash.ToLower() -ne '7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5') { throw 'Model checksum mismatch' }
      - name: Verify real authenticated runtime lifecycle
        shell: pwsh
        run: |
          New-Item -ItemType Directory "$env:RUNNER_TEMP/models"
          Move-Item "$env:RUNNER_TEMP/model.gguf" "$env:RUNNER_TEMP/models/7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5.gguf"
          node --test desktop/test/local-runtime.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node desktop/scripts/verify-local-runtime.cjs "$env:RUNNER_TEMP/llama" "$env:RUNNER_TEMP/models"
          exit $LASTEXITCODE
