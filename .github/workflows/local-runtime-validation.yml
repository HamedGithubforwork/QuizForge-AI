name: Local runtime session validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-runtime:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Download and verify pinned evaluation inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          curl.exe -fL --max-time 180 -o "$env:RUNNER_TEMP/runtime.zip" 'https://github.com/ggml-org/llama.cpp/releases/download/b11317/llama-b11317-bin-win-vulkan-x64.zip'
          if ($LASTEXITCODE -ne 0) { throw 'Runtime download failed' }
          if ((Get-FileHash "$env:RUNNER_TEMP/runtime.zip" -Algorithm SHA256).Hash.ToLower() -ne 'b0cb46635aa4a028c272b74dc1966178b57157b4be199985e4d5e62cc6664338') { throw 'Runtime checksum mismatch' }
          Expand-Archive "$env:RUNNER_TEMP/runtime.zip" "$env:RUNNER_TEMP/runtime-full"
          New-Item -ItemType Directory "$env:RUNNER_TEMP/llama"
          node desktop/scripts/stage-local-runtime.cjs "$env:RUNNER_TEMP/runtime-full" "$env:RUNNER_TEMP/llama"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify real authenticated runtime lifecycle
        shell: pwsh
        run: |
          New-Item -ItemType Directory "$env:RUNNER_TEMP/models"
          node desktop/scripts/download-verified-model.cjs "$env:RUNNER_TEMP/models"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test desktop/test/runtime-staging.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test desktop/test/local-runtime.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node desktop/scripts/verify-parent-death.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node desktop/scripts/verify-local-runtime.cjs "$env:RUNNER_TEMP/llama" "$env:RUNNER_TEMP/models"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node desktop/scripts/verify-local-quiz-service.cjs "$env:RUNNER_TEMP/llama" "$env:RUNNER_TEMP/models"
          exit $LASTEXITCODE
