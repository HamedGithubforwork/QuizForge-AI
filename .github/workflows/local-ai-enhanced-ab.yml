name: Local AI enhanced-tier A/B

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-ai-enhanced-ab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-enhanced-ab:
    name: Windows Qwen3 4B vs 8B Q4_K_M
    runs-on: windows-2025
    timeout-minutes: 240

    env:
      RUNTIME_SHA256: f3b2175f0fc3a7fb1bf53b1eddfeb6fd7a6c34761fec41cb293f6d70ba16288c

    steps:
      - name: Check out QuizForge
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate frozen evaluation contract
        run: python -m unittest discover -s desktop/benchmarks -p 'test_*.py'

      - name: Download verified llama.cpp runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          curl.exe -fL --max-time 300 -o "$env:RUNNER_TEMP/runtime.zip" 'https://github.com/ggml-org/llama.cpp/releases/download/b11317/llama-b11317-bin-win-cpu-x64.zip'
          if ($LASTEXITCODE -ne 0) { throw 'Runtime download failed' }
          $digest = (Get-FileHash "$env:RUNNER_TEMP/runtime.zip" -Algorithm SHA256).Hash.ToLower()
          if ($digest -ne $env:RUNTIME_SHA256) { throw 'Runtime checksum mismatch' }
          Expand-Archive "$env:RUNNER_TEMP/runtime.zip" "$env:RUNNER_TEMP/runtime"
          $server = @(Get-ChildItem "$env:RUNNER_TEMP/runtime" -Recurse -Filter llama-server.exe)
          if ($server.Count -ne 1) { throw 'Expected exactly one llama-server.exe' }
          "LLAMA_SERVER=$($server[0].FullName)" >> $env:GITHUB_ENV

      - name: Same-run Qwen3 4B versus 8B evaluation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory "$env:RUNNER_TEMP/evidence" | Out-Null
          $failed = $false
          foreach ($candidate in @('qwen3-4b','qwen3-8b')) {
            python desktop/benchmarks/tournament/prepare.py --candidate $candidate --directory "$env:RUNNER_TEMP/models"
            if ($LASTEXITCODE -ne 0) {
              @{candidate=$candidate; status='preparation_failed'; inference_tested=$false} | ConvertTo-Json | Set-Content "$env:RUNNER_TEMP/evidence/$candidate-preparation-failure.json"
              $failed = $true
            } else {
              $meta = Get-Content "$env:RUNNER_TEMP/models/$candidate/provenance.json" | ConvertFrom-Json
              Copy-Item "$env:RUNNER_TEMP/models/$candidate/provenance.json" "$env:RUNNER_TEMP/evidence/$candidate-provenance.json"
              python desktop/benchmarks/tournament/run.py --candidate $candidate --runtime "$env:LLAMA_SERVER" --model-file "$env:RUNNER_TEMP/models/$candidate/model.gguf" --model-sha256 $meta.sha256 --runtime-sha256 $env:RUNTIME_SHA256 --output "$env:RUNNER_TEMP/evidence/$candidate-report.json"
              if ($LASTEXITCODE -ne 0) { $failed = $true }
            }
            if (Test-Path "$env:RUNNER_TEMP/models/$candidate") {
              Remove-Item -Recurse -Force "$env:RUNNER_TEMP/models/$candidate"
            }
          }
          if ($failed) { throw 'At least one candidate had an infrastructure failure; inspect preserved evidence' }

      - name: Upload enhanced-tier evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: local-ai-enhanced-ab-windows
          path: ${{ runner.temp }}/evidence/*.json
          if-no-files-found: warn
          retention-days: 30
