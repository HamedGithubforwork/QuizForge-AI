name: Permanent Lightsail deep repair diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/lightsail-repair-deep-diagnostic.yml"
      - "scripts/lightsail_activation/deep_diagnose.py"
      - "scripts/lightsail_activation/repair_review.py"
      - "scripts/lightsail_activation/tests/test_deep_diagnose.py"
      - "scripts/lightsail_activation/tests/test_repair_review.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/lightsail-repair-deep-diagnostic.yml"
      - "scripts/lightsail_activation/deep_diagnose.py"
      - "scripts/lightsail_activation/repair_review.py"
      - "scripts/lightsail_activation/tests/test_repair_review.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - name: Credential-free deep diagnostic tests
        run: python -m unittest discover -s scripts/lightsail_activation/tests -p 'test_deep_diagnose.py' -v
      - name: Existing repair reviewer tests
        run: python -m unittest discover -s scripts/lightsail_activation/tests -p 'test_repair_review.py' -v
      - name: Compile diagnostic
        run: python -m py_compile scripts/lightsail_activation/deep_diagnose.py

  diagnose:
    needs: validate
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'HamedGithubforwork/QuizForge-AI'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: quizforge-permanent-lightsail-deep-diagnostic
      cancel-in-progress: false
    env:
      TF_WORKSPACE: default
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"

      - name: Install existing hash-locked AWS SDK dependencies
        run: python -m pip install --require-hashes -r scripts/rds_rehearsal/requirements.lock

      - name: Build deterministic Cognito recovery package
        run: python scripts/production/lightsail/package_recovery.py

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.7"
          terraform_wrapper: false

      - name: Assume deployment role with AWS ReadOnlyAccess session boundary
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: qf-lightsail-deep-diagnostic
          role-duration-seconds: 1200
          aws-region: ca-central-1
          mask-aws-account-id: true
          unset-current-credentials: true
          managed-session-policies: arn:aws:iam::aws:policy/ReadOnlyAccess

      - name: Prepare private Terraform variables
        env:
          AWS_BUDGET_ALERT_EMAIL: ${{ secrets.AWS_BUDGET_ALERT_EMAIL }}
          LIGHTSAIL_SSH_PUBLIC_KEY: ${{ secrets.LIGHTSAIL_SSH_PUBLIC_KEY }}
          LIGHTSAIL_ADMIN_IPV4_CIDR: ${{ secrets.LIGHTSAIL_ADMIN_IPV4_CIDR }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "lightsail-deep.tfvars.json"
          path.write_text(json.dumps({
              "alert_email": os.environ["AWS_BUDGET_ALERT_EMAIL"],
              "ssh_public_key": os.environ["LIGHTSAIL_SSH_PUBLIC_KEY"],
              "admin_ipv4_cidr": os.environ["LIGHTSAIL_ADMIN_IPV4_CIDR"],
              "public_signup": False,
          }) + "\n")
          path.chmod(0o600)
          PY

      - name: Initialize only the permanent Lightsail state
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_DATA_DIR: ${{ runner.temp }}/lightsail-deep-live
        run: |
          terraform -chdir=infra/aws/lightsail-production init \
            -reconfigure -input=false -lockfile=readonly \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=quizforge/lightsail-production/terraform.tfstate" \
            -backend-config="region=ca-central-1" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Save fresh read-only diagnostic plan
        env:
          TF_DATA_DIR: ${{ runner.temp }}/lightsail-deep-live
        run: |
          set +e
          terraform -chdir=infra/aws/lightsail-production plan \
            -input=false -refresh=true -lock=false -detailed-exitcode \
            -var-file="$RUNNER_TEMP/lightsail-deep.tfvars.json" \
            -out="$RUNNER_TEMP/lightsail-deep.tfplan" \
            >"$RUNNER_TEMP/lightsail-deep-plan.log" 2>&1
          status=$?
          set -e
          if [ "$status" -eq 1 ]; then
            mkdir -p lightsail-deep-diagnostic
            cat > lightsail-deep-diagnostic/summary.json <<'JSON'
          {
            "schema": 1,
            "operation": "lightsail_repair_deep_diagnostic",
            "result": "terraform_plan_failed_no_apply",
            "apply_attempted": false,
            "terraform_apply_completed": false
          }
          JSON
            echo "Terraform diagnostic plan failed; raw diagnostics remain private." >&2
            exit 1
          fi
          terraform -chdir=infra/aws/lightsail-production show -json \
            "$RUNNER_TEMP/lightsail-deep.tfplan" \
            >"$RUNNER_TEMP/lightsail-deep-plan.json"

      - name: Analyze complete repair plan safely
        env:
          QF_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          QF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          AWS_BUDGET_ALERT_EMAIL: ${{ secrets.AWS_BUDGET_ALERT_EMAIL }}
          LIGHTSAIL_SSH_PUBLIC_KEY: ${{ secrets.LIGHTSAIL_SSH_PUBLIC_KEY }}
          LIGHTSAIL_ADMIN_IPV4_CIDR: ${{ secrets.LIGHTSAIL_ADMIN_IPV4_CIDR }}
        run: python -m scripts.lightsail_activation.deep_diagnose "$RUNNER_TEMP/lightsail-deep-plan.json"

      - name: Remove all private plan material
        if: always()
        run: |
          rm -f \
            "$RUNNER_TEMP/lightsail-deep.tfvars.json" \
            "$RUNNER_TEMP/lightsail-deep.tfplan" \
            "$RUNNER_TEMP/lightsail-deep-plan.json" \
            "$RUNNER_TEMP/lightsail-deep-plan.log" \
            infra/aws/lightsail-production/recovery.zip

      - name: Publish only sanitized deep diagnostic
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: permanent-lightsail-deep-diagnostic
          path: lightsail-deep-diagnostic/summary.json
          if-no-files-found: error
          retention-days: 7
