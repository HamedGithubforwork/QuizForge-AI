name: Regenerate Stryker dependencies

on:
  push:
    branches:
      - chore/add-stryker-mutation-testing
    paths:
      - .github/workflows/stryker-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: chore/add-stryker-mutation-testing

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Remove unused TAP runner and regenerate lockfile
        working-directory: frontend
        run: |
          npm ci
          npm uninstall --save-dev @stryker-mutator/tap-runner

      - name: Commit regenerated dependency files
        run: |
          if git diff --quiet -- frontend/package.json frontend/package-lock.json; then
            echo "Dependency files already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          git commit -m "Remove unused Stryker TAP runner"
          git push origin HEAD:chore/add-stryker-mutation-testing
