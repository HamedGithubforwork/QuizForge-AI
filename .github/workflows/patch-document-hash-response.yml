name: Patch PDF hash response

on:
  push:
    branches:
      - stable-document-history

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stable-document-history
      - name: Add PDF SHA-256 to upload response
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/main.py')
          text = path.read_text()

          old = 'import json\n'
          new = 'import hashlib\nimport json\n'
          if old not in text:
              raise SystemExit('import anchor not found')
          text = text.replace(old, new, 1)

          old = '    return {\n        "filename": file.filename,\n'
          new = (
              '    return {\n'
              '        "filename": file.filename,\n'
              '        "pdf_sha256": hashlib.sha256(\n'
              '            contents\n'
              '        ).hexdigest(),\n'
          )
          if old not in text:
              raise SystemExit('upload response anchor not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/main.py
          git diff --cached --quiet && exit 0
          git commit -m "Return stable PDF SHA-256 from upload API"
          git push origin HEAD:stable-document-history
