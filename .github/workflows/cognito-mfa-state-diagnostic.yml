name: Diagnose migrated Cognito MFA state

on:
  pull_request:
    paths:
      - ".github/workflows/cognito-mfa-state-diagnostic.yml"
      - "scripts/production/cognito_mfa_state_diagnostic.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/cognito-mfa-state-diagnostic.yml"
      - "scripts/production/cognito_mfa_state_diagnostic.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - name: Validate diagnostic
        run: python -m py_compile scripts/production/cognito_mfa_state_diagnostic.py

  inspect:
    needs: validate
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'HamedGithubforwork/QuizForge-AI' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - name: Install locked AWS SDK dependencies
        run: python -m pip install --require-hashes -r scripts/rds_rehearsal/requirements.lock
      - name: Assume read-only Cognito diagnostic session
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: qf-cognito-mfa-state
          role-duration-seconds: 600
          aws-region: ca-central-1
          mask-aws-account-id: true
          unset-current-credentials: true
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":[
              "cognito-idp:ListUserPools","cognito-idp:ListUsers","cognito-idp:AdminGetUser"
            ],"Resource":"*"}]}
      - name: Inspect only aggregate MFA state
        run: python scripts/production/cognito_mfa_state_diagnostic.py
      - name: Publish sanitized diagnostic
        uses: actions/upload-artifact@v7
        with:
          name: cognito-mfa-state-diagnostic
          path: cognito-mfa-state-results/summary.json
          if-no-files-found: error
          retention-days: 7
