name: Mutation testing

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-mutation:
    name: Frontend StrykerJS
    # The full 1,500+ mutant suite is reserved for explicit milestone reviews.
    # Add or reapply the `major-milestone` PR label after the milestone changes
    # are ready. Later pushes do not rerun this suite; manual dispatch remains
    # available for a new milestone review.
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'major-milestone') }}
    runs-on: ubuntu-24.04
    # The full suite is now near the previous 45-minute ceiling; keep a bounded
    # margin so added protected modules can finish instead of being cancelled.
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run StrykerJS mutation testing
        working-directory: frontend
        run: npm run test:mutation

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stryker-mutation-report
          path: |
            frontend/reports/mutation.html
            frontend/reports/mutation.json
          if-no-files-found: warn
          retention-days: 14
