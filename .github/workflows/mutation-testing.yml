name: Mutation testing

on:
  workflow_dispatch:
  schedule:
    - cron: "17 13 * * 0"
  pull_request:
    paths:
      - frontend/stryker.config.json
      - frontend/package.json
      - frontend/package-lock.json
      - frontend/src/lib/answerFallback.ts
      - frontend/src/lib/answerFallback.test.ts
      - frontend/src/lib/adPresentationPolicy.ts
      - frontend/src/lib/adPresentationPolicy.test.ts
      - frontend/src/lib/accountEntitlements.ts
      - frontend/src/lib/accountEntitlements.test.ts
      - frontend/src/lib/documentIdentity.ts
      - frontend/src/lib/documentIdentity.test.ts
      - frontend/src/lib/historyQuestionGrader.ts
      - frontend/src/lib/historyQuestionGrader.test.ts
      - frontend/src/lib/masteryAnalytics.ts
      - frontend/src/lib/masteryAnalytics.test.ts
      - frontend/src/lib/numericUnits.ts
      - frontend/src/lib/numericUnitGrading.test.ts
      - frontend/src/lib/quizAttempt.ts
      - frontend/src/lib/quizAttempt.test.ts
      - frontend/src/lib/quizGenerationPolicy.ts
      - frontend/src/lib/quizGenerationPolicy.test.ts
      - frontend/src/lib/quizHistoryAnalytics.ts
      - frontend/src/lib/quizHistoryAnalytics.test.ts
      - frontend/src/lib/quizHistoryPagination.ts
      - frontend/src/lib/quizHistoryPagination.test.ts
      - frontend/src/lib/shortAnswerGrader.ts
      - frontend/src/lib/shortAnswerGrader.test.ts
      - frontend/src/lib/weakAreaAnalytics.ts
      - frontend/src/lib/weakAreaAnalytics.test.ts

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-mutation:
    name: Frontend StrykerJS
    runs-on: ubuntu-24.04
    # The full suite is now near the previous 45-minute ceiling; keep a bounded
    # margin so added protected modules can finish instead of being cancelled.
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run StrykerJS mutation testing
        working-directory: frontend
        run: npm run test:mutation

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stryker-mutation-report
          path: |
            frontend/reports/mutation.html
            frontend/reports/mutation.json
          if-no-files-found: warn
          retention-days: 14
