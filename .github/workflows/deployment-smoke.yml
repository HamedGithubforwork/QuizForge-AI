name: Deployment smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 12 * * *"

permissions:
  contents: read

concurrency:
  group: deployment-smoke
  cancel-in-progress: true

jobs:
  production-smoke:
    name: Vercel + Render read-only smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run read-only production smoke checks
        env:
          QUIZFORGE_FRONTEND_URL: https://quiz-forge-ai-nine.vercel.app
          QUIZFORGE_BACKEND_URL: https://quizforge-ai-api.onrender.com
        run: python scripts/smoke_production.py
