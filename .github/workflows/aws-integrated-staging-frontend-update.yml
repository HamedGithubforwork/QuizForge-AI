name: AWS staging quick update

on:
  # A specific, reviewed, one-time merge request; not every code push.
  push:
    branches: [main]
    paths:
      - ".github/staging-update-requests/auth-parity-pr-563.json"
      - ".github/staging-update-requests/recovery-diagnostic-pr-568.json"
      - ".github/staging-update-requests/frontend-signup-fix-pr-538.json"
  pull_request:
    paths:
      - ".github/workflows/aws-integrated-staging-frontend-update.yml"
      - ".github/staging-update-requests/frontend-signup-fix-pr-538.json"
      - "scripts/integrated_staging/auto_frontend_merge.py"
      - "scripts/integrated_staging/test_auto_frontend_merge.py"
      - "e2e/staging-live-auth-smoke.mjs"
      - "scripts/integrated_staging/fast_frontend.py"
      - "scripts/integrated_staging/test_fast_frontend.py"
      - "scripts/integrated_staging/ai_budget.py"
      - "scripts/integrated_staging/test_ai_budget.py"
      - "scripts/integrated_staging/generation_guard.py"
      - "scripts/integrated_staging/probe.py"
      - "scripts/integrated_staging/test_probe.py"
      - "scripts/integrated_staging/test_generation_guard.py"
      - ".github/workflows/aws-staging-ai-budget.yml"
      - "scripts/integrated_staging/fast_auth.py"
      - "scripts/integrated_staging/test_fast_auth.py"
      - "scripts/integrated_staging/fast_password.py"
      - "scripts/integrated_staging/test_fast_password.py"
      - "scripts/integrated_staging/fast_parity.py"
      - "scripts/integrated_staging/test_fast_parity.py"
      - "scripts/integrated_staging/fast_recovery.py"
      - "scripts/integrated_staging/test_fast_recovery.py"
      - "scripts/integrated_staging/test_recovery_diagnostics.py"
      - "scripts/integrated_staging/auto_recovery_diagnostic.py"
      - "scripts/integrated_staging/test_auto_recovery_diagnostic.py"
      - ".github/staging-update-requests/recovery-diagnostic-pr-565.json"
      - ".github/staging-update-requests/recovery-diagnostic-pr-566.json"
      - "scripts/integrated_staging/auto_recovery_shape_merge.py"
      - "scripts/integrated_staging/test_auto_recovery_shape_merge.py"
      - "scripts/integrated_staging/auto_recovery_fields_merge.py"
      - "scripts/integrated_staging/test_auto_recovery_fields_merge.py"
      - "scripts/integrated_staging/auto_recovery_metadata_merge.py"
      - "scripts/integrated_staging/test_auto_recovery_metadata_merge.py"
      - ".github/staging-update-requests/recovery-diagnostic-pr-568.json"
      - ".github/staging-update-requests/recovery-diagnostic-pr-567.json"
      - "scripts/integrated_staging/production_parity.py"
      - "scripts/integrated_staging/test_production_parity.py"
      - "scripts/integrated_staging/package_recovery.py"
      - "scripts/integrated_staging/test_preview_baseline.py"
      - "scripts/aws_staging_preview.py"
      - "infra/aws/lightsail-production/auth.tf"
      - "infra/aws/lightsail-production/operations.tf"
      - "scripts/production/lightsail/identity_triggers.py"
      - "scripts/integrated_staging/auto_parity_merge.py"
      - "scripts/integrated_staging/test_auto_parity_merge.py"
      - ".github/staging-update-requests/auth-parity-pr-563.json"
      - "scripts/integrated_staging/control.py"
      - "scripts/integrated_staging/build.py"
      - "scripts/integrated_staging/test_staging_build_env.py"
      - "e2e/staging-build-smoke.mjs"
      - "infra/aws/integrated-staging/main.tf"
  workflow_dispatch:
    inputs:
      operation:
        description: "Frontend, signup, password minimum, or guarded auth parity"
        type: choice
        options: [frontend, enable_test_signup, update_password_policy, align_auth_parity, align_recovery_hook]
        required: true
        default: frontend
      frontend_pr:
        description: "Frontend PR with green checks (used only for frontend operation)"
        type: string
        required: false
        default: "538"

permissions:
  contents: read

# Serialize with full provision/stop/scheduled cleanup. Never extend the lease.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('quizforge-fast-refresh-pr-{0}', github.event.pull_request.number) || 'quizforge-integrated-staging' }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_foundation_state_bucket: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_hostname: ${{ vars.AWS_STAGING_API_HOSTNAME }}
  TF_VAR_certificate_arn: ${{ vars.AWS_STAGING_CERTIFICATE_ARN }}
  TF_VAR_zone_id: ${{ vars.AWS_STAGING_ZONE_ID }}

jobs:
  test:
    name: Fast refresh safety tests (no cloud credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - name: Install locked staging test dependencies
        run: python -m pip install --require-hashes -r scripts/rds_rehearsal/requirements.lock
      - name: Exercise lease, artifact, ownership and fail-closed checks
        run: |
          python -m unittest discover -s scripts/integrated_staging -p 'test_fast_frontend.py' -v
          python -m unittest discover -s scripts/integrated_staging -p 'test_auto_frontend_merge.py' -v
          python -m unittest discover -s scripts/integrated_staging -p 'test_ai_budget.py' -v
          python -m unittest discover -s scripts/integrated_staging -p 'test_staging_build_env.py' -v
          python -m unittest discover -s scripts/integrated_staging -p 'test_fast_auth.py' -v
          python -m unittest discover -s scripts/integrated_staging -p 'test_fast_password.py' -v
          python -m unittest discover -s scripts/integrated_staging -p 'test_fast_parity.py' -v
          python -m unittest discover -s scripts/integrated_staging -p 'test_fast_recovery.py' -v
          python -m unittest discover -s scripts/integrated_staging -p 'test_recovery_diagnostics.py' -v
          python -m unittest discover -s scripts/integrated_staging -p 'test_auto_recovery_diagnostic.py' -v
          python -m unittest discover -s scripts/integrated_staging -p 'test_auto_recovery_shape_merge.py' -v
          python -m unittest discover -s scripts/integrated_staging -p 'test_auto_recovery_fields_merge.py' -v
          python -m unittest discover -s scripts/integrated_staging -p 'test_auto_recovery_metadata_merge.py' -v
          python -m unittest discover -s scripts/integrated_staging -p 'test_production_parity.py' -v
          python -m unittest discover -s scripts/integrated_staging -p 'test_preview_baseline.py' -v
          python -m unittest discover -s scripts/integrated_staging -p 'test_auto_parity_merge.py' -v
          python -m compileall -q scripts/integrated_staging/fast_frontend.py scripts/integrated_staging/fast_auth.py scripts/integrated_staging/fast_password.py scripts/integrated_staging/fast_parity.py scripts/integrated_staging/auto_parity_merge.py scripts/integrated_staging/production_parity.py scripts/integrated_staging/package_recovery.py scripts/aws_staging_preview.py

  intent:
    name: Authorize only one reviewed main merge for staging frontend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      approved: ${{ steps.guard.outputs.approved }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Deny unrelated and unreviewed staging publication
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/integrated_staging/auto_frontend_merge.py

  resolve:
    name: Verify exact frontend PR commit
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.operation == 'frontend') ||
       (github.event_name == 'push' && needs.intent.outputs.approved == 'true'))
    needs: [test, intent]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
      pull-requests: read
    outputs:
      frontend_sha: ${{ steps.review.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require existing reviewed frontend checks
        id: review
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_FRONTEND_PR: ${{ github.event_name == 'push' && '538' || inputs.frontend_pr }}
        run: |
          python - <<'PY'
          import os
          from scripts.aws_staging_preview import FRONTEND_REQUIRED, checked_pr
          sha = checked_pr(os.environ["PREVIEW_FRONTEND_PR"], FRONTEND_REQUIRED)
          if os.environ.get("GITHUB_EVENT_NAME") == "push":
              from scripts.integrated_staging.auto_frontend_merge import FRONTEND_SHA
              if sha != FRONTEND_SHA:
                  raise ValueError("Staging release target changed after review")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"sha={sha}\n")
          print("PASS: exact same-repository frontend PR and required checks verified")
          PY

  auth:
    name: Enable email-confirmed signup on existing disposable staging Cognito only
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation == 'enable_test_signup'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      STAGING_AUTH_UPDATE: enable_test_signup
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - run: python -m pip install --require-hashes -r scripts/rds_rehearsal/requirements.lock
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.7"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ca-central-1
      - name: Open only exact disposable staging state
        run: |
          terraform -chdir=infra/aws/integrated-staging init -reconfigure -lockfile=readonly \
            -backend-config="bucket=$TF_VAR_foundation_state_bucket" -backend-config="key=quizforge/integrated-staging/terraform.tfstate" \
            -backend-config="region=ca-central-1" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - name: Verify active staging and apply exactly one audited in-place Cognito pool change
        run: python scripts/integrated_staging/fast_auth.py enable

  password:
    name: Update only existing staging Cognito password minimum from 14 to 8
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation == 'update_password_policy'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      STAGING_AUTH_UPDATE: update_password_policy
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - run: python -m pip install --require-hashes -r scripts/rds_rehearsal/requirements.lock
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.7"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ca-central-1
      - name: Open only existing disposable staging Terraform state
        run: |
          terraform -chdir=infra/aws/integrated-staging init -reconfigure -lockfile=readonly \
            -backend-config="bucket=$TF_VAR_foundation_state_bucket" -backend-config="key=quizforge/integrated-staging/terraform.tfstate" \
            -backend-config="region=ca-central-1" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - name: Audit exact password-only Terraform plan and apply verified change
        run: python scripts/integrated_staging/fast_password.py update

  parity:
    name: Align only existing disposable staging Cognito with production auth policy
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.operation == 'align_auth_parity'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      STAGING_AUTH_UPDATE: align_auth_parity
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify one-time reviewed main-merge authorization
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/integrated_staging/auto_parity_merge.py
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - run: python -m pip install --require-hashes -r scripts/rds_rehearsal/requirements.lock
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.7"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ca-central-1
      - name: Open only existing disposable staging Terraform state
        run: |
          terraform -chdir=infra/aws/integrated-staging init -reconfigure -lockfile=readonly \
            -backend-config="bucket=$TF_VAR_foundation_state_bucket" -backend-config="key=quizforge/integrated-staging/terraform.tfstate" \
            -backend-config="region=ca-central-1" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - name: Audit single-pool auth parity plan with old and new live checks
        run: python scripts/integrated_staging/fast_parity.py update

  recovery:
    name: Attach reviewed recovery Lambda only to existing disposable Cognito
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation == 'align_recovery_hook'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      STAGING_AUTH_UPDATE: align_recovery_hook
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - run: python -m pip install --require-hashes -r scripts/rds_rehearsal/requirements.lock
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.7"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ca-central-1
      - name: Open only existing isolated staging state
        run: |
          terraform -chdir=infra/aws/integrated-staging init -reconfigure -lockfile=readonly \
            -backend-config="bucket=$TF_VAR_foundation_state_bucket" -backend-config="key=quizforge/integrated-staging/terraform.tfstate" \
            -backend-config="region=ca-central-1" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - name: Audit exact recovery resources and attach in-place
        run: python scripts/integrated_staging/fast_recovery.py update

  recovery_diagnostic:
    name: Read-only review-gated recovery Lambda plan diagnosis
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      STAGING_AUTH_UPDATE: align_recovery_hook
      STAGING_RECOVERY_DRY_RUN: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require exact PR 568 merge before AWS identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/integrated_staging/auto_recovery_metadata_merge.py
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - run: python -m pip install --require-hashes -r scripts/rds_rehearsal/requirements.lock
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.7"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ca-central-1
      - name: Open only existing staging Terraform state
        run: |
          terraform -chdir=infra/aws/integrated-staging init -reconfigure -lockfile=readonly \
            -backend-config="bucket=$TF_VAR_foundation_state_bucket" -backend-config="key=quizforge/integrated-staging/terraform.tfstate" \
            -backend-config="region=ca-central-1" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - name: Diagnose guarded staging recovery plan (never apply)
        run: python scripts/integrated_staging/fast_recovery.py update

  config:
    name: Export active staging configuration only
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - run: python -m pip install --require-hashes -r scripts/rds_rehearsal/requirements.lock
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.7"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ca-central-1
      - name: Read only isolated staging state
        run: |
          terraform -chdir=infra/aws/integrated-staging init -reconfigure -lockfile=readonly \
            -backend-config="bucket=$TF_VAR_foundation_state_bucket" -backend-config="key=quizforge/integrated-staging/terraform.tfstate" \
            -backend-config="region=ca-central-1" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - name: Require a healthy disposable staging lease
        run: python scripts/integrated_staging/fast_frontend.py export
      - uses: actions/upload-artifact@v7
        with:
          name: fast-update-public-config
          path: integration-config.json
          retention-days: 1

  build:
    name: Build frontend with no AWS credentials
    needs: [resolve, config]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.frontend_sha }}
          path: preview-source
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: fast-update-public-config
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - name: Install locked trusted dependencies
        run: python -m pip install --require-hashes -r scripts/rds_rehearsal/requirements.lock
      - name: Build reviewed frontend using only public staging settings
        run: python scripts/integrated_staging/build.py preview-source/frontend
      # A successful npm build does not prove the lazy Cognito bundle can
      # initialize; previous HTML/CSS checks missed a blank live page.
      - name: Install locked browser pre-publish checks
        run: |
          npm ci --prefix e2e --ignore-scripts
          npx --prefix e2e playwright install --with-deps chromium
      - name: Refuse a blank or crashing staging frontend before upload
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4179 --bind 127.0.0.1 --directory hosting-dist > /dev/null 2>&1 &
          local_server=$!
          trap 'kill "$local_server" 2>/dev/null || true' EXIT
          node e2e/staging-build-smoke.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: fast-update-built-site
          path: |
            hosting-dist/
            hosting-manifest.json
            integration-config.json
          retention-days: 1

  publish:
    name: Publish only verified staging frontend files
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: fast-update-built-site
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - run: python -m pip install --require-hashes -r scripts/rds_rehearsal/requirements.lock
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.7"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ca-central-1
      - name: Reopen only isolated staging state
        run: |
          terraform -chdir=infra/aws/integrated-staging init -reconfigure -lockfile=readonly \
            -backend-config="bucket=$TF_VAR_foundation_state_bucket" -backend-config="key=quizforge/integrated-staging/terraform.tfstate" \
            -backend-config="region=ca-central-1" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - name: Recheck lease and update existing S3 frontend
        run: python scripts/integrated_staging/fast_frontend.py publish

  live_browser:
    name: Verify published staging registration in real Chromium
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install locked browser tools
        run: |
          npm ci --prefix e2e --ignore-scripts
          npx --prefix e2e playwright install --with-deps chromium
      - name: Check live signup and sign-in screens without user account
        run: node e2e/staging-live-auth-smoke.mjs
