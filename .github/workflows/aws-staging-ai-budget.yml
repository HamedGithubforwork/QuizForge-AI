name: Staging AI allowance (manual status or refill)

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Show remaining AI requests or refill to 10"
        type: choice
        options: [status, refill]
        default: status
        required: true

permissions:
  contents: read

concurrency:
  group: quizforge-integrated-staging
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_foundation_state_bucket: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_hostname: ${{ vars.AWS_STAGING_API_HOSTNAME }}
  TF_VAR_certificate_arn: ${{ vars.AWS_STAGING_CERTIFICATE_ARN }}
  TF_VAR_zone_id: ${{ vars.AWS_STAGING_ZONE_ID }}

jobs:
  test:
    name: Validate exact staging allowance operations (no AWS identity)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - run: python -m pip install --require-hashes -r scripts/rds_rehearsal/requirements.lock -r scripts/integrated_staging/redis.lock
      - run: python -m unittest discover -s scripts/integrated_staging -p 'test_ai_budget.py' -v
      - run: python -m unittest discover -s scripts/integrated_staging -p 'test_generation_guard.py' -v

  budget:
    name: Inspect or refill only existing staging AI allowance
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      STAGING_AI_BUDGET_ACTION: ${{ inputs.operation }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - run: python -m pip install --require-hashes -r scripts/rds_rehearsal/requirements.lock -r scripts/integrated_staging/redis.lock
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.7"
          terraform_wrapper: false
      - name: Confirm manual main-branch action before AWS identity
        env:
          GITHUB_ACTION_SCRIPT_OPERATION: ${{ inputs.operation }}
        run: |
          python - <<'PY'
          import os,sys
          sys.path.insert(0, "scripts/integrated_staging")
          from ai_budget import require_trusted_manual_action
          action = os.environ["GITHUB_ACTION_SCRIPT_OPERATION"]
          require_trusted_manual_action(action)
          print("PASS: verified manual status/refill on trusted main")
          PY
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ca-central-1
      - name: Open existing isolated staging state only
        run: |
          terraform -chdir=infra/aws/integrated-staging init -reconfigure -lockfile=readonly \
            -backend-config="bucket=$TF_VAR_foundation_state_bucket" \
            -backend-config="key=quizforge/integrated-staging/terraform.tfstate" \
            -backend-config="region=ca-central-1" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
      - name: Read or refill disposable private Valkey budget
        run: python scripts/integrated_staging/ai_budget.py "${{ inputs.operation }}"
