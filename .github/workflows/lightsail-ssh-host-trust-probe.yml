name: Permanent Lightsail SSH host trust probe

on:
  pull_request:
    paths:
      - ".github/workflows/lightsail-ssh-host-trust-probe.yml"
      - "scripts/production/lightsail/ssh_trust_probe.py"
      - "scripts/production/lightsail/host_control.py"
      - "scripts/production/lightsail/test_host_control.py"
      - "scripts/production/lightsail/test_ssh_trust_probe.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - name: Compile and test SSH trust probe without cloud credentials
        run: |
          python -m py_compile scripts/production/lightsail/host_control.py scripts/production/lightsail/ssh_trust_probe.py
          python -m unittest scripts.production.lightsail.test_host_control scripts.production.lightsail.test_ssh_trust_probe -v

  probe:
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'HamedGithubforwork/QuizForge-AI'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        vantage: [one, two]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: quizforge-lightsail-ssh-host-trust-probe
      cancel-in-progress: false
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      LIGHTSAIL_ADMIN_IPV4_CIDR: ${{ secrets.LIGHTSAIL_ADMIN_IPV4_CIDR }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"

      - name: Install existing hash-locked AWS SDK dependencies
        run: python -m pip install --require-hashes -r scripts/production/requirements.lock

      - name: Assume deployment role with temporary SSH-probe boundary
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: qf-lightsail-ssh-trust-${{ matrix.vantage }}
          role-duration-seconds: 900
          aws-region: ca-central-1
          mask-aws-account-id: true
          unset-current-credentials: true
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{
              "Effect":"Allow",
              "Action":[
                "lightsail:GetInstance",
                "lightsail:GetStaticIp",
                "lightsail:GetInstancePortStates",
                "lightsail:OpenInstancePublicPorts",
                "lightsail:CloseInstancePublicPorts"
              ],
              "Resource":"*"
            }]}

      - name: Scan host key from one runner IPv4 and restore firewall
        run: python scripts/production/lightsail/ssh_trust_probe.py

      - name: Publish only host-key fingerprints and firewall restoration facts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: permanent-lightsail-ssh-trust-${{ matrix.vantage }}
          path: lightsail-ssh-trust-probe/summary.json
          if-no-files-found: error
          retention-days: 7
