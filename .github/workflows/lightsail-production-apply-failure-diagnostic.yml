name: Permanent Lightsail apply failure root-cause diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/lightsail-production-apply-failure-diagnostic.yml"
      - "scripts/lightsail_activation/apply_failure_diagnose.py"
      - "scripts/lightsail_activation/tests/test_apply_failure_diagnose.py"
      - "scripts/lightsail_activation/repair_review.py"
      - "scripts/lightsail_activation/review.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/lightsail-production-apply-failure-diagnostic.yml"
      - "scripts/lightsail_activation/apply_failure_diagnose.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - name: Credential-free diagnostic tests
        run: |
          python -m py_compile scripts/lightsail_activation/apply_failure_diagnose.py
          python -m unittest discover -s scripts/lightsail_activation/tests -p 'test_apply_failure_diagnose.py' -v

  diagnose:
    needs: validate
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'HamedGithubforwork/QuizForge-AI'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      QF_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      QF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      AWS_BUDGET_ALERT_EMAIL: ${{ secrets.AWS_BUDGET_ALERT_EMAIL }}
      LIGHTSAIL_SSH_PUBLIC_KEY: ${{ secrets.LIGHTSAIL_SSH_PUBLIC_KEY }}
      LIGHTSAIL_ADMIN_IPV4_CIDR: ${{ secrets.LIGHTSAIL_ADMIN_IPV4_CIDR }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"

      - name: Install existing hash-locked AWS SDK dependencies
        run: python -m pip install --require-hashes -r scripts/rds_rehearsal/requirements.lock

      - name: Check exact permanent-host source blobs
        run: python -m scripts.lightsail_activation.review check-source

      - name: Assume deployment role with read-only diagnostic boundary
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: qf-lightsail-apply-failure-diagnostic
          role-duration-seconds: 1200
          aws-region: ca-central-1
          mask-aws-account-id: true
          unset-current-credentials: true
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[
              {"Effect":"Allow","Action":[
                "sts:GetCallerIdentity",
                "cloudtrail:LookupEvents",
                "lightsail:GetOperations",
                "lightsail:GetOperation",
                "lightsail:GetInstances",
                "lightsail:GetInstance",
                "lightsail:GetKeyPair",
                "lightsail:GetBundles",
                "lightsail:GetBlueprints",
                "lightsail:GetRegions",
                "iam:GetRole",
                "iam:ListRolePolicies",
                "iam:GetRolePolicy",
                "iam:ListAttachedRolePolicies",
                "iam:GetPolicy",
                "iam:GetPolicyVersion",
                "iam:SimulatePrincipalPolicy"
              ],"Resource":"*"}
            ]}

      - name: Inspect CloudTrail, Lightsail operations, and effective IAM evidence
        run: python -m scripts.lightsail_activation.apply_failure_diagnose

      - name: Publish only sanitized root-cause findings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: permanent-lightsail-apply-failure-root-cause
          path: lightsail-apply-failure-diagnostic/summary.json
          if-no-files-found: error
          retention-days: 7
