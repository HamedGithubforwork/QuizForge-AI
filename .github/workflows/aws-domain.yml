name: AWS domain prerequisites

on:
  pull_request:
    paths:
      - "infra/aws/domain/**"
      - "scripts/domain_prerequisites/**"
      - "scripts/aws_staging_https.py"
      - ".github/workflows/aws-domain.yml"
  workflow_dispatch:
    inputs:
      operation:
        description: "Prepare quizfromnotes.com DNS and staging certificate, or verify after delegation"
        type: choice
        required: true
        options: [prepare, verify]

permissions:
  contents: read
concurrency:
  group: quizforge-domain-prerequisites
  cancel-in-progress: false
env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  validate:
    name: Domain prerequisite guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - name: Test duplicate-zone, saved-plan and certificate boundaries
        run: |
          python -m unittest discover -s scripts/domain_prerequisites -p 'test_*.py' -v
          python -m unittest discover -s scripts/tests -p 'test_aws_staging_https.py' -v
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - name: Validate domain Terraform without AWS credentials
        run: |
          terraform -chdir=infra/aws/domain fmt -check
          terraform -chdir=infra/aws/domain init -backend=false -lockfile=readonly
          terraform -chdir=infra/aws/domain validate
          terraform -chdir=infra/aws/domain test

  domain:
    name: Prepare or verify domain prerequisites
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - name: Install locked controller dependencies before AWS credentials
        run: python -m pip install --require-hashes -r scripts/rds_rehearsal/requirements.lock
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ca-central-1
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[
              {"Effect":"Allow","Action":["sts:GetCallerIdentity"],"Resource":"*"},
              {"Effect":"Allow","Action":["s3:ListBucket","s3:GetBucketLocation"],"Resource":"arn:aws:s3:::${{ vars.TF_STATE_BUCKET }}"},
              {"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject"],"Resource":"arn:aws:s3:::${{ vars.TF_STATE_BUCKET }}/quizforge/domain/*"},
              {"Effect":"Allow","Action":["route53:CreateHostedZone","route53:ListHostedZones","route53:ListHostedZonesByName","route53:GetHostedZone","route53:GetChange","route53:ListTagsForResource","route53:ChangeTagsForResource","route53:ListResourceRecordSets"],"Resource":"*"},
              {"Effect":"Allow","Action":"route53:ChangeResourceRecordSets","Resource":"arn:aws:route53:::hostedzone/*","Condition":{"ForAllValues:StringEquals":{"route53:ChangeResourceRecordSetsRecordTypes":["CNAME"],"route53:ChangeResourceRecordSetsActions":["CREATE"]},"ForAllValues:StringLike":{"route53:ChangeResourceRecordSetsNormalizedRecordNames":["_*.staging-api.quizfromnotes.com"]}}},
              {"Effect":"Allow","Action":["acm:RequestCertificate"],"Resource":"*","Condition":{"StringEquals":{"aws:RequestedRegion":"ca-central-1","acm:ValidationMethod":"DNS","acm:Export":"DISABLED"},"ForAllValues:StringEquals":{"acm:DomainNames":["staging-api.quizfromnotes.com"]}}},
              {"Effect":"Allow","Action":["acm:DescribeCertificate","acm:AddTagsToCertificate","acm:ListTagsForCertificate"],"Resource":"arn:aws:acm:ca-central-1:*:certificate/*"}
            ]}
      - name: Initialize isolated domain state
        run: |
          terraform -chdir=infra/aws/domain init -reconfigure -lockfile=readonly \
            -backend-config="bucket=$STATE_BUCKET" -backend-config="key=quizforge/domain/terraform.tfstate" \
            -backend-config="region=ca-central-1" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - name: Refuse an unmanaged duplicate zone
        if: inputs.operation == 'prepare'
        run: python scripts/domain_prerequisites/control.py preflight
      - name: Plan and inspect only domain prerequisites
        if: inputs.operation == 'prepare'
        run: |
          terraform -chdir=infra/aws/domain plan -out=domain.tfplan
          terraform -chdir=infra/aws/domain show -json domain.tfplan > "$RUNNER_TEMP/domain-plan.json"
          python scripts/domain_prerequisites/control.py plan "$RUNNER_TEMP/domain-plan.json"
      - name: Apply the checked plan
        if: inputs.operation == 'prepare'
        run: terraform -chdir=infra/aws/domain apply -auto-approve domain.tfplan
      - name: Report exact registrar nameservers and certificate status
        if: inputs.operation == 'prepare'
        run: python scripts/domain_prerequisites/control.py report
      - name: Require public delegation, issued certificate and unused staging hostname
        if: inputs.operation == 'verify'
        run: python scripts/domain_prerequisites/control.py verify
