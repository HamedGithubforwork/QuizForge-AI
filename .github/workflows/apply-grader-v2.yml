name: Apply short-answer grader v2

on:
  push:
    branches:
      - short-answer-grader-v2

permissions:
  contents: write

jobs:
  integrate-and-check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out grader branch
        uses: actions/checkout@v4
        with:
          ref: short-answer-grader-v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply grader integration
        run: python scripts/apply_short_answer_grader_v2.py

      - name: Install backend test dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Commit integrated grader
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/App.tsx backend/main.py backend/tests/test_main.py
          git diff --cached --quiet && exit 0
          git commit -m "Integrate generalized short answer grader"
          git push origin short-answer-grader-v2
