name: Local AI Qwen sizes vs DeepSeek comparison

on:
  pull_request:
    paths:
      - desktop/src/local-benchmark-models.cjs
      - desktop/src/local-deepseek-adapter.cjs
      - desktop/src/windows-local-ai-provider.cjs
      - desktop/test/local-deepseek-adapter.test.cjs
      - desktop/src/local-model-store.cjs
      - desktop/src/windows-local-ai-manager.cjs
      - desktop/src/windows-local-ai-stack.cjs
      - desktop/src/local-offload-policy.cjs
      - desktop/scripts/ensure-verified-model.cjs
      - desktop/scripts/benchmark-local-generation.cjs
      - desktop/scripts/benchmark-small-qwen-scaffold.cjs
      - desktop/scripts/benchmark-small-qwen-adaptive.cjs
      - desktop/test/local-small-qwen-adaptive.test.cjs
      - desktop/scripts/inspect-synthetic-quiz.cjs
      - desktop/test/local-benchmark-inspection.test.cjs
      - desktop/scripts/summarize-local-model-comparison.cjs
      - desktop/test/local-benchmark-models.test.cjs
      - desktop/test/local-model-store.test.cjs
      - .github/workflows/local-ai-model-comparison.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qfn-five-model-comparison-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model:
    name: Verify and benchmark ${{ matrix.model }}
    runs-on: windows-2025
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        model:
          - qwen3-4b-q4-k-m
          - qwen3-1p7b-q4-k-m
          - qwen3-0p6b-q4-k-m
          - deepseek-r1-qwen-1p5b-q4-k-m
          - deepseek-r1-qwen-7b-q4-k-m
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Regression tests and exact model allowlist
        shell: pwsh
        run: |
          node --test desktop/test/local-benchmark-models.test.cjs desktop/test/local-benchmark-inspection.test.cjs desktop/test/local-small-qwen-adaptive.test.cjs desktop/test/local-model-store.test.cjs desktop/test/local-deepseek-adapter.test.cjs desktop/test/local-offload-policy.test.cjs desktop/test/local-benchmark-metrics.test.cjs desktop/test/local-runtime.test.cjs
          exit $LASTEXITCODE
      - name: Restore verified baseline model cache
        if: matrix.model == 'qwen3-4b-q4-k-m'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/models
          key: qfn-windows-qwen3-4b-q4km-7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5
      - name: Download and verify pinned llama.cpp runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          curl.exe -fL --max-time 180 -o "$env:RUNNER_TEMP/runtime.zip" 'https://github.com/ggml-org/llama.cpp/releases/download/b11317/llama-b11317-bin-win-vulkan-x64.zip'
          if ($LASTEXITCODE -ne 0) { throw 'Runtime download failed' }
          if ((Get-FileHash "$env:RUNNER_TEMP/runtime.zip" -Algorithm SHA256).Hash.ToLower() -ne 'b0cb46635aa4a028c272b74dc1966178b57157b4be199985e4d5e62cc6664338') { throw 'Runtime checksum mismatch' }
          Expand-Archive "$env:RUNNER_TEMP/runtime.zip" "$env:RUNNER_TEMP/runtime-full"
          New-Item -ItemType Directory "$env:RUNNER_TEMP/llama" -Force | Out-Null
          node desktop/scripts/stage-local-runtime.cjs "$env:RUNNER_TEMP/runtime-full" "$env:RUNNER_TEMP/llama"
          exit $LASTEXITCODE
      - name: Generate six offline source-verified quizzes with ${{ matrix.model }}
        shell: pwsh
        env:
          BENCHMARK_MODEL_ID: ${{ matrix.model }}
        run: |
          # A slow DeepSeek 7B download must not prevent smaller models running.
          # The benchmark writes sanitized evidence on a failed validation too.
          $ErrorActionPreference = 'Stop'
          $modelDir = "$env:RUNNER_TEMP/models"
          $reports = "$env:RUNNER_TEMP/comparison"
          New-Item -ItemType Directory $modelDir, $reports -Force | Out-Null
          node desktop/scripts/ensure-verified-model.cjs $modelDir $env:BENCHMARK_MODEL_ID
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Verified benchmark model was not available: $env:BENCHMARK_MODEL_ID"
          } else {
            node desktop/scripts/benchmark-local-generation.cjs "$env:RUNNER_TEMP/llama" $modelDir "$reports/$env:BENCHMARK_MODEL_ID.json" cpu 3 $env:BENCHMARK_MODEL_ID
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Source-fact quality gate failed; retaining the report for $env:BENCHMARK_MODEL_ID"
            }
            # Small-Qwen-only experimental treatment: short prompts, two
            # independent source-constrained variants (seeds 42 and 137),
            # and one model question per verified source fact. The original
            # strict five-question benchmark above remains the baseline.
            if ($env:BENCHMARK_MODEL_ID -in @('qwen3-0p6b-q4-k-m', 'qwen3-1p7b-q4-k-m')) {
              node desktop/scripts/benchmark-small-qwen-scaffold.cjs "$env:RUNNER_TEMP/llama" $modelDir "$reports/$env:BENCHMARK_MODEL_ID-scaffold.json" $env:BENCHMARK_MODEL_ID
              if ($LASTEXITCODE -ne 0) {
                Write-Warning "Scaffolded diagnostics incomplete; preserving original baseline result for $env:BENCHMARK_MODEL_ID"
              }
            }
            if ($env:BENCHMARK_MODEL_ID -in @('qwen3-0p6b-q4-k-m', 'qwen3-1p7b-q4-k-m')) {
              node desktop/scripts/benchmark-small-qwen-adaptive.cjs "$env:RUNNER_TEMP/llama" $modelDir "$reports/$env:BENCHMARK_MODEL_ID-adaptive.json" $env:BENCHMARK_MODEL_ID
              if ($LASTEXITCODE -ne 0) {
                Write-Warning "Adaptive Qwen diagnostic failed; retain baseline report"
              }
            }
          }
          # Per-model jobs intentionally succeed so the aggregate quality gate
          # can report *all five outcomes* rather than cancelling other models.
          exit 0
      - name: Upload per-model report even when quality fails
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qfn-model-result-${{ matrix.model }}
          path: ${{ runner.temp }}/comparison/${{ matrix.model }}*.json
          if-no-files-found: warn
          retention-days: 14

  aggregate:
    name: Aggregate five model quality results
    needs: model
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Collect benchmark reports from the five model jobs
        uses: actions/download-artifact@v4
        with:
          pattern: qfn-model-result-*
          path: comparison
          merge-multiple: true
      - name: Summarize all model results without declaring absent or bad models winners
        run: node desktop/scripts/summarize-local-model-comparison.cjs comparison
      - name: Upload combined comparison including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qwen3-4b-1p7b-0p6b-vs-deepseek-comparison
          path: comparison/*.json
          if-no-files-found: warn
          retention-days: 14
