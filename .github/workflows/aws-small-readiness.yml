name: Small AWS server readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Read Lightsail catalogue and account plan without creating a server
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.16'
      - run: python -m pip install --require-hashes -r scripts/rds_rehearsal/requirements.lock
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ca-central-1
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["sts:GetCallerIdentity","freetier:GetAccountPlanState","lightsail:GetBundles"],"Resource":"*"}]}
      - run: python scripts/capacity/readiness.py
