name: Production Google OAuth incident inspection

on:
  pull_request:
    paths:
      - ".github/workflows/production-google-incident.yml"
      - "scripts/production/lightsail/google_incident.py"
      - "scripts/production/lightsail/test_google_incident.py"
      - "scripts/production/lightsail/google_client_probe.py"
      - "scripts/production/lightsail/test_google_client_probe.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Test credential-safe read-only production checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - name: Run no-cloud tests without OAuth secrets or AWS permissions
        run: |
          python -m py_compile scripts/production/lightsail/google_incident.py
          python -m unittest scripts.production.lightsail.test_google_incident scripts.production.lightsail.test_google_client_probe -v
      - name: Prevent an invalid production OIDC role duration
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          workflow = Path(".github/workflows/production-google-incident.yml").read_text()
          match = re.search(r"^\s*role-duration-seconds:\s*(\d+)\s*$", workflow, flags=re.MULTILINE)
          assert match, "Missing OIDC session duration"
          assert 900 <= int(match.group(1)) <= 3600, "AWS OIDC sessions require 900-3600 seconds"
          PY

  production-readonly:
    name: Check existing production Cognito provider without changes
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'HamedGithubforwork/QuizForge-AI' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment:
      name: production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: quizforge-protected-production-google-oauth-readonly
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - name: Install existing hash-locked AWS SDK
        run: python -m pip install --require-hashes -r scripts/production/requirements.lock
      - name: Assume read-only Cognito AWS permissions
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: qf-protected-production-google-readiness
          # AWS STS AssumeRoleWithWebIdentity requires at least 900 seconds.
          role-duration-seconds: 900
          aws-region: ca-central-1
          mask-aws-account-id: true
          unset-current-credentials: true
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{
              "Effect":"Allow",
              "Action":[
                "sts:GetCallerIdentity",
                "cognito-idp:ListUserPools",
                "cognito-idp:ListUserPoolClients",
                "cognito-idp:DescribeUserPoolClient",
                "cognito-idp:DescribeUserPool",
                "cognito-idp:DescribeIdentityProvider"
              ],
              "Resource":"*"
            },{"Effect":"Allow","Action":["lambda:GetFunctionConfiguration"],
              "Resource":"arn:aws:lambda:ca-central-1:399311815467:function:quizforge-production-lightsail-recovery"},
             {"Effect":"Allow","Action":["logs:FilterLogEvents"],
              "Resource":"arn:aws:logs:ca-central-1:399311815467:log-group:/aws/lambda/quizforge-production-lightsail-recovery:*"}]}
      - name: Check production Google OAuth credentials and Cognito wiring safely
        env:
          PROD_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.PROD_GOOGLE_OAUTH_CLIENT_ID }}
          PROD_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.PROD_GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          set +x
          python -m scripts.production.lightsail.google_incident
          python -m scripts.production.lightsail.google_client_probe
