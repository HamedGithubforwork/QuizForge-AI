name: Permanent Lightsail application deploy readiness

on:
  pull_request:
    paths:
      - ".github/workflows/lightsail-app-deploy-readiness.yml"
      - "scripts/production/lightsail/deploy_readiness.py"
      - "scripts/production/lightsail/test_deploy_readiness.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/lightsail-app-deploy-readiness.yml"
      - "scripts/production/lightsail/deploy_readiness.py"
      - "scripts/production/lightsail/test_deploy_readiness.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - name: Compile and test readiness probe without credentials
        run: |
          python -m py_compile scripts/production/lightsail/deploy_readiness.py
          python -m unittest scripts.production.lightsail.test_deploy_readiness -v
      - name: Verify exact tested application candidate still exists
        uses: actions/checkout@v7
        with:
          ref: 807a4084237f6db544620cdb8322108ebf52251c
          path: application-candidate
          persist-credentials: false
      - name: Require candidate backend identity components
        run: |
          test -f application-candidate/backend/main.py
          test -f application-candidate/backend/identity_app.py
          test -f application-candidate/backend/identity_database.py
          test -f application-candidate/backend/identity_proofs.py

  inspect:
    needs: validate
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'HamedGithubforwork/QuizForge-AI'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: quizforge-lightsail-app-deploy-readiness
      cancel-in-progress: false
    env:
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"

      - name: Install existing hash-locked AWS SDK dependencies
        run: python -m pip install --require-hashes -r scripts/rds_rehearsal/requirements.lock

      - name: Assume deployment role with read-only host-inspection boundary
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: qf-lightsail-app-readiness
          role-duration-seconds: 900
          aws-region: ca-central-1
          mask-aws-account-id: true
          unset-current-credentials: true
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[
              {"Effect":"Allow","Action":[
                "sts:GetCallerIdentity",
                "lightsail:GetInstance",
                "lightsail:GetStaticIp",
                "lightsail:GetInstanceAccessDetails",
                "ecr:DescribeRepositories"
              ],"Resource":"*"}
            ]}

      - name: Inspect live host and deployment prerequisites without changes
        run: python scripts/production/lightsail/deploy_readiness.py

      - name: Publish only sanitized readiness summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: permanent-lightsail-app-deploy-readiness
          path: lightsail-app-deploy-readiness/summary.json
          if-no-files-found: error
          retention-days: 7
