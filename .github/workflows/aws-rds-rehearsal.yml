name: AWS private RDS rehearsal

on:
  pull_request:
    paths:
      - "infra/aws/rds-rehearsal/**"
      - "scripts/rds_rehearsal/**"
      - "scripts/aws_staging_preview.py"
      - "scripts/tests/test_aws_staging_preview.py"
      - ".github/workflows/aws-rds-rehearsal.yml"
  workflow_dispatch:
    inputs:
      operation:
        description: "Run the synthetic migration/restore rehearsal, or destroy leftovers"
        required: true
        type: choice
        options: [run, stop]
      backend_pr:
        description: "Optional PR with passing PostgreSQL API checks; test HTTP history CRUD instead of snapshot restore"
        type: string
        default: ""
  schedule:
    - cron: "5 8 * * *"

permissions:
  contents: read
concurrency:
  group: quizforge-rds-rehearsal
  cancel-in-progress: false
env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  validate:
    name: RDS Terraform and real PostgreSQL security tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-rehearsal-only
          POSTGRES_DB: quizforge_rehearsal
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d quizforge_rehearsal"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - name: Validate private rehearsal Terraform
        run: |
          terraform -chdir=infra/aws/rds-rehearsal fmt -check
          terraform -chdir=infra/aws/rds-rehearsal init -backend=false
          terraform -chdir=infra/aws/rds-rehearsal validate
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - name: Install locked PostgreSQL driver
        run: python -m pip install --require-hashes -r scripts/rds_rehearsal/requirements.lock
      - name: Test asynchronous lifecycle guards
        run: |
          python -m unittest discover -s scripts/rds_rehearsal -p 'test_*.py' -v
          python -m unittest discover -s scripts/tests -p 'test_aws_staging_preview.py' -v
      - name: Exercise migration, least privilege and RLS on real PostgreSQL
        env:
          PGHOST: 127.0.0.1
          PGDATABASE: quizforge_rehearsal
          PGUSER: postgres
          PGPASSWORD: local-rehearsal-only
          RDS_REHEARSAL_LOCAL: "1"
        run: |
          python scripts/rds_rehearsal/probe.py seed
          python scripts/rds_rehearsal/probe.py verify-restored
      - name: Build non-root read-only probe image
        run: docker build -t quizforge-rds-rehearsal:ci scripts/rds_rehearsal

  preview-image:
    name: Build tested PostgreSQL API preview
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation == 'run' && inputs.backend_pr != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      pull-requests: read
    outputs:
      sha: ${{ steps.preview.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require successful CI and PostgreSQL security checks on the exact PR commit
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_PR: ${{ inputs.backend_pr }}
          REQUIRE_POSTGRES_HISTORY: "1"
        run: python scripts/aws_staging_preview.py
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.preview.outputs.sha }}
          path: preview-source
          persist-credentials: false
      - name: Build without AWS credentials
        run: |
          docker build --tag quizforge-rds-api:tested preview-source/backend
          docker save --output /tmp/quizforge-rds-api.tar quizforge-rds-api:tested
      - uses: actions/upload-artifact@v7
        with:
          name: tested-rds-api-image
          path: /tmp/quizforge-rds-api.tar
          compression-level: 0
          retention-days: 1

  rehearse:
    name: Rehearse private RDS migration and restore
    needs: [validate, preview-image]
    if: always() && needs.validate.result == 'success' && (needs.preview-image.result == 'success' || needs.preview-image.result == 'skipped') && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation == 'run'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_foundation_state_bucket: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_api_validation: ${{ inputs.backend_pr != '' }}
    defaults:
      run:
        working-directory: infra/aws/rds-rehearsal
    steps:
      - uses: actions/checkout@v7
      - name: Build the trusted rehearsal image before AWS authentication
        working-directory: .
        run: docker build -t quizforge-rds-rehearsal:tested scripts/rds_rehearsal
      - name: Download tested API image
        if: inputs.backend_pr != ''
        uses: actions/download-artifact@v8
        with:
          name: tested-rds-api-image
          path: /tmp/quizforge-rds-api
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Confirm small PostgreSQL 17 instances are available
        run: |
          set -euo pipefail
          aws rds describe-orderable-db-instance-options --engine postgres --db-instance-class db.t4g.micro --output json |
            jq -e '[.OrderableDBInstanceOptions[] | select(.EngineVersion | startswith("17."))] | length > 0'
          echo "Rehearsal uses up to two temporary db.t4g.micro instances, 20 GiB gp3 each, one snapshot, and one managed owner secret."
          echo "Published Canada Central rates checked 2026-09-16: USD 0.018/instance-hour, 0.127/GB-month gp3, 0.105/GB-month excess backup storage."
          echo "Expected short rehearsal cost is below USD 1; this is an estimate, not a billing cap. Cleanup always follows."
          echo "API mode uses one database, no test snapshot, and two additional temporary secrets; no OpenAI calls."
      - name: Publish the reviewed API image by digest
        if: inputs.backend_pr != ''
        env:
          PREVIEW_SHA: ${{ needs.preview-image.outputs.sha }}
        run: |
          set -euo pipefail
          account="$(aws sts get-caller-identity --query Account --output text)"
          registry="${account}.dkr.ecr.ca-central-1.amazonaws.com"
          tag="rds-api-${PREVIEW_SHA}"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          if ! aws ecr describe-images --repository-name quizforge-api --image-ids "imageTag=$tag" >/dev/null 2>&1; then
            docker load --input /tmp/quizforge-rds-api/quizforge-rds-api.tar
            docker tag quizforge-rds-api:tested "$registry/quizforge-api:$tag"
            docker push "$registry/quizforge-api:$tag"
          fi
          digest="$(aws ecr describe-images --repository-name quizforge-api --image-ids "imageTag=$tag" --query 'imageDetails[0].imageDigest' --output text)"
          echo "TF_VAR_api_backend_image=$registry/quizforge-api@$digest" >> "$GITHUB_ENV"
          echo "RDS API preview pinned to PR commit $PREVIEW_SHA and image digest $digest."
      - name: Publish a dedicated rehearsal image tag
        run: |
          set -euo pipefail
          account="$(aws sts get-caller-identity --query Account --output text)"
          registry="${account}.dkr.ecr.ca-central-1.amazonaws.com"
          tag="rds-rehearsal-${GITHUB_SHA}"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          if ! aws ecr describe-images --repository-name quizforge-api --image-ids "imageTag=$tag" >/dev/null 2>&1; then
            docker tag quizforge-rds-rehearsal:tested "$registry/quizforge-api:$tag"
            docker push "$registry/quizforge-api:$tag"
          fi
          digest="$(aws ecr describe-images --repository-name quizforge-api --image-ids "imageTag=$tag" --query 'imageDetails[0].imageDigest' --output text)"
          echo "TF_VAR_rehearsal_image=$registry/quizforge-api@$digest" >> "$GITHUB_ENV"
      - uses: hashicorp/setup-terraform@v4
      - name: Initialize isolated rehearsal state
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=quizforge/rds-rehearsal/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - name: Create private encrypted source database
        run: terraform apply -auto-approve
      - name: Import synthetic history and verify real application privileges
        run: python -u ../../../scripts/rds_rehearsal/control.py seed
      - name: Snapshot verified data and restore to a separate private database
        if: inputs.backend_pr == ''
        run: terraform apply -auto-approve -var=restore_validation=true
      - name: Verify restored checksums, TLS, ownership and privileges
        if: inputs.backend_pr == ''
        run: python -u ../../../scripts/rds_rehearsal/control.py verify-restored
      - name: Prepare a verified dedicated Supabase canary session
        if: inputs.backend_pr != ''
        env:
          QUIZFORGE_CANARY_EMAIL: ${{ secrets.QUIZFORGE_CANARY_EMAIL }}
          QUIZFORGE_CANARY_PASSWORD: ${{ secrets.QUIZFORGE_CANARY_PASSWORD }}
        run: python -u ../../../scripts/rds_rehearsal/control.py prepare-session
      - name: Prepare isolated identity and least-privilege application credential
        if: inputs.backend_pr != ''
        run: python -u ../../../scripts/rds_rehearsal/control.py prepare-api
      - name: Test real authenticated HTTP history CRUD against private RDS
        if: inputs.backend_pr != ''
        run: python -u ../../../scripts/rds_rehearsal/control.py api
      - name: Confirm foreign-owner fixture integrity and canary row cleanup
        if: inputs.backend_pr != ''
        run: python -u ../../../scripts/rds_rehearsal/control.py verify-api

  cleanup:
    name: Destroy all RDS rehearsal resources
    needs: [validate, preview-image, rehearse]
    if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_foundation_state_bucket: ${{ vars.TF_STATE_BUCKET }}
    defaults:
      run:
        working-directory: infra/aws/rds-rehearsal
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v4
      - name: Initialize isolated rehearsal state
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=quizforge/rds-rehearsal/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - name: Stop any remaining probe tasks
        run: python -u ../../../scripts/rds_rehearsal/control.py stop-tasks
      - name: Destroy databases, snapshot, roles and networking
        if: always()
        run: terraform destroy -auto-approve
      - name: Confirm no rehearsal databases, backups, tasks or temporary secrets remain
        run: python -u ../../../scripts/rds_rehearsal/control.py confirm-absent
