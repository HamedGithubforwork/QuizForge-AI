name: Read-only retained backup activation plan
on:
  pull_request:
    paths: [scripts/backup_plan/**, .github/workflows/aws-backup-plan.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python -m py_compile scripts/backup_plan/review.py
  plan:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_VAR_alert_email: ${{ secrets.AWS_BUDGET_ALERT_EMAIL }}
      AWS_BUDGET_ALERT_EMAIL: ${{ secrets.AWS_BUDGET_ALERT_EMAIL }}
      STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 62e39f33d715cc83928390cfd5ff1728008c4053
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.16'
      - run: python -m pip install --require-hashes -r scripts/rds_rehearsal/requirements.lock
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.14.7'
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ca-central-1
          mask-aws-account-id: true
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[
              {"Effect":"Allow","Action":["sts:GetCallerIdentity","cloudwatch:DescribeAlarms"],"Resource":"*"},
              {"Effect":"Allow","Action":"iam:GetPolicy","Resource":["arn:aws:iam::*:policy/quizforge-production-backup-upload","arn:aws:iam::*:policy/quizforge-production-backup-recovery","arn:aws:iam::*:policy/quizforge-production-backup-health"]},
              {"Effect":"Allow","Action":"sns:GetTopicAttributes","Resource":"arn:aws:sns:ca-central-1:*:quizforge-production-backup-alerts"},
              {"Effect":"Allow","Action":"s3:GetBucketVersioning","Resource":"arn:aws:s3:::quizforge-production-backups-*"},
              {"Effect":"Allow","Action":["s3:ListBucket","s3:GetBucketLocation"],"Resource":"arn:aws:s3:::${{ vars.TF_STATE_BUCKET }}"},
              {"Effect":"Allow","Action":"s3:GetObject","Resource":"arn:aws:s3:::${{ vars.TF_STATE_BUCKET }}/quizforge/lightsail-backups/terraform.tfstate"}
            ]}
      - name: Refuse collisions with retained resources
        run: python scripts/backup_plan/review.py inventory
      - name: Plan the isolated backup state without locks or writes
        run: |
          terraform -chdir=candidate/infra/aws/lightsail-backups init -reconfigure -lockfile=readonly \
            -backend-config="bucket=$STATE_BUCKET" -backend-config="key=quizforge/lightsail-backups/terraform.tfstate" \
            -backend-config="region=ca-central-1" -backend-config="encrypt=true" -backend-config="use_lockfile=true" >"$RUNNER_TEMP/backup-init.log" 2>&1
          terraform -chdir=candidate/infra/aws/lightsail-backups plan -lock=false -out="$RUNNER_TEMP/backup.tfplan" >"$RUNNER_TEMP/backup-plan.log" 2>&1
          terraform -chdir=candidate/infra/aws/lightsail-backups show -json "$RUNNER_TEMP/backup.tfplan" >"$RUNNER_TEMP/backup-plan.json"
          python scripts/backup_plan/review.py "$RUNNER_TEMP/backup-plan.json"
      - uses: actions/upload-artifact@v7
        with:
          name: retained-backup-plan-summary
          path: backup-plan-results/summary.json
          retention-days: 30
