name: Approved AWS budget alerts
on:
  pull_request:
    paths: [scripts/aws_budget_alerts/**, .github/workflows/aws-budget-alerts.yml]
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect or activate the approved USD20 monthly alert budget
        type: choice
        options: [inspect, activate]
        default: inspect
        required: true
permissions:
  contents: read
concurrency:
  group: approved-aws-budget-alerts
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.16'
      - run: python -m pip install --require-hashes -r scripts/production/requirements.lock
      - run: python -m unittest discover -s scripts/aws_budget_alerts -p 'test_*.py' -v
  budget:
    name: Verify or activate only the approved budget
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.16'
      - run: python -m pip install --require-hashes -r scripts/production/requirements.lock
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[
              {"Effect":"Allow","Action":"sts:GetCallerIdentity","Resource":"*"},
              {"Effect":"Allow","Action":${{ inputs.operation == 'activate' && '["budgets:ViewBudget","budgets:ModifyBudget"]' || '["budgets:ViewBudget"]' }},"Resource":"arn:aws:budgets::*:budget/quizforge-monthly-account-cost"}
            ]}
      - name: Read back amount, coverage, thresholds and private recipient
        env:
          OPERATION: ${{ inputs.operation }}
          AWS_BUDGET_ALERT_EMAIL: ${{ secrets.AWS_BUDGET_ALERT_EMAIL }}
        run: python scripts/aws_budget_alerts/control.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: approved-budget-verification
          path: budget-results/result.json
          if-no-files-found: ignore
          retention-days: 30
