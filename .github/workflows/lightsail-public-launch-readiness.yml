name: Permanent Lightsail public launch readiness

on:
  pull_request:
    paths:
      - ".github/workflows/lightsail-public-launch-readiness.yml"
      - "scripts/production/lightsail/launch_readiness.py"
      - "scripts/production/lightsail/test_launch_readiness.py"
      - "scripts/production/lightsail/release-lock.json"
      - "scripts/production/lightsail/ssh-host-pins.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/lightsail-public-launch-readiness.yml"
      - "scripts/production/lightsail/launch_readiness.py"
      - "scripts/production/lightsail/test_launch_readiness.py"
      - "scripts/production/lightsail/release-lock.json"
      - "scripts/production/lightsail/ssh-host-pins.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - name: Compile and test public-launch readiness gate
        run: |
          python -m py_compile scripts/production/lightsail/launch_readiness.py
          python -m unittest scripts.production.lightsail.test_launch_readiness -v
      - name: Require immutable AI-disabled staged release
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          lock=json.loads(Path("scripts/production/lightsail/release-lock.json").read_text())
          assert lock["schema"]==1
          assert re.fullmatch(r"[0-9a-f]{40}",lock["release_sha"])
          assert lock["public_configuration_validated"] is True
          assert lock["ai_enabled"] is False
          PY

  inspect:
    needs: validate
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'HamedGithubforwork/QuizForge-AI'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: quizforge-permanent-lightsail-public-launch-readiness
      cancel-in-progress: false
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      LIGHTSAIL_ADMIN_IPV4_CIDR: ${{ secrets.LIGHTSAIL_ADMIN_IPV4_CIDR }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"

      - name: Install existing hash-locked AWS SDK dependencies
        run: python -m pip install --require-hashes -r scripts/rds_rehearsal/requirements.lock

      - name: Assume deployment role with launch-readiness-only boundary
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: qf-lightsail-launch-readiness
          role-duration-seconds: 1200
          aws-region: ca-central-1
          mask-aws-account-id: true
          unset-current-credentials: true
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":[
              "lightsail:GetInstance",
              "lightsail:GetStaticIp",
              "lightsail:GetInstancePortStates",
              "lightsail:OpenInstancePublicPorts",
              "lightsail:CloseInstancePublicPorts",
              "lightsail:GetInstanceAccessDetails",
              "route53:ListHostedZonesByName",
              "route53:GetHostedZone",
              "route53:ListResourceRecordSets"
            ],"Resource":"*"}]}

      - name: Verify live host and public DNS posture without launch or DNS changes
        run: python -m scripts.production.lightsail.launch_readiness

      - name: Publish only sanitized public-launch readiness result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: permanent-lightsail-public-launch-readiness
          path: lightsail-public-launch-readiness/summary.json
          if-no-files-found: error
          retention-days: 14
