name: Local AI product acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - desktop/src/local-answer-review.cjs
      - desktop/src/local-quiz-distinctness.cjs
      - desktop/scripts/verify-local-answer-review.cjs
      - desktop/test/local-answer-review.test.cjs
      - desktop/scripts/verify-local-review-native-stack.cjs
      - desktop/src/local-ai-provider.cjs
      - desktop/src/local-quiz-service.cjs
      - desktop/src/local-runtime.cjs
      - desktop/src/local-model-store.cjs
      - desktop/src/windows-local-ai-provider.cjs
      - desktop/src/windows-local-ai-stack.cjs
      - desktop/src/windows-hardware-probe.cjs
      - desktop/src/windows-process-guard.cjs
      - desktop/src/local-runtime-manifest.json
      - desktop/src/local-offload-policy.cjs
      - desktop/src/local-ai-capability.cjs
      - desktop/src/local-ai-manager.cjs
      - desktop/test/local-offload-policy.test.cjs
      - desktop/test/local-runtime.test.cjs
      - desktop/third_party/local-ai/**
      - desktop/scripts/stage-local-runtime.cjs
      - desktop/scripts/download-verified-model.cjs
      - desktop/scripts/ensure-verified-model.cjs
      - desktop/scripts/verify-local-product-acceptance.cjs
      - desktop/scripts/verify-local-product-performance.cjs
      - desktop/scripts/verify-local-choice-repair.cjs
      - desktop/scripts/verify-local-biology-sample.cjs
      - desktop/scripts/verify-local-biology-mixed.cjs
      - desktop/scripts/verify-local-biology-practice.cjs
      - desktop/scripts/verify-local-pdf-native-stack.cjs
      - desktop/test/local-weak-area-acceptance.test.cjs
      - desktop/test/pdfjs-local-engine.test.cjs
      - desktop/src/pdfjs-local-engine.cjs
      - desktop/package.json
      - desktop/package-lock.json
      - desktop/test/fixtures/biology-study-notes.json
      - e2e/tests/local-desktop-output.spec.ts
      - .github/workflows/local-ai-product-acceptance.yml

permissions:
  contents: read

concurrency:
  group: local-ai-product-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model-preparation:
    name: Prepare verified pinned Local AI model
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Restore or cache verified pinned model
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/models
          key: qfn-windows-qwen3-4b-q4km-7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5
      - name: Check SHA-256 or download pinned model on cache miss
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory "$env:RUNNER_TEMP/models" -Force | Out-Null
          node desktop/scripts/ensure-verified-model.cjs "$env:RUNNER_TEMP/models"
          exit $LASTEXITCODE

  critical-quiz:
    name: Critical Local AI biology and visible output
    needs: model-preparation
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Restore pinned model
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/models
          key: qfn-windows-qwen3-4b-q4km-7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5
          fail-on-cache-miss: false
      # Cache saving can race with another workflow run. Always verify the SHA-256;
      # on a cache miss the pinned-model verifier downloads and hashes the model.
      - name: Verify restored model SHA-256
        shell: pwsh
        run: |
          node desktop/scripts/ensure-verified-model.cjs "$env:RUNNER_TEMP/models"
          exit $LASTEXITCODE
      - name: Download and verify pinned runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          curl.exe -fL --max-time 180 -o "$env:RUNNER_TEMP/runtime.zip" 'https://github.com/ggml-org/llama.cpp/releases/download/b11317/llama-b11317-bin-win-vulkan-x64.zip'
          if ($LASTEXITCODE -ne 0) { throw 'Runtime download failed' }
          if ((Get-FileHash "$env:RUNNER_TEMP/runtime.zip" -Algorithm SHA256).Hash.ToLower() -ne 'b0cb46635aa4a028c272b74dc1966178b57157b4be199985e4d5e62cc6664338') { throw 'Runtime checksum mismatch' }
          Expand-Archive "$env:RUNNER_TEMP/runtime.zip" "$env:RUNNER_TEMP/runtime-full"
          New-Item -ItemType Directory "$env:RUNNER_TEMP/llama"
          node desktop/scripts/stage-local-runtime.cjs "$env:RUNNER_TEMP/runtime-full" "$env:RUNNER_TEMP/llama"
          exit $LASTEXITCODE
      - name: Generate from the reported three-page biology sample
        shell: pwsh
        run: |
          node desktop/scripts/verify-local-biology-sample.cjs "$env:RUNNER_TEMP/llama" "$env:RUNNER_TEMP/models" "$env:RUNNER_TEMP/local-ai-biology-sample.json"
          exit $LASTEXITCODE
      - name: Upload biology sample evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: local-ai-biology-sample-windows
          path: ${{ runner.temp }}/local-ai-biology-sample.json
          if-no-files-found: warn
          retention-days: 30
      - name: Verify actual biology quiz output appears and can be completed in Windows UI
        shell: pwsh
        working-directory: e2e
        env:
          QFN_LOCAL_BIOLOGY_REPORT: ${{ runner.temp }}/local-ai-biology-sample.json
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci --prefix ../frontend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx playwright test tests/local-desktop-output.spec.ts --project=chromium --retries=0
          exit $LASTEXITCODE
      - name: Upload Windows UI output test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: local-ai-windows-visible-output
          path: |
            e2e/test-results/
            e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
  independent-quiz-checks:
    name: Native Local AI ${{ matrix.suite }}
    needs: model-preparation
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        suite: [hard-mixed, choice-repair, pdf-native]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      # The native PDF acceptance runner loads pdfjs-dist from desktop/src.
      # Install locked dependencies before testing PDF.js or loading Qwen.
      - name: Install locked desktop PDF dependencies and smoke-test PDF.js
        if: matrix.suite == 'pdf-native'
        shell: pwsh
        run: |
          npm ci --prefix desktop --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test desktop/test/pdfjs-local-engine.test.cjs
          exit $LASTEXITCODE
      - name: Restore pinned model
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/models
          key: qfn-windows-qwen3-4b-q4km-7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5
          fail-on-cache-miss: false
      # Cache saving can race with another workflow run. Always verify the SHA-256;
      # on a cache miss the pinned-model verifier downloads and hashes the model.
      - name: Verify restored model SHA-256
        shell: pwsh
        run: |
          node desktop/scripts/ensure-verified-model.cjs "$env:RUNNER_TEMP/models"
          exit $LASTEXITCODE
      - name: Download and verify pinned runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          curl.exe -fL --max-time 180 -o "$env:RUNNER_TEMP/runtime.zip" 'https://github.com/ggml-org/llama.cpp/releases/download/b11317/llama-b11317-bin-win-vulkan-x64.zip'
          if ($LASTEXITCODE -ne 0) { throw 'Runtime download failed' }
          if ((Get-FileHash "$env:RUNNER_TEMP/runtime.zip" -Algorithm SHA256).Hash.ToLower() -ne 'b0cb46635aa4a028c272b74dc1966178b57157b4be199985e4d5e62cc6664338') { throw 'Runtime checksum mismatch' }
          Expand-Archive "$env:RUNNER_TEMP/runtime.zip" "$env:RUNNER_TEMP/runtime-full"
          New-Item -ItemType Directory "$env:RUNNER_TEMP/llama"
          node desktop/scripts/stage-local-runtime.cjs "$env:RUNNER_TEMP/runtime-full" "$env:RUNNER_TEMP/llama"
          exit $LASTEXITCODE
      - name: Reproduce fifteen hard mixed questions on the biology sample
        if: matrix.suite == 'hard-mixed'
        shell: pwsh
        run: |
          node desktop/scripts/verify-local-biology-mixed.cjs "$env:RUNNER_TEMP/llama" "$env:RUNNER_TEMP/models" "$env:RUNNER_TEMP/local-ai-biology-mixed.json"
          exit $LASTEXITCODE
      - name: Upload hard mixed biology evidence
        if: always() && matrix.suite == 'hard-mixed'
        uses: actions/upload-artifact@v7
        with:
          name: local-ai-biology-hard-mixed-windows
          path: ${{ runner.temp }}/local-ai-biology-mixed.json
          if-no-files-found: warn
          retention-days: 7
      - name: Verify duplicate-choice recovery with the real model
        if: matrix.suite == 'choice-repair'
        shell: pwsh
        run: |
          node desktop/scripts/verify-local-choice-repair.cjs "$env:RUNNER_TEMP/llama" "$env:RUNNER_TEMP/models"
          exit $LASTEXITCODE
      - name: Extract real PDF bytes and generate five strictly source-checked quiz questions offline
        if: matrix.suite == 'pdf-native'
        shell: pwsh
        run: |
          node desktop/scripts/verify-local-pdf-native-stack.cjs "$env:RUNNER_TEMP/llama" "$env:RUNNER_TEMP/models" "$env:RUNNER_TEMP/local-ai-pdf-native.json"
          exit $LASTEXITCODE
      - name: Upload PDF import and model evidence even on failure
        if: always() && matrix.suite == 'pdf-native'
        uses: actions/upload-artifact@v7
        with:
          name: local-ai-pdf-to-quiz-native-windows
          path: ${{ runner.temp }}/local-ai-pdf-native.json
          if-no-files-found: warn
          retention-days: 14

  answer-review-model:
    name: Local answer grading and distinct facts
    needs: model-preparation
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Check out repository
