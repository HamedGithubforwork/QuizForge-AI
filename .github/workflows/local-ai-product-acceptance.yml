  performance:
    name: Local AI latency and resource acceptance
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Download measured Windows quality evidence
        uses: actions/download-artifact@v4
        with:
          name: local-ai-product-acceptance-windows
          path: quality-evidence
      - name: Apply independent measured latency, memory, and CPU gate
        run: node desktop/scripts/verify-local-product-performance.cjs quality-evidence/local-ai-product-acceptance.json
