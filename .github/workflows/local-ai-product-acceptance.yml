          if-no-files-found: warn
          retention-days: 30

  quality:
    name: Local AI factual quality and edge cases
    needs: model-preparation
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Restore pinned model
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/models
          key: qfn-windows-qwen3-4b-q4km-7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5
          fail-on-cache-miss: false
      # Cache saving can race with another workflow run. Always verify the SHA-256;
