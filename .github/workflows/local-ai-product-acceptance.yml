          exit $LASTEXITCODE
      - name: Check weak-area diagnostic privacy and callback invariants
        shell: pwsh
        run: |
          node --test desktop/test/local-weak-area-acceptance.test.cjs
          exit $LASTEXITCODE
      - name: Verify independent real-model weak-area follow-up after one missed biology question
        shell: pwsh
        run: |
          node desktop/scripts/verify-local-biology-practice.cjs "$env:RUNNER_TEMP/llama" "$env:RUNNER_TEMP/models" "-" "$env:RUNNER_TEMP/local-ai-biology-practice.json"
