          if ($LASTEXITCODE -ne 0) { throw 'Runtime download failed' }
          if ((Get-FileHash "$env:RUNNER_TEMP/runtime.zip" -Algorithm SHA256).Hash.ToLower() -ne 'b0cb46635aa4a028c272b74dc1966178b57157b4be199985e4d5e62cc6664338') { throw 'Runtime checksum mismatch' }
          Expand-Archive "$env:RUNNER_TEMP/runtime.zip" "$env:RUNNER_TEMP/runtime-full"
          New-Item -ItemType Directory "$env:RUNNER_TEMP/llama"
          node desktop/scripts/stage-local-runtime.cjs "$env:RUNNER_TEMP/runtime-full" "$env:RUNNER_TEMP/llama"
          exit $LASTEXITCODE
      - name: Generate local quiz and grade through the same Windows stack
        shell: pwsh
        run: |
          node desktop/scripts/verify-local-review-native-stack.cjs "$env:RUNNER_TEMP/llama" "$env:RUNNER_TEMP/models" "$env:RUNNER_TEMP/local-review-native-stack.json"
          exit $LASTEXITCODE
      - name: Upload local stack review evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: local-review-native-stack-windows
          path: ${{ runner.temp }}/local-review-native-stack.json
          if-no-files-found: warn
