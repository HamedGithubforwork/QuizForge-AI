          if ($LASTEXITCODE -ne 0) { throw 'Runtime download failed' }
          if ((Get-FileHash "$env:RUNNER_TEMP/runtime.zip" -Algorithm SHA256).Hash.ToLower() -ne 'b0cb46635aa4a028c272b74dc1966178b57157b4be199985e4d5e62cc6664338') { throw 'Runtime checksum mismatch' }
          Expand-Archive "$env:RUNNER_TEMP/runtime.zip" "$env:RUNNER_TEMP/runtime-full"
          New-Item -ItemType Directory "$env:RUNNER_TEMP/llama"
          node desktop/scripts/stage-local-runtime.cjs "$env:RUNNER_TEMP/runtime-full" "$env:RUNNER_TEMP/llama"
          exit $LASTEXITCODE
      - name: Grade paraphrases, incomplete answers, contradictions, and duplicate facts offline
        shell: pwsh
        run: |
          node desktop/scripts/verify-local-answer-review.cjs "$env:RUNNER_TEMP/llama" "$env:RUNNER_TEMP/models" "$env:RUNNER_TEMP/local-answer-review.json"
          exit $LASTEXITCODE
      - name: Upload local answer review evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: local-answer-review-windows
          path: ${{ runner.temp }}/local-answer-review.json
          if-no-files-found: warn
          retention-days: 7

  review-stack-model:
    name: Real quiz-to-local-grading desktop lifecycle
    needs: model-preparation
    runs-on: windows-2025
