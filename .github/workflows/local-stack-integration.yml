name: Local stack integration

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "e2e/integration-tests/**"
      - "e2e/playwright.integration.config.ts"
      - "e2e/package.json"
      - "e2e/package-lock.json"
      - "supabase/**"
      - ".github/workflows/local-stack-integration.yml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "e2e/integration-tests/**"
      - "e2e/playwright.integration.config.ts"
      - "e2e/package.json"
      - "e2e/package-lock.json"
      - "supabase/**"
      - ".github/workflows/local-stack-integration.yml"

permissions:
  contents: read

concurrency:
  group: local-stack-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  real-local-stack:
    name: Browser + Supabase + FastAPI + Redis
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
          cache: pip
          cache-dependency-path: |
            backend/requirements.in
            backend/requirements.txt
            backend/requirements.lock

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip check

      - name: Install frontend and browser-test dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix e2e

      - name: Install Chromium
        run: npx --prefix e2e playwright install --with-deps chromium

      - name: Start and rebuild local Supabase
        run: |
          supabase start
          supabase db reset --local --no-seed

      - name: Configure local services and seed RLS data
        shell: bash
        run: |
          set -euo pipefail

          supabase status -o env > /tmp/quizforge-supabase.env
          set -a
          source /tmp/quizforge-supabase.env
          set +a

          : "${API_URL:?Supabase API_URL was not reported}"

          PUBLIC_KEY="${PUBLISHABLE_KEY:-${ANON_KEY:-}}"
          : "${PUBLIC_KEY:?Supabase publishable key was not reported}"

          TEST_EMAIL="quizforge-integration@example.com"
          TEST_PASSWORD="Integration123!"
          OTHER_EMAIL="quizforge-other@example.com"

          create_user() {
            local email="$1"
            local password="$2"

            curl --fail --silent --show-error \
              --request POST \
              "${API_URL}/auth/v1/signup" \
              --header "apikey: ${PUBLIC_KEY}" \
              --header "Content-Type: application/json" \
              --data "$(jq -cn \
                --arg email "${email}" \
                --arg password "${password}" \
                '{email:$email,password:$password}')"
          }

          TEST_USER_JSON="$(create_user "${TEST_EMAIL}" "${TEST_PASSWORD}")"
          OTHER_USER_JSON="$(create_user "${OTHER_EMAIL}" "${TEST_PASSWORD}")"

          TEST_USER_ID="$(jq -r '.user.id // .id // empty' <<<"${TEST_USER_JSON}")"
          OTHER_USER_ID="$(jq -r '.user.id // .id // empty' <<<"${OTHER_USER_JSON}")"

          test -n "${TEST_USER_ID}"
          test -n "${OTHER_USER_ID}"

          LOGIN_JSON="$(
            curl --fail --silent --show-error \
              --request POST \
              "${API_URL}/auth/v1/token?grant_type=password" \
              --header "apikey: ${PUBLIC_KEY}" \
              --header "Content-Type: application/json" \
              --data "$(jq -cn \
                --arg email "${TEST_EMAIL}" \
                --arg password "${TEST_PASSWORD}" \
                '{email:$email,password:$password}')"
          )"

          test -n "$(jq -r '.access_token // empty' <<<"${LOGIN_JSON}")"

          seed_history() {
            local user_id="$1"
            local title="$2"

            PGPASSWORD=postgres psql \
              postgresql://postgres:postgres@127.0.0.1:54322/postgres \
              -v ON_ERROR_STOP=1 \
              -v user_id="${user_id}" \
              -v title="${title}" \
              <<'SQL'
          INSERT INTO public.quiz_history (
            user_id,
            quiz_title,
            source_filename,
            difficulty,
            question_type,
            question_count,
            score,
            percentage,
            quiz_data,
            selected_answers
          ) VALUES (
            :'user_id'::uuid,
            :'title',
            'integration-seed.pdf',
            'medium',
            'multiple_choice',
            5,
            4,
            80,
            jsonb_build_object(
              'title', :'title',
              'questions', '[]'::jsonb
            ),
            '{}'::jsonb
          );
          SQL
          }

          seed_history "${TEST_USER_ID}" "Integration Seed Quiz"
          seed_history "${OTHER_USER_ID}" "Other User Hidden Quiz"

          {
            echo "INTEGRATION_SUPABASE_URL=${API_URL}"
            echo "INTEGRATION_SUPABASE_PUBLISHABLE_KEY=${PUBLIC_KEY}"
            echo "INTEGRATION_API_URL=http://127.0.0.1:8000"
            echo "INTEGRATION_TEST_EMAIL=${TEST_EMAIL}"
            echo "INTEGRATION_TEST_PASSWORD=${TEST_PASSWORD}"
            echo "SUPABASE_URL=${API_URL}"
            echo "SUPABASE_PUBLISHABLE_KEY=${PUBLIC_KEY}"
            echo "REDIS_URL=redis://127.0.0.1:6379/0"
            echo "ALLOWED_ORIGINS=http://127.0.0.1:4174"
          } >> "${GITHUB_ENV}"

      - name: Start production-style Redis backend
        run: |
          cd backend
          nohup python -m uvicorn main:app \
            --host 127.0.0.1 \
            --port 8000 \
            > ../backend-integration.log 2>&1 &
          echo $! > ../backend-integration.pid
          cd ..

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat backend-integration.log
          exit 1

      - name: Run real local-stack browser integration test
        run: npm --prefix e2e run test:integration

      - name: Verify Redis document cache miss and hit
        run: |
          python - <<'PY'
          from redis import Redis

          client = Redis.from_url(
              "redis://127.0.0.1:6379/0",
              decode_responses=True,
          )

          cache_keys = list(
              client.scan_iter(
                  match="quizforge:document-cache:*"
              )
          )
          misses = int(
              client.get(
                  "quizforge:metrics:document_cache_misses_total"
              )
              or 0
          )
          hits = int(
              client.get(
                  "quizforge:metrics:document_cache_hits_total"
              )
              or 0
          )

          assert len(cache_keys) >= 1, cache_keys
          assert misses >= 1, misses
          assert hits >= 1, hits
          PY

      - name: Upload integration diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: local-stack-integration-diagnostics
          path: |
            backend-integration.log
            e2e/playwright-integration-report/
            e2e/test-results/
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
