name: Refresh patched frontend dependency lock

on:
  push:
    branches:
      - security/fix-frontend-dev-advisories
    paths:
      - "frontend/package.json"
      - ".github/workflows/frontend-dependency-fix.yml"

permissions:
  contents: write

concurrency:
  group: frontend-dependency-repair
  cancel-in-progress: true

jobs:
  refresh-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Resolve patched transitive versions
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts

      - name: Install exact resolved tree
        working-directory: frontend
        run: npm ci

      - name: Require zero known npm advisories
        working-directory: frontend
        run: npm audit --audit-level=low

      - name: Run frontend unit coverage, lint and build
        working-directory: frontend
        run: |
          npm run test:coverage
          npm run lint
          npm run build

      - name: Exercise Stryker dry run with patched typed-rest-client tree
        working-directory: frontend
        run: npx stryker run --dryRunOnly

      - name: Confirm patched dependency versions
        working-directory: frontend
        run: |
          node - <<'NODE'
          const fs = require('fs')
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'))
          const exact = {
            nanoid: '3.3.18',
            postcss: '8.5.23',
            qs: '6.16.0',
          }
          for (const [name, version] of Object.entries(exact)) {
            const actual = lock.packages?.[`node_modules/${name}`]?.version
            if (actual !== version) {
              throw new Error(`${name}: expected ${version}, got ${actual}`)
            }
          }
          console.log('Patched frontend tooling dependency versions verified.')
          NODE

      - name: Commit regenerated lockfile
        run: |
          set -euo pipefail
          git add frontend/package.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency files changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate frontend lockfile with patched tooling dependencies"
          git push origin HEAD:security/fix-frontend-dev-advisories
