name: Patch mastery analytics integration

on:
  push:
    branches:
      - advanced-mastery-analytics

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: advanced-mastery-analytics

      - name: Patch history and CI integration
        run: python scripts/patch_mastery_analytics_integration.py

      - name: Commit integration patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/QuizHistory.tsx .github/workflows/ci.yml
          git diff --cached --quiet && exit 0
          git commit -m "Integrate advanced mastery analytics"
          git push origin HEAD:advanced-mastery-analytics
