name: Permanent Lightsail first production backup

on:
  pull_request:
    paths:
      - ".github/workflows/lightsail-first-production-backup.yml"
      - "scripts/production/lightsail/activate_backup_host.py"
      - "scripts/production/lightsail/test_activate_backup_host.py"
      - "scripts/production/lightsail_backup.py"
      - "scripts/production/lightsail_backup_job.py"
      - "scripts/production/transfer.py"
      - "scripts/production/systemd/**"
      - "scripts/production/requirements.lock"
  push:
    branches: [main]
    paths:
      - ".github/workflows/lightsail-first-production-backup.yml"
      - "scripts/production/lightsail/activate_backup_host.py"
      - "scripts/production/lightsail/test_activate_backup_host.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - name: Install locked controller dependencies
        run: python -m pip install --require-hashes -r scripts/production/requirements.lock
      - name: Validate first-backup controller
        run: |
          python -m py_compile scripts/production/lightsail/activate_backup_host.py
          python -m unittest scripts.production.lightsail.test_activate_backup_host -v
          PYTHONPATH=scripts/production python -m unittest scripts.production.test_lightsail_backup scripts.production.test_lightsail_backup_job -v
      - name: Validate prepared systemd units without installing them
        run: |
          mkdir -p /tmp/quizforge-backup-unit-check
          cp scripts/production/systemd/* /tmp/quizforge-backup-unit-check/
          sed -i 's@^ExecStart=.*@ExecStart=/usr/bin/true@; s@^ExecStartPost=.*@ExecStartPost=/usr/bin/true@' /tmp/quizforge-backup-unit-check/*.service
          systemd-analyze verify /tmp/quizforge-backup-unit-check/*

  first-backup:
    needs: validate
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'HamedGithubforwork/QuizForge-AI' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: quizforge-permanent-first-production-backup
      cancel-in-progress: false
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      LIGHTSAIL_ADMIN_IPV4_CIDR: ${{ secrets.LIGHTSAIL_ADMIN_IPV4_CIDR }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - name: Install locked controller dependencies
        run: python -m pip install --require-hashes -r scripts/production/requirements.lock
      - name: Assume tightly bounded first-backup activation session
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: qf-first-production-backup
          role-duration-seconds: 1200
          aws-region: ca-central-1
          mask-aws-account-id: true
          unset-current-credentials: true
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[
              {"Effect":"Allow","Action":["sts:GetCallerIdentity"],"Resource":"*"},
              {"Effect":"Allow","Action":[
                "iam:GetUser","iam:CreateUser","iam:TagUser","iam:ListAttachedUserPolicies","iam:AttachUserPolicy",
                "iam:ListUserPolicies","iam:ListGroupsForUser","iam:ListAccessKeys","iam:CreateAccessKey","iam:DeleteAccessKey"
              ],"Resource":["arn:aws:iam::*:user/quizforge-production-backup-*","arn:aws:iam::*:policy/quizforge-production-backup-*"]},
              {"Effect":"Allow","Action":["ssm:GetParameter","ssm:PutParameter","ssm:AddTagsToResource"],"Resource":"arn:aws:ssm:ca-central-1:*:parameter/quizforge/production/backup-*"},
              {"Effect":"Allow","Action":[
                "lightsail:GetInstance","lightsail:GetStaticIp","lightsail:GetInstancePortStates",
                "lightsail:OpenInstancePublicPorts","lightsail:CloseInstancePublicPorts","lightsail:GetInstanceAccessDetails"
              ],"Resource":"*"},
              {"Effect":"Allow","Action":["s3:GetBucketVersioning"],"Resource":"arn:aws:s3:::quizforge-production-backups-*"},
              {"Effect":"Allow","Action":["s3:GetObject","s3:GetObjectVersion"],"Resource":"arn:aws:s3:::quizforge-production-backups-*/*"},
              {"Effect":"Allow","Action":["cloudwatch:GetMetricStatistics","cloudwatch:DescribeAlarms"],"Resource":"*"},
              {"Effect":"Allow","Action":["sns:Publish"],"Resource":"arn:aws:sns:ca-central-1:*:quizforge-production-backup-alerts"}
            ]}
      - name: Install backup host components and store one real recovery point
        run: python -m scripts.production.lightsail.activate_backup_host
      - name: Publish sanitized first-backup result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: permanent-lightsail-first-production-backup
          path: lightsail-first-backup-results/summary.json
          if-no-files-found: error
          retention-days: 30
