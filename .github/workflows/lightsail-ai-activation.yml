name: Permanent Lightsail AI activation

on:
  pull_request:
    paths:
      - ".github/workflows/lightsail-ai-activation.yml"
      - "scripts/production/lightsail/activate_ai.py"
      - "scripts/production/lightsail/test_activate_ai.py"
      - "scripts/production/generation_costs.py"
      - "scripts/production/generation_guard.py"
      - "scripts/production/generation_budget.sql"
  push:
    branches: [main]
    paths:
      - ".github/workflows/lightsail-ai-activation.yml"
      - "scripts/production/lightsail/activate_ai.py"
      - "scripts/production/lightsail/test_activate_ai.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - name: Validate guarded AI activation
        run: |
          python -m py_compile scripts/production/lightsail/activate_ai.py
          python -m unittest scripts.production.lightsail.test_activate_ai -v
          python -m unittest scripts.production.test_generation_costs -v

  activate:
    needs: validate
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'HamedGithubforwork/QuizForge-AI' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: quizforge-permanent-lightsail-ai-activation
      cancel-in-progress: false
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      LIGHTSAIL_ADMIN_IPV4_CIDR: ${{ secrets.LIGHTSAIL_ADMIN_IPV4_CIDR }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - name: Install existing hash-locked AWS SDK dependencies
        run: python -m pip install --require-hashes -r scripts/rds_rehearsal/requirements.lock
      - name: Assume AI-activation-only Lightsail boundary
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: qf-lightsail-ai-activation
          role-duration-seconds: 900
          aws-region: ca-central-1
          mask-aws-account-id: true
          unset-current-credentials: true
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":[
              "lightsail:GetInstance","lightsail:GetStaticIp","lightsail:GetInstancePortStates",
              "lightsail:OpenInstancePublicPorts","lightsail:CloseInstancePublicPorts","lightsail:GetInstanceAccessDetails"
            ],"Resource":"*"}]}
      - name: Install live model key, enable USD5 policy, and run one paid synthetic canary
        run: python -m scripts.production.lightsail.activate_ai
      - name: Publish sanitized AI activation result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: permanent-lightsail-ai-activation
          path: lightsail-ai-activation-results/summary.json
          if-no-files-found: error
          retention-days: 30
