name: Permanent Lightsail study notifier activation

on:
  pull_request:
    paths:
      - ".github/workflows/lightsail-study-notifier-activation.yml"
      - "scripts/production/lightsail/enable_study_notifier.py"
      - "scripts/production/lightsail/test_enable_study_notifier.py"
      - "scripts/production/lightsail/quizforge-study-notifier.service"
      - "scripts/production/lightsail/quizforge-study-notifier.timer"
      - "scripts/production/lightsail/host_control.py"
      - "scripts/production/lightsail/ssh-host-pins.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"

      - name: Install locked controller dependencies
        run: python -m pip install --require-hashes -r scripts/production/requirements.lock

      - name: Validate study notifier activation
        run: |
          python -m py_compile scripts/production/lightsail/enable_study_notifier.py
          python -m unittest scripts.production.lightsail.test_enable_study_notifier -v
          mkdir -p /tmp/quizforge-study-notifier-unit-check
          cp scripts/production/lightsail/quizforge-study-notifier.service /tmp/quizforge-study-notifier-unit-check/
          cp scripts/production/lightsail/quizforge-study-notifier.timer /tmp/quizforge-study-notifier-unit-check/
          cat > /tmp/quizforge-study-notifier-unit-check/quizforge.service <<'EOF'
          [Unit]
          Description=Synthetic QuizForge parent service for unit verification

          [Service]
          Type=oneshot
          ExecStart=/usr/bin/true
          RemainAfterExit=yes
          EOF
          sed -i 's@^ExecStart=.*@ExecStart=/usr/bin/true@' /tmp/quizforge-study-notifier-unit-check/quizforge-study-notifier.service
          systemd-analyze verify /tmp/quizforge-study-notifier-unit-check/*

  activate:
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'HamedGithubforwork/QuizForge-AI' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: quizforge-permanent-study-notifier-activation
      cancel-in-progress: false
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      LIGHTSAIL_ADMIN_IPV4_CIDR: ${{ secrets.LIGHTSAIL_ADMIN_IPV4_CIDR }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"

      - name: Install locked controller dependencies
        run: python -m pip install --require-hashes -r scripts/production/requirements.lock

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: qf-enable-study-notifier
          role-duration-seconds: 900
          aws-region: ca-central-1
          mask-aws-account-id: true
          unset-current-credentials: true
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":[
              "lightsail:GetInstance",
              "lightsail:GetStaticIp",
              "lightsail:GetInstancePortStates",
              "lightsail:OpenInstancePublicPorts",
              "lightsail:CloseInstancePublicPorts",
              "lightsail:GetInstanceAccessDetails"
            ],"Resource":"*"}]}

      - name: Enable reviewed study notifier timer
        run: python -m scripts.production.lightsail.enable_study_notifier

      - name: Publish sanitized notifier activation result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: permanent-lightsail-study-notifier-activation
          path: lightsail-study-notifier-activation/summary.json
          if-no-files-found: error
          retention-days: 30
