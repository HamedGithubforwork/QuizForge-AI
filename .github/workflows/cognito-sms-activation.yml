name: Cognito SMS MFA readiness and activation

on:
  pull_request:
    paths:
      - ".github/workflows/cognito-sms-activation.yml"
      - "scripts/production/cognito_sms_activation.py"
      - "scripts/production/test_cognito_sms_activation.py"
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect readiness or activate SMS MFA
        type: choice
        options: [inspect, activate]
        default: inspect
        required: true
      origination_identity_arn:
        description: For activate only; exact ca-central-1 SMS phone-number or pool ARN
        type: string
        required: false
        default: ""
      confirmation:
        description: For activate only; type ENABLE COGNITO SMS MFA
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - name: Install locked AWS SDK dependencies
        run: python -m pip install --require-hashes -r scripts/production/requirements.lock
      - name: Validate guarded SMS controller
        run: |
          python -m py_compile scripts/production/cognito_sms_activation.py
          python -m unittest scripts.production.test_cognito_sms_activation -v

  operate:
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'HamedGithubforwork/QuizForge-AI'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: quizforge-production-cognito-sms
      cancel-in-progress: false
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      QF_SMS_CONFIRMATION: ${{ inputs.confirmation }}
      QF_SMS_ORIGINATION_IDENTITY_ARN: ${{ inputs.origination_identity_arn }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - name: Install locked AWS SDK dependencies
        run: python -m pip install --require-hashes -r scripts/production/requirements.lock

      - name: Assume read-only SMS inspection boundary
        if: inputs.operation == 'inspect'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: qf-cognito-sms-inspect
          role-duration-seconds: 900
          aws-region: ca-central-1
          mask-aws-account-id: true
          unset-current-credentials: true
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[
              {"Effect":"Allow","Action":["sts:GetCallerIdentity"],"Resource":"*"},
              {"Effect":"Allow","Action":[
                "sms-voice:DescribeAccountAttributes",
                "sms-voice:DescribePhoneNumbers",
                "sms-voice:DescribePools"
              ],"Resource":"*"},
              {"Effect":"Allow","Action":[
                "cognito-idp:ListUserPools",
                "cognito-idp:DescribeUserPool",
                "cognito-idp:GetUserPoolMfaConfig"
              ],"Resource":"*"}
            ]}

      - name: Assume SMS activation boundary
        if: inputs.operation == 'activate'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: qf-cognito-sms-activate
          role-duration-seconds: 900
          aws-region: ca-central-1
          mask-aws-account-id: true
          unset-current-credentials: true
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[
              {"Effect":"Allow","Action":["sts:GetCallerIdentity"],"Resource":"*"},
              {"Effect":"Allow","Action":[
                "sms-voice:DescribeAccountAttributes",
                "sms-voice:DescribePhoneNumbers",
                "sms-voice:DescribePools"
              ],"Resource":"*"},
              {"Effect":"Allow","Action":[
                "cognito-idp:ListUserPools",
                "cognito-idp:DescribeUserPool",
                "cognito-idp:ListUserPoolClients",
                "cognito-idp:DescribeUserPoolClient",
                "cognito-idp:GetUserPoolMfaConfig",
                "cognito-idp:UpdateUserPool",
                "cognito-idp:UpdateUserPoolClient",
                "cognito-idp:SetUserPoolMfaConfig"
              ],"Resource":"*"},
              {"Effect":"Allow","Action":[
                "iam:GetRole",
                "iam:CreateRole",
                "iam:GetRolePolicy",
                "iam:PutRolePolicy",
                "iam:PassRole"
              ],"Resource":"arn:aws:iam::*:role/quizforge-production-cognito-sms"}
            ]}

      - name: Inspect sanitized SMS readiness
        if: inputs.operation == 'inspect'
        run: python scripts/production/cognito_sms_activation.py inspect

      - name: Enable optional SMS MFA with exact reviewed identity
        if: inputs.operation == 'activate'
        run: >-
          python scripts/production/cognito_sms_activation.py
          activate "$QF_SMS_ORIGINATION_IDENTITY_ARN"

      - name: Publish sanitized SMS result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cognito-sms-${{ inputs.operation }}
          path: cognito-sms-activation-results/summary.json
          if-no-files-found: error
          retention-days: 30
