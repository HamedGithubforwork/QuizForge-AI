name: Activate Cognito SMS MFA

on:
  pull_request:
    paths:
      - ".github/workflows/cognito-sms-activation.yml"
      - "scripts/production/cognito_sms_activation.py"
      - "scripts/production/test_cognito_sms_activation.py"
      - ".github/workflows/cognito-sms-readiness.yml"
      - ".github/workflows/lightsail-frontend-hotfix.yml"
  workflow_dispatch:
    inputs:
      origination_identity_arn:
        description: Exact ca-central-1 AWS End User Messaging SMS phone-number or pool ARN
        type: string
        required: true
      confirmation:
        description: Type ENABLE COGNITO SMS MFA
        type: string
        required: true
        default: ""

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - name: Install locked AWS SDK dependencies
        run: python -m pip install --require-hashes -r scripts/production/requirements.lock
      - name: Validate guarded SMS activation controller
        run: |
          python -m py_compile scripts/production/cognito_sms_activation.py
          python -m unittest scripts.production.test_cognito_sms_activation -v

  activate:
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'HamedGithubforwork/QuizForge-AI' &&
      inputs.confirmation == 'ENABLE COGNITO SMS MFA'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: quizforge-production-cognito-sms-activation
      cancel-in-progress: false
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      QF_SMS_CONFIRMATION: ${{ inputs.confirmation }}
      QF_SMS_ORIGINATION_IDENTITY_ARN: ${{ inputs.origination_identity_arn }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - name: Install locked AWS SDK dependencies
        run: python -m pip install --require-hashes -r scripts/production/requirements.lock

      - name: Assume SMS-activation-only production boundary
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: qf-cognito-sms-activation
          role-duration-seconds: 900
          aws-region: ca-central-1
          mask-aws-account-id: true
          unset-current-credentials: true
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[
              {"Effect":"Allow","Action":["sts:GetCallerIdentity"],"Resource":"*"},
              {"Effect":"Allow","Action":[
                "sms-voice:DescribeAccountAttributes",
                "sms-voice:DescribePhoneNumbers",
                "sms-voice:DescribePools"
              ],"Resource":"*"},
              {"Effect":"Allow","Action":[
                "cognito-idp:ListUserPools",
                "cognito-idp:DescribeUserPool",
                "cognito-idp:ListUserPoolClients",
                "cognito-idp:DescribeUserPoolClient",
                "cognito-idp:GetUserPoolMfaConfig",
                "cognito-idp:UpdateUserPool",
                "cognito-idp:UpdateUserPoolClient",
                "cognito-idp:SetUserPoolMfaConfig"
              ],"Resource":"*"},
              {"Effect":"Allow","Action":[
                "iam:GetRole",
                "iam:CreateRole",
                "iam:GetRolePolicy",
                "iam:PutRolePolicy",
                "iam:PassRole"
              ],"Resource":"arn:aws:iam::*:role/quizforge-production-cognito-sms"}
            ]}

      - name: Require production tier and an exact SMS-capable origination identity
        run: >-
          python scripts/production/cognito_sms_activation.py
          preflight "$QF_SMS_ORIGINATION_IDENTITY_ARN"

      - name: Create scoped role, preserve Cognito settings and enable optional SMS MFA
        run: >-
          python scripts/production/cognito_sms_activation.py
          activate "$QF_SMS_ORIGINATION_IDENTITY_ARN"

      - name: Publish sanitized activation result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cognito-sms-activation
          path: cognito-sms-activation-results/summary.json
          if-no-files-found: error
          retention-days: 30
