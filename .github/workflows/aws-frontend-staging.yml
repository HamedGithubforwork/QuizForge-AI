name: AWS frontend staging

on:
  pull_request:
    paths:
      - "infra/aws/frontend-staging/**"
      - "scripts/frontend_staging/**"
      - ".github/workflows/aws-frontend-staging.yml"
  workflow_dispatch:
    inputs:
      operation:
        description: "Validate temporary frontend hosting and destroy, or stop"
        type: choice
        required: true
        options: [run, stop]
      application_pr:
        description: "Reviewed application PR with passing checks"
        type: string
        default: "97"
  schedule:
    - cron: "37 * * * *"

permissions:
  contents: read
concurrency:
  group: quizforge-frontend-staging
  cancel-in-progress: false
env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  validate:
    name: Frontend hosting security and artifact guards
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'run')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - name: Install locked controller dependencies
        run: python -m pip install --require-hashes -r scripts/rds_rehearsal/requirements.lock
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Test artifacts, deletion verification and edge routes
        run: |
          python -m unittest discover -s scripts/frontend_staging -p 'test_*.py' -v
          node --test scripts/frontend_staging/routes.test.mjs
          node --check scripts/frontend_staging/browser.mjs
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - name: Validate isolated frontend Terraform
        run: |
          terraform -chdir=infra/aws/frontend-staging fmt -check
          terraform -chdir=infra/aws/frontend-staging init -backend=false -lockfile=readonly
          terraform -chdir=infra/aws/frontend-staging validate

  build:
    name: Build reviewed frontend without AWS credentials
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require passing checks on exact application commit
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_PR: ${{ inputs.application_pr || '97' }}
          REQUIRE_POSTGRES_HISTORY: "1"
        run: python scripts/aws_staging_preview.py
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.preview.outputs.sha }}
          path: preview-source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - name: Build only isolated hosting settings and validate artifact manifest
        run: |
          python -m pip install --require-hashes -r scripts/rds_rehearsal/requirements.lock
          python scripts/frontend_staging/build.py preview-source/frontend
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        with:
          name: reviewed-frontend
          path: |
            hosting-dist/
            hosting-manifest.json
          retention-days: 1

  deploy:
    name: Deploy temporary private S3 and CloudFront
    needs: [validate, build]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation == 'run'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    outputs:
      url: ${{ steps.publish.outputs.url }}
      origin: ${{ steps.publish.outputs.origin }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: reviewed-frontend
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - name: Install locked controller before OIDC
        run: python -m pip install --require-hashes -r scripts/rds_rehearsal/requirements.lock
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ca-central-1
      - name: Initialize isolated state
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          terraform -chdir=infra/aws/frontend-staging init -reconfigure -lockfile=readonly \
            -backend-config="bucket=$STATE_BUCKET" -backend-config="key=quizforge/frontend-staging/terraform.tfstate" \
            -backend-config="region=ca-central-1" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - name: Require empty staging and set one-hour expiry
        run: python scripts/frontend_staging/control.py configure
      - name: Create disposable hosting
        run: terraform -chdir=infra/aws/frontend-staging apply -auto-approve
      - name: Verify private origin and publish checked artifacts
        id: publish
        run: python scripts/frontend_staging/control.py publish

  browser:
    name: Live CloudFront and React browser validation
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A separate runner has no OIDC permission or AWS credentials.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: reviewed-frontend
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install trusted browser test dependencies
        run: |
          npm ci --prefix e2e --ignore-scripts
          npx --prefix e2e playwright install --with-deps chromium
      - name: Verify HTTPS, private S3, caching and browser rendering
        env:
          HOSTING_URL: ${{ needs.deploy.outputs.url }}
          ORIGIN_URL: ${{ needs.deploy.outputs.origin }}
        run: node scripts/frontend_staging/browser.mjs

  cleanup:
    name: Destroy frontend staging and verify absence
    needs: [validate, build, deploy, browser]
    if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - name: Install locked controller before OIDC
        run: python -m pip install --require-hashes -r scripts/rds_rehearsal/requirements.lock
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ca-central-1
      - name: Initialize only frontend staging state
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          terraform -chdir=infra/aws/frontend-staging init -reconfigure -lockfile=readonly \
            -backend-config="bucket=$STATE_BUCKET" -backend-config="key=quizforge/frontend-staging/terraform.tfstate" \
            -backend-config="region=ca-central-1" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - name: Destroy distribution and empty disposable bucket
        run: terraform -chdir=infra/aws/frontend-staging destroy -auto-approve
      - name: Verify AWS resource absence independently of Terraform
        run: python scripts/frontend_staging/control.py absent
