services:
  - type: web
    name: quizforge-ai-api
    runtime: docker
    plan: free
    region: ohio
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --no-access-log
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.16"
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: REDIS_URL
        sync: false
      - key: QUIZ_RATE_LIMIT
        value: "10"
      - key: QUIZ_RATE_WINDOW_SECONDS
        value: "600"
      - key: QUIZ_CACHE_TTL_SECONDS
        value: "3600"
      - key: QUIZ_CACHE_VERSION
        value: "v1"
      - key: DOCUMENT_CACHE_TTL_SECONDS
        value: "86400"
      - key: DOCUMENT_CACHE_MAX_BYTES
        value: "1500000"
      - key: DOCUMENT_CACHE_VERSION
        value: "v2"
