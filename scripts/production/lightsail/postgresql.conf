listen_addresses = '*'
port = 5432
max_connections = 20
shared_buffers = '32MB'
work_mem = '2MB'
maintenance_work_mem = '16MB'
max_wal_size = '256MB'
min_wal_size = '80MB'
ssl = on
ssl_min_protocol_version = 'TLSv1.2'
ssl_cert_file = '/run/quizforge/server.crt'
ssl_key_file = '/run/quizforge/server.key'
hba_file = '/etc/postgresql/pg_hba.conf'
password_encryption = 'scram-sha-256'
log_statement = 'none'
log_min_error_statement = 'panic'
log_parameter_max_length_on_error = 0
log_connections = off
log_disconnections = off
